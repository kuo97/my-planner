/* ---------- 구글 캘린더 연동 (읽기 전용, 리프레시 토큰 방식) ----------
   앱이 서버 없는 정적 페이지라, 액세스 토큰만 쓰는 방식은 브라우저가
   구글 로그인 세션을 못 읽으면(서드파티 쿠키 차단 등) 조용히 재연결이
   실패해서 앱을 껐다 켤 때마다 연동이 풀린 것처럼 보였다. 이제는
   승인 코드 흐름(redirect)으로 리프레시 토큰을 직접 받아 localStorage에
   저장해두고, 필요할 때마다 그 토큰으로 새 액세스 토큰을 발급받는다 —
   브라우저 쿠키 상태와 무관하게 항상 동작한다. */
const GOOGLE_CLIENT_ID = "603542528567-cmma9t897a1uchcgov1uv0ab7qu75pje.apps.googleusercontent.com";
// client_secret 은 브라우저에 두지 않는다 → /api/gcal-token (Vercel 서버 함수, 환경변수) 에서만 사용
const GCAL_TOKEN_API = "https://my-planner-fawn-nine.vercel.app/api/gcal-token";
const GCAL_REDIRECT_URI = "https://my-planner-fawn-nine.vercel.app/";
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
const GCAL_REFRESH_KEY = "gcal_refresh_token";
const GCAL_ACCESS_KEY = "gcal_access_token";
const GCAL_ACCESS_EXP_KEY = "gcal_access_expiry";

let gcalToken = null; // 현재 메모리상의 액세스 토큰
let gcalEvents = []; // [{id, date: "YYYY-MM-DD", time: "14:00" | null, title, htmlLink}]
let gcalLoadedMonths = new Set(); // "YYYY-MM" 단위로 이미 불러온 달 캐시

function gcalIsConnected() {
  return !!gcalToken || !!localStorage.getItem(GCAL_REFRESH_KEY);
}

/* ---- 연동 상태 로그: 연동이 풀렸을 때 "왜"를 화면에서 바로 확인하려고 남긴다 (최근 40건) ---- */
const GCAL_LOG_KEY = "gcal_log";
function escapeHtml(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }
function gcalLog(msg) {
  try {
    const log = gcalLogEntries();
    const d = new Date(), p = n => String(n).padStart(2, "0");
    log.push(`${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} ${msg}`);
    localStorage.setItem(GCAL_LOG_KEY, JSON.stringify(log.slice(-40)));
  } catch {}
}
function gcalLogEntries() {
  try { return JSON.parse(localStorage.getItem(GCAL_LOG_KEY) || "[]"); } catch { return []; }
}
function gcalLastStatus() {
  const log = gcalLogEntries();
  return log.length ? log[log.length - 1] : "";
}

/* ---- 리프레시 토큰을 DB(user_settings)에도 보관 ----
   브라우저 localStorage는 기기·주소(vercel/github.io)마다 따로라서, 한 곳에서만 연동하면
   다른 곳에선 "풀린 것"처럼 보이고, 어느 한 곳에서 해제하면 구글이 그 계정의 권한 전체를
   철회해 나머지도 같이 죽는다. DB에 한 벌만 두고 모든 기기가 그걸 쓰게 한다. */
async function gcalSaveTokenToDb(token) {
  try {
    const { error } = await sb.from("user_settings")
      .upsert({ user_id: user.id, gcal_refresh_token: token, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
    if (error) gcalLog("DB 저장 실패: " + error.message);
  } catch (e) { gcalLog("DB 저장 실패: " + e.message); }
}
async function gcalLoadTokenFromDb() {
  try {
    const { data, error } = await sb.from("user_settings").select("gcal_refresh_token").eq("user_id", user.id).maybeSingle();
    if (error) { gcalLog("DB 조회 실패: " + error.message); return null; }
    return data?.gcal_refresh_token || null;
  } catch (e) { gcalLog("DB 조회 실패: " + e.message); return null; }
}
/* onlyIfEquals를 주면 DB에 그 토큰이 그대로 있을 때만 지운다 — 다른 기기가 방금 새로 연동한 토큰을 실수로 지우지 않기 위해 */
async function gcalClearTokenInDb(onlyIfEquals) {
  try {
    let q = sb.from("user_settings").update({ gcal_refresh_token: null, updated_at: new Date().toISOString() }).eq("user_id", user.id);
    if (onlyIfEquals) q = q.eq("gcal_refresh_token", onlyIfEquals);
    await q;
  } catch {}
}
/* 앱 시작 시: DB에 토큰이 있으면 그걸 쓰고(다른 기기에서 연동한 것 포함), 없으면 이 기기 것을 DB에 올린다 */
async function gcalSyncTokenWithDb() {
  const local = localStorage.getItem(GCAL_REFRESH_KEY);
  const remote = await gcalLoadTokenFromDb();
  if (remote && remote !== local) {
    localStorage.setItem(GCAL_REFRESH_KEY, remote);
    localStorage.removeItem(GCAL_ACCESS_KEY);
    localStorage.removeItem(GCAL_ACCESS_EXP_KEY);
    gcalToken = null;
    gcalLog(local ? "DB의 새 토큰으로 교체" : "DB에서 토큰 복구");
  } else if (!remote && local) {
    await gcalSaveTokenToDb(local);
    gcalLog("이 기기의 토큰을 DB에 백업");
  }
}

function connectGoogleCalendar() {
  const params = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: GCAL_REDIRECT_URI,
    response_type: "code",
    scope: GCAL_SCOPE,
    access_type: "offline",
    prompt: "consent",
  });
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

async function disconnectGoogleCalendar() {
  const token = localStorage.getItem(GCAL_REFRESH_KEY) || gcalToken || localStorage.getItem(GCAL_ACCESS_KEY);
  if (token) fetch(`https://oauth2.googleapis.com/revoke?token=${token}`, { method: "POST" }).catch(() => {});
  gcalToken = null;
  gcalEvents = [];
  gcalLoadedMonths = new Set();
  localStorage.removeItem(GCAL_REFRESH_KEY);
  localStorage.removeItem(GCAL_ACCESS_KEY);
  localStorage.removeItem(GCAL_ACCESS_EXP_KEY);
  gcalLog("사용자가 연동 해제");
  await gcalClearTokenInDb(null);
  render();
  toast("구글 캘린더 연동을 해제했어요 (모든 기기에서 해제됨)");
}

async function gcalExchangeCode(code) {
  try {
    const res = await fetch(GCAL_TOKEN_API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, redirect_uri: GCAL_REDIRECT_URI }),
    });
    const data = await res.json();
    if (!res.ok) { toast("구글 캘린더 연동 실패: " + (data.error_description || data.error)); return; }
    gcalToken = data.access_token;
    localStorage.setItem(GCAL_ACCESS_KEY, data.access_token);
    localStorage.setItem(GCAL_ACCESS_EXP_KEY, String(Date.now() + data.expires_in * 1000));
    if (data.refresh_token) {
      localStorage.setItem(GCAL_REFRESH_KEY, data.refresh_token);
      gcalLog("새로 연동 (" + location.host + ")");
      await gcalSaveTokenToDb(data.refresh_token);
    } else {
      gcalLog("주의: 구글이 리프레시 토큰 없이 발급함");
    }
    toast("구글 캘린더 연동됐어요");
  } catch (e) {
    toast("구글 캘린더 연동 실패: " + e.message);
  }
}

async function gcalRefreshAccessToken() {
  const refresh = localStorage.getItem(GCAL_REFRESH_KEY);
  if (!refresh) return false;
  try {
    const res = await fetch(GCAL_TOKEN_API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 진짜로 재연동이 필요한 건 토큰이 만료·철회됐을 때(invalid_grant)뿐이다.
      // 429/5xx나 일시적 네트워크 오류에 토큰을 지워버리면 멀쩡한 연동이 끊긴다
      // (예전엔 이것 때문에 며칠에 한 번씩 연동이 풀렸다).
      const fatal = data.error === "invalid_grant" || data.error === "invalid_client";
      gcalLog(`갱신 실패 ${res.status} ${data.error || ""} ${data.error_description || ""}`.trim() + (fatal ? " → 토큰 폐기" : " (일시적, 유지)"));
      if (!fatal) return false;
      localStorage.removeItem(GCAL_REFRESH_KEY);
      localStorage.removeItem(GCAL_ACCESS_KEY);
      localStorage.removeItem(GCAL_ACCESS_EXP_KEY);
      gcalToken = null;
      await gcalClearTokenInDb(refresh);
      // 다른 기기에서 그 사이 새로 연동해 둔 토큰이 DB에 있으면 그걸로 이어간다
      const remote = await gcalLoadTokenFromDb();
      if (remote && remote !== refresh) {
        localStorage.setItem(GCAL_REFRESH_KEY, remote);
        gcalLog("DB의 다른 토큰으로 재시도");
        return await gcalRefreshAccessToken();
      }
      toast("구글 캘린더 연동이 만료됐어요. 다시 연동해주세요");
      render();
      return false;
    }
    gcalToken = data.access_token;
    localStorage.setItem(GCAL_ACCESS_KEY, data.access_token);
    localStorage.setItem(GCAL_ACCESS_EXP_KEY, String(Date.now() + data.expires_in * 1000));
    gcalLog("갱신 성공");
    return true;
  } catch (e) {
    gcalLog("갱신 실패 네트워크: " + e.message + " (유지)");
    return false;
  }
}

/* 액세스 토큰이 유효(1분 이상 여유)하면 그대로 쓰고, 아니면 리프레시 토큰으로 새로 발급 */
async function gcalEnsureToken() {
  const exp = Number(localStorage.getItem(GCAL_ACCESS_EXP_KEY) || 0);
  if (gcalToken && Date.now() < exp - 60000) return true;
  // 새로고침 직후엔 아직 살아있는 액세스 토큰이 저장돼 있으니 굳이 갱신 요청을 보내지 않는다
  const saved = localStorage.getItem(GCAL_ACCESS_KEY);
  if (saved && Date.now() < exp - 60000) { gcalToken = saved; return true; }
  // 일시적 오류(네트워크·5xx)는 잠깐 뒤 다시 시도. 진짜 만료면 토큰이 지워져 있으니 바로 포기.
  const waits = [1500, 5000];
  for (let i = 0; i <= waits.length; i++) {
    if (await gcalRefreshAccessToken()) return true;
    if (!localStorage.getItem(GCAL_REFRESH_KEY)) return false;
    if (i < waits.length) await new Promise(r => setTimeout(r, waits[i]));
  }
  return false;
}

/* 그 날짜에 걸쳐 있는 일정 전부 (여러 날짜에 걸친 일정은 중간 날짜에도 잡힌다) */
function gcalEventsOn(d) {
  return gcalEvents
    .filter(e => e.date <= d && (e.endDate || e.date) >= d)
    .sort((a, b) => (a.time || "").localeCompare(b.time || ""));
}

/* 한 주(weekDatesArr = 그 주의 7개 날짜)에 그릴 일정 막대들을 계산한다.
   여러 날 걸친 일정은 주 경계에서 잘라 이어지는 막대로 만들고, 서로 안 겹치게 레인(줄)을 배정한다. */
function calWeekBars(weekDatesArr) {
  const weekStart = weekDatesArr[0], weekEnd = weekDatesArr[6];
  const segs = [];
  gcalEvents.forEach(ev => {
    const s = ev.date, e = ev.endDate || ev.date;
    if (e < weekStart || s > weekEnd) return;
    segs.push({
      ev,
      from: s < weekStart ? weekStart : s,
      to: e > weekEnd ? weekEnd : e,
      contL: s < weekStart,   // 지난 주에서 이어짐
      contR: e > weekEnd,     // 다음 주로 이어짐
      multi: e > s,
    });
  });
  // 여러 날짜 일정을 위쪽 줄에 먼저 놓고, 그 다음 시작일·시각 순
  segs.sort((a, b) =>
    (b.multi - a.multi) ||
    a.from.localeCompare(b.from) ||
    (a.ev.time || "").localeCompare(b.ev.time || ""));
  const lanes = [];
  segs.forEach(s => {
    let i = 0;
    while (lanes[i] && lanes[i].some(x => !(s.to < x.from || s.from > x.to))) i++;
    (lanes[i] = lanes[i] || []).push({ from: s.from, to: s.to });
    s.lane = i;
    s.startIdx = weekDatesArr.indexOf(s.from);
    s.span = weekDatesArr.indexOf(s.to) - s.startIdx + 1;
  });
  return { segs, laneCount: lanes.length };
}

/* y=연도, m=0-based 월. 이미 불러온 달이면 캐시된 gcalEvents를 그대로 쓰고 아무것도 안 함 */
async function ensureGCalMonth(y, m, retried) {
  const key = `${y}-${String(m + 1).padStart(2, "0")}`;
  if (gcalLoadedMonths.has(key)) return;
  const ok = await gcalEnsureToken();
  if (!ok) return;
  gcalLoadedMonths.add(key);
  const timeMin = new Date(y, m, 1).toISOString();
  const timeMax = new Date(y, m + 1, 1).toISOString();
  const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?` +
    `timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
  try {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${gcalToken}` } });
    const data = await res.json();
    if (res.status === 401 && !retried) {
      // 액세스 토큰이 서버 쪽에서 먼저 죽은 경우 — 새로 받아서 딱 한 번 더
      gcalLog("캘린더 API 401 → 토큰 재발급");
      gcalToken = null;
      localStorage.removeItem(GCAL_ACCESS_EXP_KEY);
      gcalLoadedMonths.delete(key);
      if (await gcalRefreshAccessToken()) return ensureGCalMonth(y, m, true);
      return;
    }
    if (!res.ok) { gcalLoadedMonths.delete(key); gcalLog(`캘린더 불러오기 실패 ${res.status}`); toast("구글 캘린더 불러오기 실패: " + (data.error?.message || res.status)); return; }
    const parsed = (data.items || []).map(ev => {
      const startStr = ev.start?.dateTime || ev.start?.date;
      if (!startStr) return null;
      const isAllDay = !ev.start.dateTime;
      const date = startStr.slice(0, 10);
      const time = isAllDay ? null : startStr.slice(11, 16);
      // 여행처럼 여러 날 걸치는 일정의 마지막 날(포함) 계산.
      // 종일 일정의 end.date는 '끝난 다음 날'(배타적)이라 하루를 빼야 실제 마지막 날이 된다.
      const endStr = ev.end?.dateTime || ev.end?.date;
      let endDate = date;
      if (endStr) {
        if (isAllDay) {
          const d = new Date(endStr + "T00:00:00");
          d.setDate(d.getDate() - 1);
          endDate = dateStr(d);
        } else if (endStr.slice(11, 16) === "00:00") {
          // 밤 23:00~자정처럼 정각 0시에 끝나는 일정은 실제로는 전날 안에서 끝난 것이다.
          // 그대로 두면 다음 날까지 걸친 이틀짜리 막대로 그려진다.
          const d = new Date(endStr.slice(0, 10) + "T00:00:00");
          d.setDate(d.getDate() - 1);
          endDate = dateStr(d);
        } else {
          endDate = endStr.slice(0, 10);
        }
        if (endDate < date) endDate = date;
      }
      return { id: ev.id, date, endDate, allDay: isAllDay, time, title: ev.summary || "(제목 없음)", htmlLink: ev.htmlLink };
    }).filter(Boolean);
    const seen = new Set(gcalEvents.map(e => e.id));
    gcalEvents.push(...parsed.filter(e => !seen.has(e.id)));
    if (view === "calendar") renderCalendarView(); else render();
  } catch (e) {
    gcalLoadedMonths.delete(key);
    toast("구글 캘린더 불러오기 실패: " + e.message);
  }
}

/* 앱 시작 시 호출: 리디렉션으로 돌아온 code를 교환하거나, 저장된 리프레시 토큰으로 조용히 재연결 */
async function gcalInitOnLoad() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    history.replaceState({}, "", window.location.pathname);
    await gcalExchangeCode(code);
  } else {
    await gcalSyncTokenWithDb();
    if (!localStorage.getItem(GCAL_REFRESH_KEY)) { render(); return; }
  }
  render(); // DB에서 토큰을 복구했으면 배너를 바로 '연동됨'으로
  const week = weekDates();
  await ensureGCalMonth(Number(week[0].slice(0, 4)), Number(week[0].slice(5, 7)) - 1);
  await ensureGCalMonth(Number(week[6].slice(0, 4)), Number(week[6].slice(5, 7)) - 1);
  render();
}

/* ---------- 실행취소 / 다시실행 ---------- */
let undoStack = [];
let redoStack = [];
function pushHistory(undoFn, redoFn) {
  undoStack.push({ undo: undoFn, redo: redoFn });
  redoStack = [];
}
async function undoLast() {
  const action = undoStack.pop();
  if (!action) { toast("되돌릴 게 없어요"); return; }
  await action.undo();
  redoStack.push(action);
  toast("실행취소했어요");
}
async function redoLast() {
  const action = redoStack.pop();
  if (!action) { toast("다시 실행할 게 없어요"); return; }
  await action.redo();
  undoStack.push(action);
  toast("다시 실행했어요");
}
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return; // 입력창에서는 브라우저 기본 실행취소 사용
  const key = e.key.toLowerCase();
  if (key === "z") { e.preventDefault(); e.shiftKey ? redoLast() : undoLast(); }
  else if (key === "y") { e.preventDefault(); redoLast(); }
});

/* state === null이면 삭제, 아니면 해당 상태로 upsert. 로컬 반영 후 DB에 동기화한다. */
async function applyTaskState(id, state, { silent } = {}) {
  if (state === null) {
    tasks = tasks.filter(t => t.id !== id);
    if (!silent) render();
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  } else {
    const idx = tasks.findIndex(t => t.id === id);
    if (idx === -1) tasks.push(state); else tasks[idx] = state;
    if (!silent) render();
    const { error } = await sb.from("tasks").upsert(state);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  }
}
async function applyRepeatLogState(taskId, exists, { on = todayStr(), silent } = {}) {
  if (exists) {
    if (!repeatLog.find(r => r.task_id === taskId && r.done_on === on)) repeatLog.push({ task_id: taskId, done_on: on });
    if (!silent) render();
    const { error } = await sb.from("repeat_log").insert({ task_id: taskId, done_on: on });
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  } else {
    repeatLog = repeatLog.filter(r => !(r.task_id === taskId && r.done_on === on));
    if (!silent) render();
    const { error } = await sb.from("repeat_log").delete().eq("task_id", taskId).eq("done_on", on);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  }
}

async function addTask(title) {
  const row = { title };
  if (taskTab === "today") row.due = todayStr();
  const tempId = "temp-" + Date.now();
  tasks.push({ ...row, id: tempId, created_at: new Date().toISOString() });
  render();
  const { data, error } = await sb.from("tasks").insert(row).select().single();
  if (error) {
    tasks = tasks.filter(t => t.id !== tempId);
    toast("추가 실패: " + error.message); render(); return;
  }
  const idx = tasks.findIndex(t => t.id === tempId);
  if (idx !== -1) tasks[idx] = data;
  render();
  pushHistory(
    () => applyTaskState(data.id, null),
    () => applyTaskState(data.id, data)
  );
}

    if (removeIds.includes(t.id)) return;
    if (!(t.repeat_days && t.repeat_days.length)) return;
    const key = `${t.title}|${t.project || ""}|${t.repeat_days.slice().sort().join(",")}`;
    (byKey[key] = byKey[key] || []).push(t);
  });
  Object.values(byKey).forEach(list => {
    if (list.length > 1) {
      list.sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));
      removeIds.push(...list.slice(1).map(t => t.id));
    }
  });

  if (removeIds.length) {
    tasks = tasks.filter(t => !removeIds.includes(t.id));
    repeatLog = repeatLog.filter(r => !removeIds.includes(r.task_id));
    await sb.from("repeat_log").delete().in("task_id", removeIds);
    await sb.from("tasks").delete().in("id", removeIds);
  }

  // [1회성 마이그레이션 · 2026-08-30] 화잠 배치일 화→월 통합. 기존 화요일 행을 새 제목/요일로
  // 그 자리에서 바꾸고(삭제 아님 — 체크 기록 유지), 지난주 체크 기록(화 8/25)도 월 8/24로 옮겨
  // 보드의 지난주 칸에서 계속 보이게 한다. 반드시 missing 삽입보다 먼저 실행되어야
  // 새 제목이 "없는 항목"으로 중복 생성되지 않는다.
  {
    const t = tasks.find(x => x.title === "화잠 화요일 배치 제작 (릴스 7편, 예약 발행)");
    if (t) {
      const upd = { title: "화잠 월요일 배치 제작 (릴스 7편, 예약 발행)", repeat_days: [1], sub_start: 25, sub_anchor: "2026-08-31" };
      Object.assign(t, upd);
      await sb.from("tasks").update(upd).eq("id", t.id);
      await sb.from("repeat_log").update({ done_on: "2026-08-24" }).eq("task_id", t.id).eq("done_on", "2026-08-25");
      repeatLog.forEach(r => { if (r.task_id === t.id && r.done_on === "2026-08-25") r.done_on = "2026-08-24"; });
    }
  }

  // [1회성 · 2026-10-06] 매일 반복 "영어 15분" 넣기 (찬진 요청, '궁금한 점들 묻기' 세션 경유).
  // 일정에 시간·메모 칸이 없어 제목에 담는다. 시간은 편집 시트에서 제목만 고치면 된다.
  // "영어 15분"으로 시작하는 일정이 이미 있거나, 이 기기에서 한 번 넣었으면 다시 안 넣는다(지워도 안 살아남).
  // [1회성 · 2026-10-07] 제목이 길어 보드가 지저분해서 "영어 15분"으로 줄인다(찬진). 순서 메모는 영어 세션이 관리.
  for (const t of tasks) {
    if ((t.title || "").startsWith("영어 15분 · ")) {
      t.title = "영어 15분";
      await sb.from("tasks").update({ title: "영어 15분" }).eq("id", t.id);
    }
  }
  let seededEnglish = false;
  try {
    const SEED_KEY = "seed_english15_20261006";
    if (!localStorage.getItem(SEED_KEY) && !tasks.some(t => (t.title || "").startsWith("영어 15분"))) {
      const { data } = await sb.from("tasks").insert({
        title: "영어 15분 · 13:30 (GPT 라이브 10분 → 정리표 Claude에 → 링고 카드)",
        repeat_days: [0, 1, 2, 3, 4, 5, 6],
      }).select();
      if (data) { tasks.push(...data); seededEnglish = true; }
    }
    localStorage.setItem(SEED_KEY, "1");
  } catch {}

  // 이미 "4트랙 사업 일정"을 불러온 적 있는 사용자에 한해서만 새로 추가된 항목(건강친구 산이 배치일 등)을 채워준다
  const missing = scheduleSeeded() ? SCHEDULE_TASKS.filter(s => !tasks.some(t => t.title === s.title)) : [];
  if (missing.length) {
    const { data } = await sb.from("tasks").insert(missing).select();
    if (data) tasks.push(...data);
  }

  // 편수(sub_total)/시작 호수(sub_start)는 값이 아예 없을 때(=아직 한 번도 안 정해졌을 때)만 최초 한 번 채워준다.
  // 이후 SCHEDULE_TASKS 템플릿 값이 바뀌어도(다음 배치부터 반영할 새 편수 등) 진행 중인 실제 값을
  // 조용히 덮어쓰지 않는다 — 배치 전환은 사용자가 편집 시트에서 직접 한다.
  let subSynced = false;
  for (const s of SCHEDULE_TASKS) {
    const t = tasks.find(x => x.title === s.title);
    if (t && s.sub_total && t.sub_total == null) {
      t.sub_total = s.sub_total;
      await sb.from("tasks").update({ sub_total: s.sub_total }).eq("id", t.id);
      subSynced = true;
    }
    if (t && s.sub_start && t.sub_start == null) {
      t.sub_start = s.sub_start;
      await sb.from("tasks").update({ sub_start: s.sub_start }).eq("id", t.id);
      subSynced = true;
    }
    if (t && s.sub_anchor && t.sub_anchor == null) {
      t.sub_anchor = s.sub_anchor;
      await sb.from("tasks").update({ sub_anchor: s.sub_anchor }).eq("id", t.id);
      subSynced = true;
    }
  }

  // [1회성 마이그레이션 · 2026-08-29] 우주사전2 배치 전환: 20~31호(12편, 구방식) → 32~45호(14편, 신방식).
  // 32~38호 제작이 끝나 다음 업로드가 32호부터 시작되므로, 옛 배치 값(sub_start=20)으로 남아있는
  // 실제 일정 행을 로그인된 본인 권한으로 딱 한 번 갱신한다. 이미 전환됐으면(=20이 아니면) 아무것도 안 함.
  {
    const t = tasks.find(x => x.title === "우주사전 월요일 배치 제작 (쇼츠+롱폼, 예약 발행)");
    if (t && t.sub_start === 20) {
      t.sub_start = 32; t.sub_total = 14;
      await sb.from("tasks").update({ sub_start: 32, sub_total: 14 }).eq("id", t.id);
      subSynced = true;
    }
  }

  // 특별편성 업로드 기록 삽입 (1회성, 제목 중복 체크 — 이미 있으면 다시 안 넣음)
  let specialLogged = false;
  {
    const existingTitles = new Set(tasks.map(t => t.title));
    const newLogs = SPECIAL_UPLOAD_LOG
      .filter(s => !existingTitles.has(s.title))
      .map(s => ({ ...s, due: todayStr(), done_at: new Date().toISOString() }));
    if (newLogs.length) {
      const { data } = await sb.from("tasks").insert(newLogs).select();
      if (data) { tasks.push(...data); specialLogged = true; }
    }
  }

  if (removeIds.length || missing.length || subSynced || specialLogged || seededEnglish) render();
}
function scheduleSeeded() {
  return tasks.some(t => ["우주사전2","화잠","건강친구 산이"].includes(t.project));
}
async function seedSchedule() {
  const existingTitles = new Set(tasks.map(t => t.title));
  const rows = SCHEDULE_TASKS.filter(s => !existingTitles.has(s.title));
  if (!rows.length) { toast("이미 다 불러왔어요"); return; }
  const { data, error } = await sb.from("tasks").insert(rows).select();
  if (error) { toast("불러오기 실패: " + error.message); return; }
  const inserted = data || rows;
  tasks.push(...inserted);
  render();
  toast(`사업 일정 ${rows.length}개를 불러왔어요`);
  pushHistory(
    async () => { for (const r of inserted) await applyTaskState(r.id, null, { silent: true }); render(); },
    async () => { for (const r of inserted) await applyTaskState(r.id, r, { silent: true }); render(); }
  );
}

async function toggleTask(task, rowEl, chkEl, onDate = todayStr()) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  const wasDone = isRepeat ? !!repeatLog.find(r => r.task_id === task.id && r.done_on === onDate) : !!task.done_at;
  const turningOn = !wasDone;

  // 낙관적 UI: 서버 응답 기다리지 않고 바로 애니메이션 재생
  if (rowEl && chkEl) {
    rowEl.classList.add(turningOn ? "checking" : "done");
    if (!turningOn) rowEl.classList.remove("done", "checking");
    if (turningOn) spawnConfetti(chkEl);
  }
  await sleep(turningOn ? 320 : 0);

  if (isRepeat) {
    await applyRepeatLogState(task.id, turningOn, { on: onDate });
    pushHistory(
      () => applyRepeatLogState(task.id, wasDone, { on: onDate }),
      () => applyRepeatLogState(task.id, turningOn, { on: onDate })
    );
  } else {
    const before = { ...task };
    const after = { ...task, done_at: turningOn ? new Date().toISOString() : null };
    await applyTaskState(task.id, after);
    pushHistory(
      () => applyTaskState(task.id, before),
      () => applyTaskState(task.id, after)
    );
  }
}

/* ---------- 편수 체크리스트 (한 번에 여러 개 올리는 배치 콘텐츠용) ---------- */
/* 이 주(onDate = 그 주의 발생일)의 배치 시작 호수를 계산한다.
   sub_anchor = "sub_start가 그대로 적용되는 기준 발생일". 기준에서 몇 주 지났는지(k)에 따라
   시작 호수가 sub_total씩 자동으로 늘어나서, 매주 수동으로 갱신할 필요가 없다.
   기준보다 과거 주(k<0)는 편수 체계가 달랐을 수 있으므로 계산하지 않고,
   그 주에 실제로 체크된 번호(repeat_log.sub_done)를 그대로 기록으로 보여준다. */
function subRangeFor(task, onDate) {
  const start = task.sub_start || 1;
  if (!task.sub_anchor) return { mode: "formula", start };
  const k = Math.round((new Date(onDate + "T00:00:00") - new Date(task.sub_anchor + "T00:00:00")) / 604800000);
  if (k >= 0) return { mode: "formula", start: start + k * task.sub_total };
  const stored = getSubDone(task, onDate);
  if (stored.length) return { mode: "stored", nums: [...stored].sort((a, b) => a - b) };
  return { mode: "none" };
}

function getSubDone(task, onDate) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  if (isRepeat) {
    const row = repeatLog.find(r => r.task_id === task.id && r.done_on === onDate);
    return (row && row.sub_done) || [];
  }
  return task.sub_done || [];
}

async function toggleSubItem(task, n, onDate) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  const current = getSubDone(task, onDate);
  const has = current.includes(n);
  const next = has ? current.filter(x => x !== n) : [...current, n].sort((a, b) => a - b);
  const turningComplete = next.length >= task.sub_total && current.length < task.sub_total;
  if (turningComplete) toast(`${task.title} 다 올렸어요 🎉`);

  if (isRepeat) {
    repeatLog = repeatLog.filter(r => !(r.task_id === task.id && r.done_on === onDate));
    if (next.length) repeatLog.push({ task_id: task.id, done_on: onDate, sub_done: next });
    render();
    const { error: delErr } = await sb.from("repeat_log").delete().eq("task_id", task.id).eq("done_on", onDate);
    if (!delErr && next.length) {
      const { error } = await sb.from("repeat_log").insert({ task_id: task.id, done_on: onDate, sub_done: next });
      if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
    } else if (delErr) { toast("동기화 실패: " + delErr.message); await loadAll(); render(); }
  } else {
    const idx = tasks.findIndex(t => t.id === task.id);
    if (idx !== -1) tasks[idx] = { ...tasks[idx], sub_done: next };
    render();
    const { error } = await sb.from("tasks").update({ sub_done: next }).eq("id", task.id);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  }
}

function subChecklist(task, onDate) {
  const done = getSubDone(task, onDate);
  const range = subRangeFor(task, onDate);
  const dayPattern = SUB_DAY_PATTERNS[task.title];
  const grid = document.createElement("div");
  grid.className = "sub-grid";

  const makeChip = (n, slot) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "sub-chip" + (done.includes(n) ? " on" : "");
    chip.innerHTML = slot
      ? `<span class="sub-day">${DAY_NAMES[slot.dow]}</span><span class="sub-num">${n}</span>`
      : `<span class="sub-num">${n}</span>`;
    chip.title = slot ? `${n}호 · ${DAY_NAMES[slot.dow]}요일 예약${slot.note ? " (" + slot.note + ")" : ""}` : `${n}호`;
    chip.addEventListener("click", (e) => { e.stopPropagation(); toggleSubItem(task, n, onDate); });
    return chip;
  };

  // 지난 주(기준 이전) — 그때 실제 체크했던 번호들을 읽기 전용 기록으로 표시
  if (range.mode === "stored") {
    range.nums.forEach(n => {
      const chip = document.createElement("span");
      chip.className = "sub-chip on readonly";
      chip.innerHTML = `<span class="sub-num">${n}</span>`;
      chip.title = `${n}호 · 업로드 완료 기록`;
      grid.appendChild(chip);
    });
    return grid;
  }
  if (range.mode === "none") {
    const note = document.createElement("div");
    note.className = "sub-empty-note";
    note.textContent = "이 주엔 기록이 없어요";
    return note;
  }
  const start = range.start;

  // 번호 순서 그대로 가로로 흐르게 배치 — 읽는 순서 = 업로드 순서.
  // (요일별 세로 열 배치는 가로로 읽으면 32 34 36...처럼 번호가 건너뛰어 보여서 폐기)
  for (let i = 0; i < task.sub_total; i++) {
    grid.appendChild(makeChip(start + i, dayPattern ? dayPattern[i] : undefined));
  }
  return grid;
}

/* ---------- 렌더 ---------- */
function taskRow(task, doneOverride, onDate = todayStr()) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  const hasSub = task.sub_total > 0;
  const subDone = hasSub ? getSubDone(task, onDate) : [];
  const subRange = hasSub ? subRangeFor(task, onDate) : null;
  const done = hasSub
    ? (subRange.mode === "stored" ? true : subDone.length >= task.sub_total)
    : (doneOverride !== undefined ? doneOverride : !!task.done_at);
  const div = document.createElement("div");
  div.className = "task" + (done ? " done" : "");
  // 배치 카드는 짧은 이름 하나만 표시하고 배지(프로젝트/요일/편수)는 전부 생략 — 공간 절약.
  // 편수·번호는 어차피 칩에 다 보인다.
  const displayName = BATCH_DISPLAY_NAMES[task.title];
  const badges = [];
  if (!displayName) {
    if (task.project) badges.push(`<span class="badge">${task.project}</span>`);
    if (isRepeat) badges.push(`<span class="badge repeat">${task.repeat_days.length === 7 ? "매일" : `매주 ${task.repeat_days.map(d=>DAY_NAMES[d]).join("·")}`}</span>`);
  }
  if (task.due && !isRepeat) {
    const overdue = task.due < todayStr() && !done;
    badges.push(`<span class="badge ${overdue ? "overdue" : "plain"}">${overdue ? "지남 " : ""}${task.due.slice(5).replace("-","/")}</span>`);
  }
  if (hasSub) {
    if (subRange.mode === "stored") {
      const nums = subRange.nums;
      badges.push(`<span class="badge plain">${nums.length}편 완료 · ${nums[0]}~${nums[nums.length - 1]}호</span>`);
    } else if (subRange.mode === "none") {
      badges.push(`<span class="badge plain">기록 없음</span>`);
    } else if (!displayName) {
      const s = subRange.start;
      badges.push(`<span class="badge plain">${subDone.length}/${task.sub_total}편 · ${s}~${s + task.sub_total - 1}호</span>`);
    }
  }
  div.innerHTML = `
    <div class="chk">
      <svg viewBox="0 0 27 27">
        <circle class="fill" cx="13.5" cy="13.5" r="12" />
        <circle class="ring" cx="13.5" cy="13.7" r="11.4" />
        <path class="tick" d="M7.5 13.5l4 4 8-8.5" />
      </svg>
    </div>
    <div class="body">
      <div class="title"></div>
      ${badges.length ? `<div class="meta">${badges.join("")}</div>` : ""}
    </div>`;
  div.querySelector(".title").textContent = displayName || task.title;
  if (hasSub) {
    div.querySelector(".body").appendChild(subChecklist(task, onDate));
    div.querySelector(".chk").style.visibility = "hidden"; // 완료 여부는 편수 체크로만 결정
  } else {
    const chkEl = div.querySelector(".chk");
    chkEl.addEventListener("click", (e) => { e.stopPropagation(); toggleTask(task, div, chkEl, onDate); });
  }
  div.addEventListener("click", () => openSheet(task));
  div.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    openTaskCtxMenu(e.clientX, e.clientY, task);
  });
  return div;
}

function section(title) {
  const el = document.createElement("div");
  el.className = "section-title";
  el.textContent = title;
  return el;
}

async function deleteProject(name) {
  if (!confirm(`"${name}" 프로젝트를 삭제할까요? 안에 있는 일들은 미분류로 이동해요.`)) return;
  tasks.forEach(t => { if (t.project === name) t.project = null; });
  render();
  const { error } = await sb.from("tasks").update({ project: null }).eq("project", name);
  if (error) { toast("삭제 실패: " + error.message); await loadAll(); render(); }
  else toast(`"${name}" 프로젝트를 지웠어요`);
}

function render() {
  const list = $("list");
  list.innerHTML = "";
  const today = todayStr();

  if (view === "diary") {
    $("viewTitle").textContent = "일기";
    document.querySelector(".quick").style.display = "none";
    $("quickHint").style.display = "none";
    loadDiary().then(renderDiary);
    return;
  }
  if (view === "calendar") {
    $("viewTitle").textContent = "달력";
    document.querySelector(".quick").style.display = "none";
    $("quickHint").style.display = "none";
    loadCalendarData().then(renderCalendarView);
    return;
  }
  if (view === "publish") {
    $("viewTitle").textContent = "발행";
    document.querySelector(".quick").style.display = "none";
    $("quickHint").style.display = "none";
    loadPublish().then(renderPublish);
    return;
  }

  /* view === "today" — 할 일 탭 (서브탭: 오늘/메모함) */
  const taskTitles = { today: "오늘", inbox: "메모함" };
  $("viewTitle").textContent = taskTitles[taskTab];
  $("quickInput").placeholder = taskTab === "today" ? "오늘 할 일 추가" : "생각나는 건 뭐든 적어두기";
  $("quickHint").textContent = taskTab === "inbox" ? "여기 쌓아두고, 나중에 눌러서 프로젝트·마감일을 정하면 돼요" : "";
  document.querySelector(".quick").style.display = "flex";
  $("quickHint").style.display = taskTab === "inbox" ? "block" : "none";

  const subNav = document.createElement("div");
  subNav.className = "task-subnav";
  subNav.innerHTML = `
    <button type="button" data-t="today" class="${taskTab === "today" ? "on" : ""}">오늘</button>
    <button type="button" data-t="inbox" class="${taskTab === "inbox" ? "on" : ""}">메모함</button>`;
  subNav.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { taskTab = b.dataset.t; render(); });
  });
  list.appendChild(subNav);

  if (taskTab === "today") {
    const connected = gcalIsConnected();
    const gcalBar = document.createElement("div");
    gcalBar.className = "gcal-bar" + (connected ? " gcal-bar-mini" : "");
    const last = gcalLastStatus();
    const statusHtml = last ? ` <span class="gcal-status" id="gcalStatus" title="클릭하면 연동 기록 전체를 보여줘요">· ${escapeHtml(last)}</span>` : "";
    gcalBar.innerHTML = connected
      ? `<span>📅 구글 캘린더 연동됨${statusHtml}</span><button type="button" id="gcalToggle">해제</button>`
      : `<span>구글 캘린더에 있는 일정도 같이 볼까요?${statusHtml}</span><button type="button" id="gcalToggle">연동하기</button>`;
    gcalBar.querySelector("#gcalToggle").addEventListener("click", () => {
      connected ? disconnectGoogleCalendar() : connectGoogleCalendar();
    });
    const statusEl = gcalBar.querySelector("#gcalStatus");
    if (statusEl) statusEl.addEventListener("click", () => alert("구글 캘린더 연동 기록 (최신순)\n\n" + gcalLogEntries().slice().reverse().join("\n")));
    const statsRow = document.createElement("div");
    statsRow.className = "cal-stats-row";
    statsRow.appendChild(exerciseStatsEl());
    statsRow.appendChild(lottoStatsEl());
    list.appendChild(statsRow);
    try { list.appendChild(foodTipEl()); } catch (e) {}
    list.appendChild(gcalBar);
  }

  const taskList = document.createElement("div");
  list.appendChild(taskList);

  if (taskTab === "today") {
    if (!scheduleSeeded() && SCHEDULE_TASKS.length) {
      const banner = document.createElement("div");
      banner.className = "task";
      banner.style.borderStyle = "dashed";
      banner.innerHTML = `
        <div class="body">
          <div class="title" style="color:var(--coral)">＋ 4트랙 사업 일정 불러오기</div>
          <div class="meta"><span class="badge plain">탭해서 반복 일정 한번에 추가</span></div>
        </div>`;
      banner.addEventListener("click", async () => {
        banner.querySelector(".title").textContent = "불러오는 중...";
        await seedSchedule();
      });
      taskList.appendChild(banner);
    }

    const week2 = twoWeekDates(); // 이번 주 월~일(0~6) 다음 다음 주 월~일(7~13), 순서 그대로 날짜순
    const wrap = document.createElement("div");
    wrap.className = "week-board-wrap";
    const rows = [document.createElement("div"), document.createElement("div")];
    rows.forEach(r => { r.className = "week-board"; wrap.appendChild(r); });
    let any = false;
    week2.forEach((d, idx) => {
      const board = rows[idx < 7 ? 0 : 1];
      const dow = new Date(d + "T00:00:00").getDay(); // 요일(0=일...6=토) — repeat_days 매칭용
      const i = dow;
      const dTasks = tasks.filter(t => {
        const isRepeat = t.repeat_days && t.repeat_days.length;
        if (isRepeat) return t.repeat_days.includes(i);
        if (!t.due) return false;
        // 마감 지난(오늘 포함) 미완료 할 일은 원래 요일이 아니라 '오늘' 칸에 모아 보여준다
        if (!t.done_at && t.due <= today) return d === today;
        return t.due === d;
      });
      const isToday = d === today;
      const col = document.createElement("div");
      col.className = "week-col" + (isToday ? " is-today" : "");
      if (isToday) col.id = "weekColToday";
      const head = document.createElement("div");
      head.className = "week-col-head";
      head.innerHTML = `<span>${DAY_NAMES[i]}요일</span><span class="week-col-date">${Number(d.slice(5,7))}/${Number(d.slice(8,10))}</span>`;
      col.appendChild(head);
      const dEvents = gcalEventsOn(d);
      if (dEvents.length) {
        any = true;
        const evWrap = document.createElement("div");
        evWrap.className = "gcal-events";
        dEvents.forEach(e => {
          const item = document.createElement("a");
          item.className = "gcal-event";
          item.href = e.htmlLink || "#";
          item.target = "_blank";
          item.rel = "noopener noreferrer";
          const titleEl = document.createElement("span");
          titleEl.className = "gcal-title";
          titleEl.textContent = e.title;
          item.appendChild(titleEl);
          evWrap.appendChild(item);
        });
        col.appendChild(evWrap);
      }
      if (dTasks.length) {
        any = true;
        dTasks.forEach(t => {
          const isRepeat = t.repeat_days && t.repeat_days.length;
          col.appendChild(taskRow(t, isRepeat ? !!repeatLog.find(r => r.task_id === t.id && r.done_on === d) : undefined, d));
        });
      } else if (!dEvents.length) {
        col.insertAdjacentHTML("beforeend", `<div class="week-col-empty">${isToday ? "오늘은 여유롭네요" : "-"}</div>`);
      }
      board.appendChild(col);
    });
    taskList.appendChild(wrap);
    if (!any)
      taskList.insertAdjacentHTML("beforeend", emptyDoodle("2주간 예정된 일이 없어요", "위에서 바로 추가하거나, 메모함을 정리해보세요"));
    setTimeout(() => {
      const col = $("weekColToday");
      if (col) col.scrollIntoView({ inline: "center", block: "nearest" });
    }, 0);

    const done = tasks.filter(t => t.done_at).sort((a,b) => b.done_at.localeCompare(a.done_at)).slice(0, 50);
    if (done.length) {
      const details = document.createElement("details");
      details.className = "month-group";
      details.style.marginTop = "18px";
      const summary = document.createElement("summary");
      summary.className = "month-head";
      summary.textContent = `완료 (${done.length})`;
      details.appendChild(summary);
      let lastDate = "";
      done.forEach(t => {
        const d = t.done_at.slice(0,10);
        if (d !== lastDate) { details.appendChild(section(d.slice(5).replace("-","/"))); lastDate = d; }
        details.appendChild(taskRow(t));
      });
      taskList.appendChild(details);
    }
  }

  if (taskTab === "inbox") {
    const inbox = tasks.filter(t => !t.done_at && !t.due && !(t.repeat_days && t.repeat_days.length));
    if (!inbox.length) taskList.innerHTML = emptyDoodle("메모함이 비어있어요", "머릿속에 떠도는 건 뭐든 던져놓으세요");
    inbox.forEach(t => taskList.appendChild(taskRow(t)));
  }
}

/* ---------- 발행 탭 ----------
   publish.json 은 찬작 세션(Claude)이 발행_일정.json 에서 만들어 이 저장소에 push 한다.
   찬진이 직접 예약하는 채널(인스타·쓰레드·블로그·클립·카카오)은 칩을 눌러 대기→예약됨→발행됨 으로 바꾸고,
   그 상태는 Supabase publish_status 에 저장된다(세션이 anon 키로 읽어 발행_일정.md 에 반영).
   자동 발행 채널(유튜브·인스타·쓰레드)은 점선 칩 — publish.json 값만 보여준다. 영상·캡션이 다 있으면 준비됨. */
const PUBLISH_URL = "./publish.json";
const PUB_CH = { youtube: "유튜브", shorts: "쇼츠", instagram: "인스타", threads: "쓰레드", blog: "블로그", clip: "클립", kakao: "카카오" };
const PUB_ST = { todo: "대기", scheduled: "예약됨", published: "발행됨", skip: "안 올림" };
const PUB_CYCLE = ["todo", "scheduled", "published"];
let publishData = null, publishStatus = {}, publishShowPast = false;

async function loadPublish() {
  try {
    const r = await fetch(PUBLISH_URL + "?t=" + Date.now(), { cache: "no-store" });
    publishData = r.ok ? await r.json() : null;
  } catch { publishData = null; }
  publishStatus = {};
  try {
    const { data, error } = await sb.from("publish_status").select("slot_id,channel,status,at,note");
    if (!error && data) data.forEach(x => { publishStatus[x.slot_id + "|" + x.channel] = x; });
  } catch {}
}

function pubFmtAt(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return iso;
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function pubChipState(slot, ch, conf) {
  // 세션 채널은 JSON 값, 찬진 채널은 Supabase 값이 우선
  const own = publishStatus[slot.id + "|" + ch];
  if (conf.who === "chanjin" && own) return { status: own.status, at: own.at, url: null };
  return { status: conf.status || "todo", at: conf.publishAt || conf.at || null, url: conf.url || null };
}

async function pubCycle(slot, ch, conf, btn) {
  const cur = pubChipState(slot, ch, conf).status;
  const next = PUB_CYCLE[(PUB_CYCLE.indexOf(cur) + 1) % PUB_CYCLE.length];
  let at = null;
  if (next === "scheduled") at = conf.due || `${slot.date}T${slot.time || "19:00"}:00+09:00`;   // 예약 시각 = 채널별 업로드 시각(due)
  if (next === "published") at = new Date().toISOString();
  const row = { slot_id: slot.id, channel: ch, status: next, at, updated_at: new Date().toISOString() };
  const { error } = await sb.from("publish_status").upsert(row, { onConflict: "user_id,slot_id,channel" });
  if (error) { toast("저장 실패: " + error.message + " (SETUP.md 1-5 표를 만들었는지 확인)"); return; }
  publishStatus[slot.id + "|" + ch] = row;
  if (next === "published") spawnConfetti(btn);
  renderPublish();
}

function pubShort(slot) {
  return slot.short || slot.title || "";
}
function pubHM(iso, slot, ch) {
  const src = iso || (slot.date + "T" + (slot.time || "19:00") + ":00+09:00");
  const d = new Date(src);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* 발행 탭 — 2026-09-24 2차. 날짜 하나 아래 그날 것을 전부 모은다.
   카드: 짧은 제목 + '내가' 칩(누르면 대기→예약함→발행함) + '자동' 칩(시각만, 링크는 ↗).
   ⛔ prep 안내 문구는 띄우지 않는다 — 찬진이 이미 아는 절차라 화면만 어지럽다. */
function renderPublish() {
  const list = $("list"); list.innerHTML = "";
  if (!publishData) { list.innerHTML = '<div class="empty">publish.json 을 못 읽었어요. 세션이 아직 push 하지 않았거나 오프라인이에요.</div>'; return; }
  const today = todayStr();
  const slots = (publishData.slots || []).slice().sort(function (x, y) { return (x.date + x.time).localeCompare(y.date + y.time); });

  const dls = (publishData.deadlines || []).filter(function (x) { return x.status !== "done"; }).sort(function (x, y) { return x.due.localeCompare(y.due); });
  dls.forEach(function (x) {
    const dd = Math.round((new Date(x.due + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
    const d = new Date(x.due + "T00:00:00");
    const card = document.createElement("div"); card.className = "pub-deadline" + (dd <= 2 ? " urgent" : "");
    card.innerHTML = '<div class="dday">' + (dd < 0 ? "D+" + (-dd) : dd === 0 ? "D-DAY" : "D-" + dd) + '</div>'
      + '<div class="body"><div class="k">' + (x.kind || "납기") + ' · ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAY_NAMES[d.getDay()] + '</div>'
      + '<div class="t">' + x.title + '</div>' + (x.memo ? '<div class="m">' + x.memo + '</div>' : "") + '</div>';
    list.appendChild(card);
  });

  const lg = document.createElement("div"); lg.className = "pub-legend";
  lg.innerHTML = '<span class="bar"></span> 왼쪽 빨간 선 = <b>내가 아직 안 올린 것</b>'
    + ' &nbsp;·&nbsp; <span class="lg s-todo">대기</span> <span class="lg s-ready">준비됨</span>'
    + ' <span class="lg s-scheduled">예약됨</span> <span class="lg s-published">발행됨</span>'
    + ' &nbsp;·&nbsp; 점선 = <b>자동 발행</b>';
  list.appendChild(lg);

  const drawDays = function (arr, isPast) {
    let lastDate = null;
    arr.forEach(function (slot) {
      if (slot.date !== lastDate) {
        lastDate = slot.date;
        const d = new Date(slot.date + "T00:00:00");
        const dd = Math.round((d - new Date(today + "T00:00:00")) / 86400000);
        const h = document.createElement("div");
        h.className = "pub-day" + (dd === 0 ? " today" : "");
        h.innerHTML = '<span class="d">' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAY_NAMES[d.getDay()] + '</span>'
          + '<span class="w">' + (dd === 0 ? "오늘" : dd === 1 ? "내일" : "") + '</span>';
        list.appendChild(h);
      }
      const all = Object.entries(slot.channels || {});
      const mine = all.filter(function (e) { return e[1].who === "chanjin"; });
      const auto = all.filter(function (e) { return e[1].who !== "chanjin"; });
      const needMe = mine.some(function (e) { return ["published", "skip"].indexOf(pubChipState(slot, e[0], e[1]).status) < 0; });
      const card = document.createElement("div");
      card.className = "pub-slot" + (isPast ? " done" : needMe ? " mine" : "");
      card.innerHTML = '<div class="t2"><span class="kind">' + (slot.kind || "") + '</span>' + pubShort(slot) + '</div>';

      if (mine.length) {
        const r1 = document.createElement("div"); r1.className = "pub-ch";
        const lb = document.createElement("span"); lb.className = "rowlab"; lb.textContent = "내가"; r1.appendChild(lb);
        mine.forEach(function (e) {
          const ch = e[0], conf = e[1], st = pubChipState(slot, ch, conf);
          const btn = document.createElement("button"); btn.className = "s-" + st.status;
          btn.innerHTML = (PUB_CH[ch] || ch) + ' <b>' + pubHM(conf.due, slot, ch) + '</b>'
            + ' · ' + (PUB_ST[st.status] || st.status);
          btn.addEventListener("click", function () { pubCycle(slot, ch, conf, btn); });
          r1.appendChild(btn);
        });
        card.appendChild(r1);
      }
      if (auto.length) {
        const r2 = document.createElement("div"); r2.className = "pub-ch auto";
        const lb = document.createElement("span"); lb.className = "rowlab"; lb.textContent = "자동"; r2.appendChild(lb);
        auto.forEach(function (e) {
          const ch = e[0], conf = e[1], st = pubChipState(slot, ch, conf);
          // 아직 안 나갔지만 영상·캡션이 다 있으면 '대기' 가 아니라 '준비됨' 이다 (2026-09-24 찬진)
          const label = st.status === "todo" && conf.ready ? "준비됨" : (PUB_ST[st.status] || st.status);
          const txt = (PUB_CH[ch] || ch) + " " + pubHM(conf.due, slot, ch) + " · " + label;
          const cls = "s-" + st.status + " s-session" + (st.status === "todo" && conf.ready ? " s-ready" : "");
          if (st.url) {
            const a2 = document.createElement("a"); a2.href = st.url; a2.target = "_blank";
            a2.className = cls; a2.innerHTML = txt + " ↗"; r2.appendChild(a2);
          } else {
            const sp = document.createElement("span"); sp.className = cls;
            sp.textContent = txt; r2.appendChild(sp);
          }
        });
        card.appendChild(r2);
      }
      list.appendChild(card);
    });
  };

  const upcoming = slots.filter(function (x) { return x.date >= today; });
  if (!upcoming.length) { const e0 = document.createElement("div"); e0.className = "empty"; e0.textContent = "예정된 발행이 없어요."; list.appendChild(e0); }
  drawDays(upcoming, false);

  const past = slots.filter(function (x) { return x.date < today; }).reverse();
  if (past.length) {
    const more = document.createElement("button"); more.className = "pub-more";
    more.textContent = publishShowPast ? "지난 발행 접기" : "지난 발행 " + past.length + "편 보기";
    more.addEventListener("click", function () { publishShowPast = !publishShowPast; renderPublish(); });
    list.appendChild(more);
    if (publishShowPast) drawDays(past, true);
  }

  const u = document.createElement("div"); u.className = "pub-updated";
  u.textContent = "세션 갱신 " + (publishData.updated || "");
  list.appendChild(u);
}

$("btnSave").addEventListener("click", async () => {
  if (!editing) return;
  const id = editing.id;
  const before = tasks.find(t => t.id === id);
  if (!before) return;
  const beforeSnap = { ...before };
  const subTotalVal = $("editSubTotal").value.trim();
  const subStartVal = $("editSubStart").value.trim();
  const upd = {
    title: $("editTitle").value.trim() || editing.title,
    project: $("editProject").value.trim() || null,
    due: $("editDue").value || null,
    repeat_days: editDays.length ? editDays : null,
    sub_total: subTotalVal ? Math.max(1, parseInt(subTotalVal, 10)) : null,
    sub_start: subStartVal ? Math.max(1, parseInt(subStartVal, 10)) : null,
  };
  // 시작 호수를 직접 바꾸면 "이번 주 배치가 이 번호부터"라는 뜻이므로,
  // 기준일(sub_anchor)을 이번 주의 해당 반복 요일로 다시 잡는다 (이후 주는 자동 증가)
  if (upd.sub_start && upd.sub_start !== beforeSnap.sub_start && upd.repeat_days) {
    const thisWeek = twoWeekDates().slice(0, 7);
    upd.sub_anchor = thisWeek.find(d => upd.repeat_days.includes(new Date(d + "T00:00:00").getDay())) || thisWeek[0];
  }
  const afterSnap = { ...beforeSnap, ...upd };
  closeSheet();
  await applyTaskState(id, afterSnap);

    () => applyTaskState(id, beforeSnap),

async function deleteTask(task) {
  const id = task.id;
  const snapshot = { ...task };
  const hadLogToday = !!repeatLog.find(r => r.task_id === id && r.done_on === todayStr());
  await applyRepeatLogState(id, false, { silent: true });
  await applyTaskState(id, null);
  toast("삭제했어요");
  pushHistory(
    async () => { await applyTaskState(id, snapshot); if (hadLogToday) await applyRepeatLogState(id, true); },
    async () => { await applyRepeatLogState(id, false, { silent: true }); await applyTaskState(id, null); }
  );
}

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("authEmail").value;
  const { error } = await sb.auth.signInWithPassword({ email, password: $("authPw").value });
  $("authErr").textContent = error ? "로그인 실패: " + error.message : "";
  if (!error) {
    if ($("rememberId").checked) localStorage.setItem(REMEMBER_KEY, email);
    else localStorage.removeItem(REMEMBER_KEY);
  }
});
$("btnSignup").addEventListener("click", async () => {
  const { error } = await sb.auth.signUp({ email: $("authEmail").value, password: $("authPw").value });
  $("authErr").textContent = error ? "가입 실패: " + error.message : "가입 완료. 바로 로그인해보세요.";
});

/* ---------- 사진 확대 보기 ---------- */
const photoLightbox = document.createElement("div");
photoLightbox.className = "photo-lightbox";
photoLightbox.innerHTML = `
  <button class="plb-close" title="닫기">×</button>
  <button class="plb-nav plb-prev" title="이전">‹</button>
  <img alt="">
  <button class="plb-nav plb-next" title="다음">›</button>
  <div class="plb-count"></div>`;
document.body.appendChild(photoLightbox);
let plbUrls = [], plbIndex = 0;
function renderPhotoViewer() {
  photoLightbox.querySelector("img").src = plbUrls[plbIndex];
  const count = photoLightbox.querySelector(".plb-count");
  const nav = plbUrls.length > 1;
  photoLightbox.querySelector(".plb-prev").style.display = nav ? "flex" : "none";
  photoLightbox.querySelector(".plb-next").style.display = nav ? "flex" : "none";
  count.style.display = nav ? "block" : "none";
  count.textContent = `${plbIndex + 1} / ${plbUrls.length}`;
}
function openPhotoViewer(urls, index) {
  plbUrls = urls;
  plbIndex = index;
  renderPhotoViewer();
  photoLightbox.classList.add("open");
}
function closePhotoViewer() {
  photoLightbox.classList.remove("open");
  photoLightbox.querySelector("img").src = "";
}
function plbPrev() { if (!plbUrls.length) return; plbIndex = (plbIndex - 1 + plbUrls.length) % plbUrls.length; renderPhotoViewer(); }
function plbNext() { if (!plbUrls.length) return; plbIndex = (plbIndex + 1) % plbUrls.length; renderPhotoViewer(); }
photoLightbox.addEventListener("click", (e) => {
  if (e.target === photoLightbox || e.target.closest(".plb-close")) closePhotoViewer();
  else if (e.target.closest(".plb-prev")) plbPrev();
  else if (e.target.closest(".plb-next")) plbNext();
});
document.addEventListener("keydown", (e) => {
  if (!photoLightbox.classList.contains("open")) return;
  if (e.key === "Escape") closePhotoViewer();
  else if (e.key === "ArrowLeft") plbPrev();
  else if (e.key === "ArrowRight") plbNext();
});
document.addEventListener("click", (e) => {
  const img = e.target.closest(".photo-thumb img, .past-photos img, .cd-photos img");
  if (!img) return;
  const gallery = img.closest(".photo-grid, .past-photos, .cd-photos");
  const urls = [...gallery.querySelectorAll("img")].map(i => i.src);
  openPhotoViewer(urls, urls.indexOf(img.src));
});
let plbTouchStartX = null;
photoLightbox.addEventListener("touchstart", (e) => {
  plbTouchStartX = e.touches[0].clientX;
}, { passive: true });
photoLightbox.addEventListener("touchend", (e) => {
  if (plbTouchStartX === null) return;
  const dx = e.changedTouches[0].clientX - plbTouchStartX;
  if (Math.abs(dx) > 40) { dx > 0 ? plbPrev() : plbNext(); }
  plbTouchStartX = null;
});

init();
</script>
