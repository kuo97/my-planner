<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<link rel="manifest" href="manifest.json">
<title>플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --paper: #FAF6EE;
    --paper-card: #FFFDF8;
    --ink: #2B241E;
    --muted: #A99C88;
    --line: #EAE0CC;
    --coral: #FF6B4A;
    --coral-soft: #FFE4D8;
    --sage: #6FA88A;
    --sage-soft: #E3F0E8;
    --danger: #E15B4F;
    --danger-soft: #FBE4E0;
    --gcal: #4285F4;
    --gcal-soft: #E8F0FE;
    --content-max: 560px;
  }
  @media (min-width: 900px) { :root { --content-max: 920px; } }
  @media (min-width: 1300px) { :root { --content-max: 1180px; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    /* 불릿저널 도트그리드 질감 */
    background-image: radial-gradient(circle, rgba(43,36,30,0.14) 1px, transparent 1.4px);
    background-size: 22px 22px;
  }
  .hand { font-family: 'Gaegu', 'Pretendard', sans-serif; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- 레이아웃 ---------- */
  .app { max-width: var(--content-max); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    padding: 22px 20px 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 {
    margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0;
    font-family: 'Gaegu', sans-serif; color: var(--ink);
  }
  header .date {
    font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 13.5px;
    color: var(--coral); background: var(--coral-soft);
    padding: 5px 12px; border-radius: 999px; transform: rotate(-3deg);
    display: inline-block; animation: popIn 0.4s ease both;
  }
  @keyframes popIn { from { opacity: 0; transform: rotate(-3deg) scale(0.6); } to { opacity: 1; transform: rotate(-3deg) scale(1); } }
  main { flex: 1; padding: 0 16px 100px; }

  /* ---------- 빠른 추가 ---------- */
  .quick {
    display: flex; gap: 8px; margin: 10px 0 16px;
  }
  .quick input {
    flex: 1; padding: 14px 18px;
    border: 1.5px solid var(--line); border-radius: 16px;
    font-size: 15px; font-family: inherit; outline: none; background: var(--paper-card);
    box-shadow: 0 1px 0 rgba(43,36,30,0.03);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .quick input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
  .quick button {
    padding: 0 20px; border: none; border-radius: 16px;
    background: var(--coral); color: white; font-weight: 700; font-size: 15px;
    cursor: pointer; font-family: 'Gaegu', sans-serif;
    transition: transform 0.1s;
  }
  .quick button:active { transform: scale(0.92); }
  .quick-hint { color: var(--muted); font-size: 12px; margin: -10px 4px 14px; }

  /* ---------- 섹션/태스크 ---------- */
  .section-title {
    font-family: 'Gaegu', sans-serif; font-size: 15px; font-weight: 700; color: var(--muted);
    margin: 20px 4px 10px; display: flex; align-items: center; gap: 6px;
  }
  .section-title::before { content: '✦'; color: var(--coral); font-size: 11px; }
  .project-del-link {
    border: none; background: none; color: var(--muted); font-size: 12px; font-weight: 700;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  .project-del-link:hover { color: var(--coral); }

  /* ---------- 오늘 탭: 월~일 주간 보드 ---------- */
  .week-board-wrap { display: flex; flex-direction: column; gap: 10px; }
  .week-board {
    display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .week-col {
    flex: 0 0 208px; scroll-snap-align: start;
    border: 1.5px solid var(--line); border-radius: 16px; padding: 10px;
    background: var(--paper-card);
  }
  .week-col .task { padding: 11px 12px; margin-bottom: 7px; }
  .week-col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 13px; color: var(--muted);
    margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1.5px dashed var(--line);
  }
  .week-col-date { font-size: 11.5px; }
  .week-col-empty { color: var(--muted); font-size: 12.5px; padding: 6px 2px; }
  .draft-hint { font-size: 11.5px; color: var(--coral); margin: 6px 2px 0; }
  .ex-stats {
    display: inline-flex; align-items: center; gap: 7px; margin: 0 0 8px;
    background: var(--sage-soft); border: 1.5px solid var(--sage); border-radius: 999px;
    padding: 5px 13px 5px 10px; font-size: 12.5px; color: var(--ink);
  }
  .ex-stats b { font-family: 'Gaegu', sans-serif; font-size: 16px; color: var(--sage); margin: 0 1px; }
  .ex-stats .ex-sep { color: var(--muted); }
  .ex-stats.cal-ex { margin: -4px 0 10px; }
  /* 날짜 칸 왼쪽 위 배지 — 사진 위에서도 보이도록 흰 원 배경을 깔고 그림자를 준다 */
  .cal-day .day-marks { position: absolute; left: 3px; top: 3px; display: flex; gap: 2px; z-index: 2; }
  .cal-day .day-mark {
    width: 17px; height: 17px; border-radius: 999px; background: rgba(255,255,255,.95);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .cal-day .day-mark.ex { background: var(--sage); }
  .cal-stats-row { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: -4px 0 10px; }
  .cal-stats-row .ex-stats.cal-ex { margin: 0; }
  .ex-stats.hair-stats { background: var(--paper-card); border-color: var(--line); }
  .ex-stats.lotto-pick {
    background: var(--paper-card); border-color: var(--line); color: var(--muted);
    cursor: pointer; font-family: inherit; gap: 4px;
  }
  .ex-stats.lotto-pick b {
    font-family: 'Gaegu', sans-serif; font-size: 14px; color: var(--ink); margin: 0;
    min-width: 21px; text-align: center; background: var(--paper); border-radius: 999px; padding: 1px 4px;
  }
  .ex-stats.lotto-pick .lotto-again { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .ex-stats.lotto-pick:active { transform: scale(0.97); }
  .ex-stats.hair-stats b { color: var(--ink); }
  .hair-toggle {
    display: inline-block; margin-top: 10px; margin-right: 8px; padding: 7px 13px; border-radius: 999px;
    border: 1.5px dashed var(--line); background: none; color: var(--muted); font-size: 12.5px; cursor: pointer;
    font-family: inherit;
  }
  .hair-toggle.on { border-style: solid; border-color: var(--ink); color: var(--ink); background: var(--paper-card); }
  /* 생활 기록: 계절 칩 + 접히는 카드 */
  .season-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .season-chip { padding: 4px 10px; border-radius: 999px; border: 1.5px dashed var(--line); background: none; color: var(--muted); font-size: 12px; cursor: pointer; font-family: inherit; }
  .season-chip.on { border-style: solid; border-color: var(--ink); color: var(--ink); background: var(--paper-card); }
  .life-card { padding: 12px 17px; }
  .life-sum { font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; list-style: none; }
  .life-sum::-webkit-details-marker { display: none; }
  .life-sum::before { content: "▸ "; color: var(--muted); }
  .life-card[open] .life-sum::before { content: "▾ "; }
  .life-sum small { font-family: inherit; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .life-card h4 { font-family: 'Gaegu', sans-serif; font-size: 14px; margin: 12px 0 6px; }
  .life-card h4 small { font-weight: 400; color: var(--muted); }
  .season-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: center; }
  .season-tbl th, .season-tbl td { padding: 4px 2px; border-bottom: 1px dashed var(--line); font-weight: 400; }
  .season-tbl tr:first-child th { color: var(--muted); font-size: 11.5px; }
  .bill-form { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .bill-form input, .bill-form select { border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); padding: 5px 8px; font: inherit; font-size: 13px; min-width: 0; }
  .bill-form input[type=number] { width: 90px; }
  .bill-form button { border: none; border-radius: 10px; background: var(--ink); color: var(--paper); padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .bill-month { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .bill-item { margin-right: 8px; white-space: nowrap; }
  .bill-item button { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .bill-sum { color: var(--muted); white-space: nowrap; }
  .bill-month small { color: var(--muted); }
  .spend-cats { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  /* 지출 그래프: 1자 누적 막대 + 순위 막대 */
  .sp-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .sp-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .sp-row { margin-bottom: 9px; }
  .sp-head { font-size: 13px; margin-bottom: 4px; }
  .sp-head small { color: var(--muted); margin-left: 4px; }
  .sp-head small.up { color: var(--danger); }
  .sp-head small.down { color: var(--sage); }
  .sp-bar { display: flex; gap: 2px; height: 14px; }
  .sp-seg { min-width: 3px; cursor: default; }
  .sp-seg:first-child { border-radius: 4px 0 0 4px; }
  .sp-seg:last-child { border-radius: 0 4px 4px 0; }
  .sp-seg:only-child { border-radius: 4px; }
  .sp-seg:hover { filter: brightness(1.08); outline: 2px solid var(--paper-card); }
  .sp-rank-title { font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  .sp-rank { display: grid; grid-template-columns: 104px 1fr 112px; gap: 8px; align-items: center; font-size: 12.5px; padding: 2px 0; }
  .sp-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-track { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
  .sp-track i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
  .sp-val { text-align: right; white-space: nowrap; }
  .sp-val small { color: var(--muted); }
  .sp-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .sp-chips button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
  .sp-chips button.on { border-color: var(--ink); color: var(--ink); background: var(--paper-card); }
  .sp-cols { display: flex; align-items: flex-end; gap: 10px; height: 108px; padding: 0 2px; border-bottom: 1px solid var(--line); }
  .sp-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-width: 0; }
  .sp-cbar { width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; }
  .sp-cv { font-size: 11.5px; color: var(--ink); white-space: nowrap; }
  .sp-cm { font-size: 11.5px; color: var(--muted); margin-bottom: -18px; }
  #spTrend { padding-bottom: 20px; }
  /* 생활 기록 v2: 섹션 접기 · 월 선택 · 내역 펼치기 · 표 */
  .life-sec { border-top: 1px dashed var(--line); padding: 8px 0 4px; }
  .life-sec:first-of-type { margin-top: 8px; }
  .life-sec > summary { cursor: pointer; list-style: none; font-family: 'Gaegu', sans-serif; font-size: 15px; padding: 2px 0; }
  .life-sec > summary::-webkit-details-marker { display: none; }
  .life-sec > summary::before { content: "▸ "; color: var(--muted); }
  .life-sec[open] > summary::before { content: "▾ "; }
  .life-sec > summary small { font-family: inherit; font-size: 12.5px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .life-sec-body { padding: 6px 0 4px; }
  .sp-row { cursor: pointer; padding: 3px 6px; margin: 0 -6px 4px; border-radius: 10px; border: 1.5px solid transparent; }
  .sp-row:hover { background: var(--paper); }
  .sp-row.on { border-color: var(--ink); background: var(--paper); }
  .sp-row .sp-bar { height: 12px; }
  .sp-sel { font-size: 14px; margin: 12px 0 2px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .sp-sel small { color: var(--muted); }
  .sp-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .sp-rank-title small { font-weight: 400; }
  .sp-rank.has-items { cursor: pointer; border-radius: 6px; }
  .sp-rank.has-items:hover { background: var(--paper); }
  .sp-rank.open { background: var(--paper); }
  .sp-items { margin: 2px 0 6px 12px; padding: 4px 10px; border-left: 2px solid var(--line); font-size: 12.5px; }
  .sp-items div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .sp-items small { color: var(--muted); }
  .sp-items b { font-weight: 600; white-space: nowrap; }
  .sp-col { cursor: pointer; border-radius: 6px; }
  .sp-col.on .sp-cm { color: var(--ink); font-weight: 700; }
  .life-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .life-tbl th { color: var(--muted); font-weight: 400; text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .life-tbl td { padding: 4px; border-bottom: 1px dashed var(--line); }
  .life-tbl .num { text-align: right; white-space: nowrap; }
  .life-tbl tr.tot td { border-bottom: none; font-weight: 600; }
  .life-tbl tr.tot small { color: var(--muted); font-weight: 400; }
  .life-tbl .x { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 13px; }
  .life-tbl.season td, .life-tbl.season th { text-align: center; }
  .life-tbl .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--paper); color: var(--muted); }
  .life-tbl .tag.biz { background: #fbf0d9; color: #8a5a00; }
  .life-tbl .soon { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); }
  .fl-now { border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; background: var(--paper); }
  .fl-now-t { font-size: 14px; margin-bottom: 6px; }
  .fl-now-t small { color: var(--muted); }
  .fl-now-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .fl-now-g small { display: block; font-size: 11.5px; color: var(--muted); }
  .fl-now-g b { font-size: 16px; }
  .fl-now-g b.plus { color: var(--sage); }
  .fl-now-g b.minus { color: var(--danger); }
  .fl-head small, .sp-head b small { color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .fl-goal { font-size: 13px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 10px; }
  .fl-goal small { color: var(--muted); }
  .fl-row { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .fl-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .fl-net.plus { color: var(--sage); font-weight: 600; }
  .fl-net.minus { color: var(--danger); font-weight: 600; }
  .fl-bar { display: flex; align-items: center; gap: 6px; height: 14px; margin: 2px 0; font-size: 11.5px; color: var(--muted); }
  .fl-bar i { display: block; height: 9px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .fl-src { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .fl-src small { color: var(--muted); }
  .fl-row[data-flow] { cursor: pointer; }
  .fl-row.on { background: var(--paper); border-radius: 12px; padding: 8px 10px; margin: 2px -10px; border-bottom-color: transparent; }
  .fd { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); cursor: default; }
  .fd-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
  .fd-sum small { display: block; font-size: 11.5px; color: var(--muted); }
  .fd-sum b { font-size: 15px; }
  .fd-sum b.plus { color: var(--sage); }
  .fd-sum b.minus { color: var(--danger); }
  .fd-note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .fd-h { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
  .fd-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 0; }
  .fd-line small { color: var(--muted); font-weight: 400; }
  .fd-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 0 1px 12px; }
  .fd-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .fd-go, .fl-more { margin-top: 10px; background: none; border: 1.5px dashed var(--line); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; color: var(--muted); cursor: pointer; font-family: inherit; }
  .fl-more { display: block; margin: 12px auto 2px; }
  .life-tbl .sub-name { cursor: pointer; }
  .food-tip { display: flex; flex-direction: column; gap: 1px; margin: 0 0 10px; background: var(--paper-card); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 13px; font-size: 13px; color: var(--ink); line-height: 1.5; }
  .food-tip small { font-size: 11.5px; color: var(--muted); }
  .life-add > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; margin: 8px 0 4px; }
  .life-add > summary::-webkit-details-marker { display: none; }
  .bill-form input:not([type]) { width: 120px; }
  .gcal-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--gcal-soft); border: 1.5px solid var(--gcal); border-radius: 14px;
    padding: 10px 14px; margin: 4px 0 14px; font-size: 13px; color: var(--ink);
  }
  .gcal-bar button {
    border: none; background: var(--gcal); color: white; font-family: 'Gaegu', sans-serif;
    font-weight: 700; font-size: 12.5px; padding: 7px 14px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
  }
  .gcal-bar-mini {
    background: none; border: none; padding: 0 2px; margin: -2px 0 10px; font-size: 11px; color: var(--muted);
  }
  .gcal-status { color: var(--muted); opacity: .75; cursor: pointer; font-size: 10.5px; }
  .gcal-bar-mini button {
    background: none; color: var(--muted); font-size: 11px; font-weight: 400; padding: 0;
    text-decoration: underline; font-family: inherit;
  }
  .gcal-events { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .gcal-event {
    display: flex; align-items: baseline; gap: 6px; padding: 7px 9px; border-radius: 10px;
    background: var(--gcal-soft); text-decoration: none; color: var(--ink);
  }
  .gcal-time { font-size: 10.5px; font-weight: 700; color: var(--gcal); flex-shrink: 0; }
  .gcal-title { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-col.is-today {
    background: var(--coral-soft); border-color: var(--coral); border-width: 2px;
    box-shadow: 0 4px 14px rgba(255,107,74,0.16);
  }
  .week-col.is-today .week-col-head {
    color: var(--coral); font-size: 15px; border-bottom-color: rgba(255,107,74,0.35);
  }

  .task {
    display: flex; align-items: center; gap: 12px;
    background: var(--paper-card); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 14px 15px; margin-bottom: 9px;
    cursor: pointer;
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), background 0.3s, border-color 0.3s;
    animation: rowIn 0.32s ease both;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .task.checking { transform: scale(1.02); background: var(--sage-soft); border-color: var(--sage); }
  .task.done { background: #F5F2EA; border-color: var(--line); }

  .chk {
    width: 27px; height: 27px; flex-shrink: 0; position: relative;
  }
  .chk svg { width: 100%; height: 100%; display: block; }
  .chk .ring {
    fill: none; stroke: #C9BC9F; stroke-width: 2.2;
    /* 손그림 느낌의 살짝 비뚤어진 원 */
    transition: stroke 0.25s;
  }
  .task.done .chk .ring, .task.checking .chk .ring { stroke: var(--sage); }
  .task.done .chk .fill, .task.checking .chk .fill { opacity: 1; }
  .chk .fill { fill: var(--sage); opacity: 0; transition: opacity 0.2s; }
  .chk .tick {
    fill: none; stroke: white; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 16; stroke-dashoffset: 16;
    transition: stroke-dashoffset 0.28s ease 0.05s;
  }
  .task.done .chk .tick, .task.checking .chk .tick { stroke-dashoffset: 0; }

  .task .body { flex: 1; min-width: 0; }
  .task .title { font-weight: 600; line-height: 1.45; word-break: break-all; transition: color 0.3s; }
  .task.done .title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .task .meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--coral-soft); color: var(--coral);
  }
  .badge.overdue { background: var(--danger-soft); color: var(--danger); }
  .badge.repeat { background: var(--sage-soft); color: var(--sage); }
  .badge.plain { background: #EFE9DA; color: var(--muted); }


  /* ---------- 발행 탭 (찬작스튜디오 발행 일정·예약 트래킹) ---------- */
  .pub-deadline { display: flex; gap: 14px; align-items: center; background: #FFF1EC; border: 2px solid var(--coral); border-radius: 16px; padding: 14px 16px; margin: 6px 0 12px; }
  .pub-deadline.urgent { background: var(--coral); color: white; }
  .pub-deadline .dday { font-size: 26px; font-weight: 900; color: var(--coral); min-width: 84px; text-align: center; letter-spacing: -0.5px; }
  .pub-deadline.urgent .dday { color: white; }
  .pub-deadline .k { font-size: 12px; font-weight: 700; opacity: 0.8; }
  .pub-deadline .t { font-size: 16px; font-weight: 800; margin-top: 2px; }
  .pub-deadline .m { font-size: 12.5px; margin-top: 4px; opacity: 0.85; white-space: pre-line; }
  .pub-day { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
  .pub-day .d { font-weight: 800; font-size: 15px; }
  .pub-day .w { color: var(--muted); font-size: 12.5px; }
  .pub-day.today .d { color: var(--coral); }
  .pub-slot { background: var(--paper-card); border: 1.5px solid var(--line); border-radius: 16px; padding: 13px 14px; margin-bottom: 9px; animation: rowIn 0.32s ease both; }
  .pub-slot.done { background: #F5F2EA; }
  .pub-slot .t { font-weight: 700; line-height: 1.4; }
  .pub-slot .kind { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #EFE9DA; color: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .pub-slot .prep { margin-top: 6px; font-size: 12.5px; color: var(--danger); }
  .pub-slot .prep.ok { color: var(--sage); }
  .pub-slot .memo { margin-top: 5px; font-size: 12.5px; color: var(--muted); white-space: pre-line; }
  .pub-ch { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .pub-ch button, .pub-ch span { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: white; color: var(--muted); font-family: inherit; }
  .pub-ch button { cursor: pointer; }
  .pub-ch .s-scheduled { background: var(--gcal-soft); border-color: var(--gcal); color: var(--gcal); }
  .pub-ch .s-published { background: var(--sage-soft); border-color: var(--sage); color: var(--sage); }
  .pub-ch .s-skip { text-decoration: line-through; opacity: .6; }
  .pub-ch .s-session { border-style: dashed; }
  /* 09-24 2차: 날짜 하나 아래 그날 것을 전부 — '내가' 줄과 '자동' 줄 */
  .pub-day { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 8px; }
  .pub-day .d { font-weight: 800; font-size: 16px; }
  .pub-day .w { color: var(--coral); font-size: 12.5px; font-weight: 800; }
  .pub-slot { border-left: 5px solid transparent; }
  .pub-slot.mine { border-left-color: var(--coral); }
  .pub-slot .t2 { font-size: 15px; font-weight: 800; line-height: 1.4; }
  .pub-slot .t2 .kind { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: #EFE9DA; color: var(--muted); margin-right: 7px; vertical-align: 1.5px; }
  .pub-ch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .pub-ch .rowlab { font-size: 11.5px; font-weight: 800; color: var(--muted);
    border: none; background: none; padding: 0 2px 0 0; min-width: 26px; }
  .pub-ch button b { font-weight: 800; }
  .pub-ch.auto a { text-decoration: none; }
  /* 상태를 색과 글자 둘 다로 (09-24 찬진: "예약 발행이 된 건지도 보기 좋게") */
  .pub-slot.mine .pub-ch button.s-todo { border-color: var(--coral); color: var(--coral); background: #FFF6F3; }
  .pub-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
    font-size: 11.5px; color: var(--muted); margin: 2px 0 4px; line-height: 1.7; }
  .pub-legend .bar { display: inline-block; width: 5px; height: 13px; border-radius: 3px;
    background: var(--coral); vertical-align: -2px; }
  .pub-legend .lg { font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1.5px solid var(--line); background: white; }
  .pub-legend .lg.s-todo { border-color: var(--coral); color: var(--coral); background: #FFF6F3; }
  /* 준비됨 = 영상·캡션이 다 있고 발행 시각만 남은 상태 (2026-09-24) */
  .pub-ch .s-ready, .pub-legend .lg.s-ready { border-color: var(--sage); color: var(--sage); background: var(--sage-soft); }
  .pub-legend .lg.s-scheduled { background: var(--gcal-soft); border-color: var(--gcal); color: var(--gcal); }
  .pub-legend .lg.s-published { background: var(--sage-soft); border-color: var(--sage); color: var(--sage); }

  .pub-legend { font-size: 11.5px; color: var(--muted); margin: 4px 0 2px; line-height: 1.6; }
  .pub-updated { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: 10px; }
  .pub-more { width: 100%; padding: 10px; border-radius: 12px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-family: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }

  /* 체크할 때 튀는 색종이 */
  .confetti-dot {
    position: fixed; width: 6px; height: 6px; border-radius: 50%;
    pointer-events: none; z-index: 60;
    animation: burst 0.55s ease-out forwards;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  .empty { text-align: center; color: var(--muted); padding: 56px 12px; }
  .empty svg { width: 68px; height: 68px; margin-bottom: 12px; opacity: 0.8; }
  .empty .msg { font-family: 'Gaegu', sans-serif; font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .empty .sub { font-size: 13px; line-height: 1.7; }
  .doodle-stroke { fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- 하단 탭 ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(250,246,238,0.92); backdrop-filter: blur(14px);
    border-top: 1.5px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 10px 0 calc(8px + env(safe-area-inset-bottom));
    max-width: var(--content-max); margin: 0 auto;
  }
  nav button {
    flex: 1; background: none; border: none; font-family: 'Gaegu', sans-serif;
    font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0;
    position: relative;
  }
  nav button .ico {
    font-size: 20px; width: 34px; height: 34px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s cubic-bezier(.34,1.56,.64,1), transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  nav button.active .ico { background: var(--coral-soft); transform: scale(1.08); }
  nav button.active { color: var(--coral); }

  /* ---------- 편집 시트 ---------- */
  .sheet-back {
    position: fixed; inset: 0; background: rgba(43,36,30,0.32);
    display: none; z-index: 50; opacity: 0; transition: opacity 0.2s;
  }
  .sheet-back.show { display: block; opacity: 1; }
  .sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 51;
    max-width: var(--content-max); margin: 0 auto;
    background: var(--paper-card); border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform 0.28s cubic-bezier(.32,.9,.36,1.1);
    box-shadow: 0 -8px 30px rgba(43,36,30,0.12);
  }
  .sheet.show { transform: translateY(0); }
  .sheet h3 { margin: 0 0 16px; font-size: 19px; font-family: 'Gaegu', sans-serif; }
  .sheet label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .sheet input[type="text"], .sheet input[type="date"], .sheet select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; background: var(--paper);
  }
  .sheet input:focus, .sheet select:focus { border-color: var(--coral); }
  .day-row { display: flex; gap: 6px; }
  .day-row button {
    flex: 1; padding: 10px 0; border: 1.5px solid var(--line); border-radius: 999px;
    background: var(--paper); font-family: 'Gaegu', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; color: var(--muted); transition: transform 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
  }
  .day-row button.on { background: var(--coral); border-color: var(--coral); color: white; transform: scale(1.08); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 22px; }
  .sheet-actions button {
    padding: 14px 0; border: none; border-radius: 14px;
    font-family: 'Gaegu', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform 0.1s;
  }
  .sheet-actions button:active { transform: scale(0.96); }
  .btn-save { flex: 2; background: var(--coral); color: white; }
  .btn-del { flex: 1; background: var(--danger-soft); color: var(--danger); }

  /* ---------- 로그인 ---------- */
  .auth {
    max-width: 360px; margin: 16vh auto 0; padding: 0 24px; text-align: center;
  }
  .auth h1 { font-size: 40px; margin-bottom: 6px; font-family: 'Gaegu', sans-serif; }
  .auth p { color: var(--muted); font-size: 14px; margin: 0 0 26px; }
  .auth input {
    width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border: 1.5px solid var(--line); border-radius: 14px;
    font-size: 15px; font-family: inherit; outline: none; background: var(--paper-card);
  }
  .auth input:focus { border-color: var(--coral); }
  .auth button {
    width: 100%; padding: 14px 0; border: none; border-radius: 14px;
    background: var(--coral); color: white; font-weight: 700; font-size: 16px;
    cursor: pointer; font-family: 'Gaegu', sans-serif; margin-top: 4px;
  }
  .auth .sub { background: none; color: var(--muted); font-weight: 600; font-size: 13px; margin-top: 12px; font-family: 'Pretendard'; }
  .auth .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .remember-row {
    display: flex; align-items: center; gap: 7px; justify-content: flex-start;
    font-size: 13.5px; color: var(--muted); margin: 2px 2px 12px; cursor: pointer; user-select: none;
  }
  .remember-row input[type="checkbox"] {
    width: 17px; height: 17px; margin: 0; accent-color: var(--coral); cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(6px);
    background: var(--ink); color: white; padding: 11px 20px; border-radius: 999px;
    font-size: 13.5px; font-family: 'Gaegu', sans-serif; opacity: 0;
    transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 일기 ---------- */
  .dcard {
    background: var(--paper-card); border: 1.5px solid var(--line);
    border-radius: 18px; padding: 16px 17px; margin-bottom: 12px;
    animation: rowIn 0.32s ease both;
  }
  .dcard .dlabel {
    font-family: 'Gaegu', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .dcard .dlabel::before { content: '✦'; color: var(--coral); font-size: 10px; }
  .wx-now { display: flex; align-items: center; gap: 14px; }
  .wx-now .wx-emoji { font-size: 40px; line-height: 1; }
  .wx-now .wx-temp { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .wx-now .wx-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .wx-hilo { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .wx-hilo b { color: var(--ink); }
  .lastyear-diary {
    margin-top: 10px; padding: 11px 13px; background: var(--paper);
    border-radius: 12px; font-size: 13.5px; line-height: 1.65; color: var(--ink);
    border-left: 3px solid var(--coral);
  }
  .lastyear-diary .ly-feel { color: var(--coral); font-family: 'Gaegu', sans-serif; font-weight: 700; }
  .diary-input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--paper); padding: 13px 15px; font-size: 15px; font-family: inherit;
    outline: none; resize: vertical; min-height: 110px; line-height: 1.7;
  }
  .diary-input:focus { border-color: var(--coral); }
  .feel-input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--paper); padding: 11px 14px; font-size: 14px; font-family: inherit;
    outline: none; margin-top: 8px;
  }
  .feel-input:focus { border-color: var(--coral); }
  .diary-save {
    width: 100%; margin-top: 10px; padding: 13px 0; border: none; border-radius: 14px;
    background: var(--coral); color: white; font-family: 'Gaegu', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
  }
  .diary-save:active { transform: scale(0.97); }
  .city-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .city-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 4px 6px 4px 11px; font-size: 13px; font-weight: 600;
    cursor: grab; user-select: none; transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .city-chip:active { cursor: grabbing; }
  .city-chip.dragging { opacity: 0.4; transform: scale(0.96); }
  .city-chip.drag-over { box-shadow: 0 0 0 2.5px var(--coral); }
  .city-chip.primary { border-color: var(--coral); background: var(--coral-soft); }
  .city-chip.recorded { border-color: var(--sage); background: var(--sage-soft); box-shadow: 0 1px 4px rgba(111,168,138,0.25); }
  .city-chip .cw { color: var(--muted); font-weight: 500; }
  .city-chip .cw-hilo { font-size: 12px; color: var(--muted); font-weight: 600; }
  .city-chip .cw-hilo b { color: var(--danger); font-weight: 700; }
  .city-chip .cw-hilo i { color: #5B8BC9; font-style: normal; font-weight: 700; }
  .city-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .city-chip .rec-btn {
    border: none; background: var(--coral-soft); color: var(--coral);
    font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 12px;
    border-radius: 999px; padding: 1px 7px; cursor: pointer;
  }
  .city-chip .rec-btn.on { background: var(--sage); color: white; }
  .city-chip .del-btn {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 0 2px; line-height: 1;
  }
  .city-add {
    border: 1.5px dashed var(--muted); background: none; border-radius: 999px;
    padding: 4px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
    font-family: 'Gaegu', sans-serif; font-weight: 700;
  }
  .past-entry { padding: 12px 4px; }
  .past-entry .pe-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .past-entry .pe-head .pe-date { font-family: 'Gaegu', sans-serif; font-weight: 700; color: var(--ink); font-size: 14px; }
  .past-entry .pe-body { font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-all; }
  .past-entry .pe-feel { font-size: 12.5px; color: var(--coral); margin-top: 3px; }
  .wx-loading { color: var(--muted); font-size: 13.5px; padding: 4px 0; }

  /* ---------- 지난 일기: 월 알약 → 날짜 그리드 ---------- */
  .pe-months { display: flex; flex-wrap: wrap; gap: 6px; }
  .pe-month {
    border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px;
    padding: 4px 11px; font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .pe-month small { color: var(--muted); font-weight: 400; margin-left: 2px; }
  .pe-month.on { background: var(--coral); border-color: var(--coral); color: white; }
  .pe-month.on small { color: rgba(255,255,255,0.8); }
  .pe-daygrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .pe-daygrid:not(:empty) { margin-top: 10px; }
  .pe-daychip {
    width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-family: 'Gaegu', sans-serif; font-weight: 700;
    font-size: 13px; cursor: pointer;
  }
  .pe-daychip.on { background: var(--coral); border-color: var(--coral); color: white; }
  .pe-detailwrap:not(:empty) { margin-top: 10px; border-top: 1.5px dashed var(--line); }

  /* ---------- 편수 체크리스트 ---------- */
  .sub-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .sub-chip {
    min-width: 30px; height: 38px; padding: 3px 4px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-family: 'Gaegu', sans-serif; font-weight: 700;
    cursor: pointer; transition: transform 0.15s, background 0.15s, border-color 0.15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1;
  }
  .sub-chip .sub-day { font-size: 9.5px; color: var(--muted); }
  .sub-chip .sub-num { font-size: 12.5px; }
  .sub-chip.on { background: var(--sage); border-color: var(--sage); color: white; }
  .sub-chip.on .sub-day { color: rgba(255,255,255,0.85); }
  .sub-chip:active { transform: scale(0.9); }
  .sub-chip.readonly { cursor: default; opacity: 0.75; display: inline-flex; }
  .sub-chip.readonly:active { transform: none; }
  .sub-empty-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ---------- 사진 ---------- */
  .photo-label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; }
  .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px; margin: -4px; border-radius: 16px; transition: background 0.15s, box-shadow 0.15s; }
  .photo-grid.drag-over-grid { background: var(--coral-soft); box-shadow: 0 0 0 2px var(--coral) inset; }
  .photo-thumb {
    position: relative; width: 76px; height: 76px; border-radius: 14px; overflow: hidden;
    border: 1.5px solid var(--line); flex-shrink: 0; background: var(--paper);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .photo-thumb .pdel {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 999px;
    border: none; background: rgba(43,36,30,0.62); color: white; font-size: 12px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .photo-add {
    width: 76px; height: 76px; flex-shrink: 0; border-radius: 14px;
    border: 1.5px dashed var(--muted); background: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-family: 'Gaegu', sans-serif; font-size: 11.5px; font-weight: 700; cursor: pointer;
  }
  .photo-add .plus { font-size: 20px; line-height: 1; }
  .photo-add[disabled] { opacity: 0.5; cursor: default; }
  .spin {

function twoWeekDates() {
  const d = new Date();
  const dow = d.getDay(); // 0=일 ... 6=토
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1)); // 이번 주 월요일로 이동
  const out = [];
  for (let i = 0; i < 14; i++) {
    out.push(dateStr(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function spawnConfetti(anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ["#FF6B4A", "#6FA88A", "#FFC15E"];
  for (let i = 0; i < 7; i++) {
    const dot = document.createElement("div");
    dot.className = "confetti-dot";
    const angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.5;
    const dist = 26 + Math.random() * 18;
    dot.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
    dot.style.setProperty("--dy", `${Math.sin(angle) * dist - 8}px`);
    dot.style.left = `${cx - 3}px`;
    dot.style.top = `${cy - 3}px`;
    dot.style.background = colors[i % colors.length];
    document.body.appendChild(dot);
    setTimeout(() => dot.remove(), 600);
  }
}

async function geocodeCity(name) {
  /* 1) 내장 한국 도시 우선 ("서울시"→"서울"처럼 시/군 접미사도 처리) */
  const stripSuffix = (s) => s.replace(/(특별시|광역시|특별자치시|특별자치도|시|군|도)$/,"").trim();
  const candidates = [stripSuffix(name), ...name.split(/\s+/).map(stripSuffix).reverse()];
  for (const c of candidates) {
    if (KR_CITIES[c]) {
      const [lat, lon] = KR_CITIES[c];
      return { name: c, lat, lon };
    }
  }
  /* 2) API 검색 (한국어 → 영어 순서로 시도, 한글 입력이면 한국 결과 우선) */
  for (const lang of ["ko", "en"]) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=${lang}`;
    const r = await fetch(url); const j = await r.json();
    if (j.results && j.results.length) {
      const isHangul = /[가-힣]/.test(name);
      const g = (isHangul && j.results.find(x => x.country_code === "KR")) || j.results[0];
      return { name: g.name, lat: g.latitude, lon: g.longitude };
    }
  }
  return null;
}

    sb.from("coach").select("body").order("updated_at", { ascending: false }).limit(1).maybeSingle(),
  ]);
  growthCoach = pub;
  if (!priv.error && priv.data && priv.data.body) growthCoach = { ...(pub || {}), ...priv.data.body };
}
function coachCard() {

      <small>${escapeHtml([ev.when, ev.where].filter(Boolean).join(" · "))}</small>
      ${ev.why ? `<div>${escapeHtml(ev.why)}</div>` : ""}</div>`).join("");
  const hasMore = (co.good && co.good.length) || (co.fix && co.fix.length) || quests.length || people.length;
  const card = document.createElement("div");

    <div class="g-head">${escapeHtml(co.headline)}</div>

    ${co.mission ? `<div class="g-try"><b>사람 미션</b>${escapeHtml(co.mission)}</div>` : ""}
    ${events ? `<div class="g-events"><b>가 볼 만한 모임</b>${events}</div>` : ""}
    ${hasMore ? `<button type="button" class="g-more" id="gMore">더 보기 ▾</button>
    <div class="g-detail" id="gDetail" hidden>
      ${co.good && co.good.length ? `<ul>${li(co.good.map(x => "잘한 것 · " + x))}</ul>` : ""}
      ${co.fix && co.fix.length ? `<ul>${li(co.fix.map(x => "고칠 것 · " + x))}</ul>` : ""}
      ${people.length ? `<h4>사람 · 연애</h4><ul>${li(people)}</ul>` : ""}
      ${quests.length ? `<h4>이달 퀘스트</h4>${quests.map(q => `<div class="g-q">${escapeHtml(q.text)} <small>${escapeHtml(q.measure || "")}</small></div>`).join("")}` : ""}
    </div>` : ""}`;
  const more = card.querySelector("#gMore");
  if (more) more.addEventListener("click", () => {
    const d = card.querySelector("#gDetail");
    d.hidden = !d.hidden;
    more.textContent = d.hidden ? "더 보기 ▾" : "접기 ▴";
  });
  return card;
}

  const RUN_RE = /^러닝\s+([\d.]+)\s*km$/;
  function splitNote(note) {

      const mm = routinePart.match(RUN_RE);

  }
  /* 저장해둔 운동 메모("벤치프레스 55kg 6×5, 렛풀다운 32kg 12×4")를 다시 편집 가능한 상태로 되돌린다.
     예전 형식("상체A — 벤치프레스 ...")은 앞의 루틴 이름만 떼고 똑같이 읽는다.

  function parseRoutineNote(note) {
    let body = (note || "").trim();

  function restoreRoutineFromNote() {

      group.entries.push(e);

  } else {

/* ---------- 사진 ---------- */
function renderPhotoGrid() {
  const grid = $("photoGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const photos = (todayEntry && todayEntry.photos) || [];
  photos.forEach(p => {
    const thumb = document.createElement("div");
    thumb.className = "photo-thumb";
    thumb.innerHTML = `<img src="${p.url}" alt=""><button class="pdel" title="삭제">×</button>`;
    thumb.querySelector(".pdel").addEventListener("click", () => removePhoto(p));
    grid.appendChild(thumb);
  });
  if (photos.length < MAX_PHOTOS) {
    const add = document.createElement("button");
    add.className = "photo-add";
    add.id = "photoAddBtn";
    add.innerHTML = `<span class="plus">+</span><span>추가</span>`;
    add.addEventListener("click", () => { const inp = $("photoInput"); if (inp) inp.click(); });
    grid.appendChild(add);
  }

  // 드래그 앤 드롭으로도 사진 추가
  let dragDepth = 0;
  grid.addEventListener("dragover", (e) => { e.preventDefault(); });
  grid.addEventListener("dragenter", (e) => {
    e.preventDefault();
    dragDepth++;
    grid.classList.add("drag-over-grid");
  });
  grid.addEventListener("dragleave", () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) grid.classList.remove("drag-over-grid");
  });
  grid.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    grid.classList.remove("drag-over-grid");
    const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith("image/"));
    if (!files.length) { toast("이미지 파일만 넣을 수 있어요"); return; }
    uploadPhotos(files);
  });
}

async function uploadPhotos(fileList) {
  if (!fileList || !fileList.length) return;
  let current = [...((todayEntry && todayEntry.photos) || [])];
  const slots = MAX_PHOTOS - current.length;
  if (slots <= 0) { toast(`사진은 최대 ${MAX_PHOTOS}장까지 첨부할 수 있어요`); return; }
  const files = Array.from(fileList).slice(0, slots);
  const addBtn = $("photoAddBtn");
  if (addBtn) { addBtn.disabled = true; addBtn.innerHTML = '<span class="spin"></span><span>업로드중</span>'; }
  for (const file of files) {
    try {
      const ext = ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
      const path = `${user.id}/${editDate}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: upErr } = await sb.storage.from("diary-photos").upload(path, file);
      if (upErr) throw upErr;
      const { data: pub } = sb.storage.from("diary-photos").getPublicUrl(path);
      current = [...current, { path, url: pub.publicUrl }];
    } catch (err) {
      toast("업로드 실패: " + err.message);
    }
  }
  const { error } = await sb.from("diary").upsert({ on_date: editDate, photos: current }, { onConflict: "user_id,on_date" });
  if (error) toast("저장 실패: " + error.message);
  await loadDiary();
  renderPhotoGrid();
}

async function removePhoto(photo) {
  const next = ((todayEntry && todayEntry.photos) || []).filter(p => p.path !== photo.path);
  await sb.storage.from("diary-photos").remove([photo.path]);
  const { error } = await sb.from("diary").upsert({ on_date: editDate, photos: next }, { onConflict: "user_id,on_date" });
  if (error) { toast("삭제 실패: " + error.message); return; }
  await loadDiary();
  renderPhotoGrid();
}

/* ---------- 운동 통계: 이번 주(월~일)·이번 달에 운동한 날 수 ---------- */
let exerciseDays = new Set(); // 운동한 날짜 "YYYY-MM-DD" (이번 달 1일 또는 이번 주 월요일 중 빠른 날부터)
async function loadExerciseStats() {
  const wk = twoWeekDates();
  const monthStart = todayStr().slice(0, 8) + "01";
  const from = wk[0] < monthStart ? wk[0] : monthStart;
  const { data, error } = await sb.from("diary").select("on_date").eq("exercised", true).gte("on_date", from);
  if (error) return;
  exerciseDays = new Set((data || []).map(r => r.on_date));
}
function exerciseCounts() {
  const wk = twoWeekDates(), ym = todayStr().slice(0, 7);
  let week = 0, month = 0;
  exerciseDays.forEach(d => {
    if (d >= wk[0] && d <= wk[6]) week++;
    if (d.slice(0, 7) === ym) month++;
  });
  return { week, month };
}
function exerciseStatsEl() {
  const { week, month } = exerciseCounts();
  const el = document.createElement("div");
  el.className = "ex-stats";
  el.innerHTML = `<span class="ex-icon">🏃</span><span>이번 주 <b>${week}</b>일</span><span class="ex-sep">·</span><span>이번 달 <b>${month}</b>일</span>`;
  return el;
}

/* ---------- 로또 번호 추천 (6/45) ----------
   한 번 뽑은 번호는 그날 안에선 그대로 두고(화면이 다시 그려져도 안 바뀜), 다시 누르면 새로 뽑는다. */
const LOTTO_KEY = "lotto_pick";
function drawLotto() {
  const pool = Array.from({ length: 45 }, (_, i) => i + 1);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 6).sort((a, b) => a - b);
}
function lottoStatsEl() {
  let saved = null;
  try {
    const raw = JSON.parse(localStorage.getItem(LOTTO_KEY) || "null");
    if (raw && raw.date === todayStr() && Array.isArray(raw.nums)) saved = raw.nums;
  } catch {}
  const el = document.createElement("button");
  el.type = "button";
  el.className = "ex-stats lotto-pick";
  const paint = nums => {
    el.innerHTML = `<span class="ex-icon">🎱</span>` + (nums
      ? nums.map(n => `<b>${n}</b>`).join("") + `<span class="lotto-again">다시</span>`
      : `<span>로또 번호 뽑기</span>`);
  };
  paint(saved);
  el.addEventListener("click", () => {
    const nums = drawLotto();
    try { localStorage.setItem(LOTTO_KEY, JSON.stringify({ date: todayStr(), nums })); } catch {}
    paint(nums);
  });
  return el;
}

/* 생활 기록 카드를 다시 그릴 때 스크롤 위치를 유지한다 */
function rerenderLife() { const y = window.scrollY; renderCalendarView(); window.scrollTo(0, y); }

  }

  const won = n => Number(n).toLocaleString() + "원";
  const man = n => !n ? "—" : (n / 10000).toFixed(n >= 1000000 ? 0 : 1) + "만";
  const mLabel = m => `${Number(m.slice(5))}월`;
  const seasons = lifeLog.filter(r => r.kind === "season");
  const bills = lifeLog.filter(r => r.kind === "bill");
  const subs = lifeLog.filter(r => r.kind === "sub");
  const spends = lifeLog.filter(r => r.kind === "spend");
  const thisMonth = todayStr().slice(0, 7);

  /* ---- 지출: 카테고리는 고정 색 그룹으로 묶는다(색은 순위가 아니라 카테고리를 따른다). 팔레트 순서 = dataviz 검증 순서 ---- */
  const SPEND_GROUPS = [
    { k: "주거", c: "#2a78d6", m: l => l.startsWith("주거") },
    { k: "배달", c: "#eb6834", m: l => l === "배달" },
    { k: "외식·카페", c: "#1baf7a", m: l => l.startsWith("외식") || l.startsWith("카페") },
    { k: "AI 툴", c: "#eda100", m: l => l.startsWith("사업") },
    { k: "생활·마트", c: "#e87ba4", m: l => l.startsWith("생활") },
    { k: "여행", c: "#008300", m: l => l === "여행" },
    { k: "고정비", c: "#4a3aa7", m: l => /^(연금|통신|공과금|구독)/.test(l) },
  ];
  const OTHER = { k: "기타", c: "#c9c2b4" };
  const ALL_GROUPS = [...SPEND_GROUPS, OTHER];
  const groupOf = l => SPEND_GROUPS.find(g => g.m(l)) || OTHER;
  const spendMonths = [...new Set(spends.map(s => s.on_date.slice(0, 7)))].sort().reverse();
  const inMonth = m => spends.filter(s => s.on_date.slice(0, 7) === m);

  const groupSum = (m, k) => inMonth(m).filter(s => groupOf(s.label).k === k).reduce((a, s) => a + (s.amount || 0), 0);
  if (!lifeSpendSel || !spendMonths.includes(lifeSpendSel)) lifeSpendSel = spendMonths[0] || null;

  /* ---- 구독 ---- */

  const today = new Date(todayStr() + "T00:00:00");

    if (!day) return null;

    if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, day);

    lastSeason ? `${lastSeason.label} ${md(lastSeason.on_date)}` : "",

  const spendBody = !spendMonths.length ? `<div class="cd-empty">아직 정리된 달이 없어요 — 뱅크샐러드 내보내기 파일을 for me\\지출\\명세서 에 넣고 Claude에게 "넣었어"</div>` : (() => {
    const legend = `<div class="sp-legend">${ALL_GROUPS.map(g => `<span><i style="background:${g.c}"></i>${g.k}</span>`).join("")}</div>`;
    const bars = spendMonths.slice(0, 6).map((m, i) => {
      const tot = spendSum(m), prev = spendMonths[i + 1], diff = prev && m !== thisMonth ? tot - spendSum(prev) : null;   // 진행 중인 달은 비교 안 함
      const segs = ALL_GROUPS.map(g => ({ g, v: groupSum(m, g.k) })).filter(e => e.v > 0).map(e =>
        `<span class="sp-seg" style="flex:${e.v};background:${e.g.c}" title="${e.g.k} ${won(e.v)} (${Math.round(e.v / tot * 100)}%)"></span>`).join("");
      return `<div class="sp-row${m === lifeSpendSel ? " on" : ""}" data-month="${m}"><div class="sp-head"><b>${mLabel(m)}${m === thisMonth ? " <small>진행 중</small>" : ""}</b> ${man(tot)}원
          ${diff != null ? `<small class="${diff > 0 ? "up" : "down"}">${diff > 0 ? "▲" : "▼"} ${man(Math.abs(diff))}</small>` : ""}</div>
          <div class="sp-bar">${segs}</div></div>`; }).join("");
    // 선택한 달: 요약 + 카테고리 순위(누르면 가맹점 내역이 펼쳐짐)
    const m = lifeSpendSel, tot = spendSum(m), idx = spendMonths.indexOf(m), prevM = spendMonths[idx + 1];
    const rows = inMonth(m).slice().sort((a, b) => b.amount - a.amount), max = rows[0] ? rows[0].amount : 1;
    const rank = rows.map(s => {
      const g = groupOf(s.label);
      const pv = prevM ? inMonth(prevM).find(x => x.label === s.label && !!(x.meta && x.meta.biz) === !!(s.meta && s.meta.biz)) : null;
      const d = pv && m !== thisMonth ? s.amount - pv.amount : null;
      const items = (s.meta && s.meta.items) || [];
      const key = s.label + (s.meta && s.meta.biz ? "|biz" : "");
      const open = lifeSpendCat === key;
      return `<div class="sp-rank${items.length ? " has-items" : ""}${open ? " open" : ""}" data-cat="${escapeHtml(key)}">
          <span class="sp-name">${items.length ? (open ? "▾ " : "▸ ") : ""}${escapeHtml(s.label.replace("사업 · ", "").replace("주거 · ", ""))}</span>
          <span class="sp-track"><i style="width:${Math.max(2, s.amount / max * 100)}%;background:${g.c}"></i></span>
          <span class="sp-val">${man(s.amount)} <small>${Math.round(s.amount / tot * 100)}%${d != null && Math.abs(d) >= 10000 ? ` · ${d > 0 ? "▲" : "▼"}${man(Math.abs(d))}` : ""}</small></span></div>
        ${open ? `<div class="sp-items">${items.map(it => `<div><span>${escapeHtml(it.n)}${it.c > 1 ? ` <small>${it.c}건</small>` : ""}</span><b>${won(it.a)}</b></div>`).join("")}</div>` : ""}`; }).join("");
    const months6 = spendMonths.slice(0, 6).reverse();
    const k = lifeTrend, tg = ALL_GROUPS.find(x => x.k === k);
    const vals = months6.map(mm => k === "전체" ? spendSum(mm) : groupSum(mm, k)), vmax = Math.max(...vals, 1);
    const trend = `<div class="sp-rank-title">월별 추이 <small>— 막대를 누르면 그 달로 이동</small></div>
      <div class="sp-chips">${["전체", ...ALL_GROUPS.map(x => x.k)].map(x => `<button type="button" class="${x === k ? "on" : ""}" data-k="${x}">${x}</button>`).join("")}</div>
      <div class="sp-cols">${months6.map((mm, i) => `<div class="sp-col${mm === lifeSpendSel ? " on" : ""}" data-month="${mm}" title="${mLabel(mm)} ${k} ${won(vals[i])}">
          <span class="sp-cv">${man(vals[i])}</span>
          <span class="sp-cbar" style="height:${Math.max(2, vals[i] / vmax * 70)}px;background:${tg ? tg.c : "var(--ink)"}"></span>
          <span class="sp-cm">${mLabel(mm)}</span></div>`).join("")}</div>`;
    return legend + `<div class="sp-rank-title">달을 누르면 아래에 그 달 내역이 나와요</div>` + bars +
      `<div class="sp-sel"><b>${mLabel(m)}</b> 총 ${won(tot)} <small>· 사업 ${won(spendSum(m, true))} · 개인 ${won(spendSum(m, false))}${m === thisMonth ? " · 진행 중" : prevM ? ` · ${mLabel(prevM)} 대비 ${tot - spendSum(prevM) >= 0 ? "+" : ""}${won(tot - spendSum(prevM))}` : ""}</small></div>
       <div class="sp-hint">카테고리를 누르면 어디에 썼는지 보여요</div>` + rank + `<div id="spTrend">${trend}</div>`;
  })();

  /* 수입·지출 섹션: 달마다 수입(초록)과 지출(주황)을 나란히, 남은 돈 = 수입 − 지출.
     수입원(찬작스튜디오·쿠팡 위탁·11번가…)은 label 로 쌓여서 새 수입원이 생기면 자동으로 같이 보인다. */
  const incomes = lifeLog.filter(r => r.kind === "income");
  const incSum = m => incomes.filter(r => r.on_date.slice(0, 7) === m).reduce((a, r) => a + (r.amount || 0), 0);
  const flowAllMonths = [...new Set([...incomes, ...spends].map(r => r.on_date.slice(0, 7)))].sort().reverse();
  const flowMonths = lifeFlowAll ? flowAllMonths : flowAllMonths.slice(0, 6);
  const INCOME_GOAL = 5000000;   // 찬작스튜디오 대시보드의 월 목표
  const flowBody = !incomes.length ? `<div class="cd-empty">수입 기록이 아직 없어요 — Claude 가 매출 시트에서 월별로 올려요</div>` : (() => {
    const fmax = Math.max(1, ...flowMonths.map(m => Math.max(incSum(m), spendSum(m))));
    /* 달을 누르면 펼쳐지는 상세: 수입원별 · 지출 카테고리별 · 남은 돈 · 전달 대비 */
    const flowDetail = (m, inc, sp, net, srcs) => { try {
      const hasSp = spends.some(s => s.on_date.slice(0, 7) === m);
      const pm = flowAllMonths[flowAllMonths.indexOf(m) + 1], psp = pm ? spendSum(pm) : 0;
      const rate = inc > 0 && hasSp ? Math.round(net / inc * 100) : null;
      const diff = hasSp && psp && m !== thisMonth ? sp - psp : null;
      const incList = srcs.map(s => `<div class="fd-line"><span>${escapeHtml(s.label)}${s.meta && s.meta.count ? ` <small>${s.meta.count}건</small>` : ""}</span><b>${won(s.amount)}</b></div>`
        + ((s.meta && s.meta.items) || []).slice(0, 5).map(it => `<div class="fd-sub"><span>${escapeHtml(it.n)}${it.c > 1 ? ` <small>${it.c}건</small>` : ""}</span><span>${won(it.a)}</span></div>`).join("")).join("");
      const grp = ALL_GROUPS.map(g => ({ g, v: groupSum(m, g.k) })).filter(e => e.v > 0).sort((a, b) => b.v - a.v);
      const stack = grp.map(e => `<span class="sp-seg" style="flex:${e.v};background:${e.g.c}" title="${e.g.k} ${won(e.v)}"></span>`).join("");
      const spList = grp.slice(0, 6).map(e => `<div class="fd-line"><span><i class="fd-dot" style="background:${e.g.c}"></i>${e.g.k}</span><b>${won(e.v)} <small>${Math.round(e.v / sp * 100)}%</small></b></div>`).join("");
      const notes = [rate != null ? (net >= 0 ? `수입의 ${rate}%를 남겼어요` : `수입보다 ${won(-net)} 더 썼어요`) : "", diff != null ? `${mLabel(pm)}보다 지출 ${diff > 0 ? "▲" : "▼"} ${won(Math.abs(diff))}` : ""].filter(Boolean);
      return `<div class="fd">
        <div class="fd-sum"><div><small>수입</small><b>${won(inc)}</b></div><div><small>지출</small><b>${hasSp ? won(sp) : "미정리"}</b></div>
          <div><small>남은 돈</small><b class="${net >= 0 ? "plus" : "minus"}">${hasSp ? (net >= 0 ? "+" : "−") + won(Math.abs(net)) : "—"}</b></div></div>
        ${notes.length ? `<div class="fd-note">${notes.join(" · ")}</div>` : ""}
        ${incList ? `<div class="fd-h">수입</div>${incList}` : ""}
        ${hasSp ? `<div class="fd-h">지출 — 많이 쓴 순</div><div class="sp-bar">${stack}</div><div style="margin-top:6px">${spList}</div>
          <button type="button" class="fd-go" data-go="${m}">${mLabel(m)} 지출 내역 자세히 ›</button>` : ""}
      </div>`; } catch (e) { return ""; } };
    const rows = flowMonths.map(m => {
      const inc = incSum(m), sp = spendSum(m), net = inc - sp, srcs = incomes.filter(r => r.on_date.slice(0, 7) === m).sort((a, b) => b.amount - a.amount);
      return `<div class="fl-row${m === lifeFlowSel ? " on" : ""}" data-flow="${m}"><div class="fl-head"><b>${m === lifeFlowSel ? "▾" : "▸"} ${mLabel(m)}${m === thisMonth ? " <small>진행 중</small>" : ""}</b>
          <span class="fl-net ${net >= 0 ? "plus" : "minus"}">${!spends.some(s => s.on_date.slice(0, 7) === m) ? "지출 미정리" : net >= 0 ? `+${man(net)}원 남음` : `−${man(-net)}원 모자람`}</span></div>
        <div class="fl-bar"><i style="width:${inc / fmax * 100}%;background:#1baf7a" title="수입 ${won(inc)}"></i><span>수입 ${man(inc)}</span></div>
        <div class="fl-bar"><i style="width:${sp / fmax * 100}%;background:#eb6834" title="지출 ${won(sp)}"></i><span>지출 ${man(sp)}</span></div>
        ${srcs.length ? `<div class="fl-src">${srcs.map(s => `${escapeHtml(s.label)} ${man(s.amount)}${s.meta && s.meta.count ? ` <small>${s.meta.count}건</small>` : ""}`).join(" · ")}</div>` : ""}${m === lifeFlowSel ? flowDetail(m, inc, sp, net, srcs) : ""}</div>`; }).join("");
    const moreBtn = flowAllMonths.length > 6 ? `<button type="button" class="fl-more" id="flMore">${lifeFlowAll ? "최근 6개월만 보기 ▴" : `이전 달 ${flowAllMonths.length - 6}개 더 보기 ▾`}</button>` : "";
    // 이번 달 카드: 진행 중인 달의 수입·지출·남은 돈과 목표 달성률, 아직 안 나간 월세
    const cm = thisMonth, studio = incomes.filter(r => r.on_date.slice(0, 7) === cm && r.label.startsWith("찬작")).reduce((a, r) => a + r.amount, 0);
    const cInc = incSum(cm), cSp = spendSum(cm), cNet = cInc - cSp, day = Number(todayStr().slice(8));
    const asOf = spends.filter(s => s.on_date.slice(0, 7) === cm && s.created_at).map(s => s.created_at.slice(0, 10)).sort().pop();
    const rentLeft = groupSum(cm, "주거") === 0 && spendMonths.some(m => m < cm && groupSum(m, "주거") > 0);
    const now = `<div class="fl-now"><div class="fl-now-t"><b>이번 달</b> <small>${mLabel(cm)} · ${day}일째</small></div>
        <div class="fl-now-g">
          <div><small>수입</small><b>${man(cInc)}원</b></div>
          <div><small>지출${asOf ? ` (${md(asOf)} 기준)` : ""}</small><b>${cSp ? man(cSp) + "원" : "미정리"}</b></div>
          <div><small>지금까지 남은 돈</small><b class="${cNet >= 0 ? "plus" : "minus"}">${cNet >= 0 ? "+" : "−"}${man(Math.abs(cNet))}원</b></div>
        </div>
        <div class="fl-goal"><span>찬작 매출 <b>${won(studio)}</b> / 목표 ${man(INCOME_GOAL)}원</span>
          <span class="sp-track"><i style="width:${Math.min(100, studio / INCOME_GOAL * 100)}%;background:#1baf7a"></i></span>
          <small>${Math.round(studio / INCOME_GOAL * 100)}%</small></div>
        ${rentLeft ? `<div class="sp-hint">아직 안 나간 고정비: 월세 60만 원(14일)</div>` : ""}</div>`;
    return now + `<div class="sp-rank-title">달마다 <small>— 달을 누르면 자세히 나와요</small></div>` + rows + moreBtn;
  })();

  /* 구독 섹션 */
  const subRows = subs.slice().sort((a, b) => ((a.meta && a.meta.day) || 99) - ((b.meta && b.meta.day) || 99)).map(s => {
    const mm = s.meta || {}, du = daysUntil(mm.day);
    return `<tr><td class="num">${mm.day ? mm.day + "일" : "—"}</td>
      <td class="sub-name" data-ren="${s.id}" title="누르면 이름을 고칠 수 있어요">${escapeHtml(s.label)}${du != null && du <= 7 ? ` <span class="soon">${du === 0 ? "오늘" : `D-${du}`}</span>` : ""}</td>
      <td class="num">${mm.cycle === "연" ? `연 ${won(s.amount)}` : won(s.amount)}</td>
      <td><span class="tag ${mm.biz ? "biz" : ""}">${mm.biz ? "사업" : "개인"}</span></td>
      <td><button class="x" data-del="${s.id}" title="삭제">×</button></td></tr>`; }).join("");
  const subBody = `${subRows ? `<table class="life-tbl"><tr><th>결제일</th><th>이름</th><th>금액</th><th></th><th></th></tr>${subRows}
      <tr class="tot"><td></td><td>월 합계</td><td class="num">${won(subTotal())}</td><td colspan="2"><small>사업 ${man(subTotal(true))} · 개인 ${man(subTotal(false))}</small></td></tr></table>` : `<div class="cd-empty">아직 기록이 없어요</div>`}
    <details class="life-add"><summary>+ 구독 추가</summary><div class="bill-form">
      <input id="subName" placeholder="이름 (예: Claude)">
      <input type="number" id="subAmt" inputmode="numeric" placeholder="금액">
      <select id="subCycle"><option>월</option><option>연</option></select>
      <input type="number" id="subDay" inputmode="numeric" min="1" max="31" placeholder="결제일" style="width:64px">
      <select id="subBiz"><option value="1">사업</option><option value="0">개인</option></select>
      <button type="button" id="subAdd">추가</button></div></details>`;

  /* 공과금 섹션 */
  const billBody = `${billMonths.length ? `<table class="life-tbl"><tr><th>월</th>${billKindsUsed.map(k => `<th>${k}</th>`).join("")}<th>합계</th><th>작년</th></tr>
      ${billMonths.map(m => {
        const ly = `${Number(m.slice(0, 4)) - 1}${m.slice(4)}`, lySum = billSum(ly);
        return `<tr><td>${m.slice(2, 4)}.${m.slice(5)}</td>${billKindsUsed.map(k => {
          const b = bills.find(x => x.on_date.slice(0, 7) === m && x.label === k);
          return `<td class="num">${b ? `${won(b.amount)}<button class="x" data-del="${b.id}" title="삭제">×</button>` : "—"}</td>`; }).join("")}
          <td class="num"><b>${won(billSum(m))}</b></td><td class="num"><small>${lySum ? won(lySum) : "—"}</small></td></tr>`; }).join("")}</table>`
      : `<div class="cd-empty">아직 기록이 없어요</div>`}
    <details class="life-add"><summary>+ 공과금 추가</summary><div class="bill-form">
      <input type="month" id="billMonth" value="${thisMonth}">
      <select id="billKind">${BILL_KINDS.map(k => `<option>${k}</option>`).join("")}</select>
      <input type="number" id="billAmt" inputmode="numeric" placeholder="금액">
      <button type="button" id="billAdd">추가</button></div></details>`;

  /* 계절 섹션 */
  const years = [...new Set(seasons.map(s => s.on_date.slice(0, 4)))].sort().reverse();
  const seasonBody = years.length ? `<table class="life-tbl season"><tr><th></th>${SEASON_KINDS.map(s => `<th>${s.ico} ${s.k}</th>`).join("")}</tr>
      ${years.map(y => `<tr><td>${y}</td>${SEASON_KINDS.map(s => {
        const hit = seasons.filter(r => r.label === s.k && r.on_date.slice(0, 4) === y).map(r => md(r.on_date)).sort();
        return `<td>${hit.length ? hit.join(", ") : "—"}</td>`; }).join("")}</tr>`).join("")}</table>
      <div class="sp-hint">달력에서 날짜를 누르고 칩으로 기록해요</div>` : `<div class="cd-empty">달력에서 날짜를 누르고 칩으로 기록해요</div>`;

  card.innerHTML = `
    <summary class="life-sum">생활 기록${sumParts.length ? ` <small>· ${escapeHtml(sumParts.join(" · "))}</small>` : ""}</summary>
    ${sec("flow", "수입·지출", flowMonths[0] && incomes.length ? `${mLabel(flowMonths[0])} 수입 ${man(incSum(flowMonths[0]))}원` : "", flowBody)}
    ${sec("spend", "지출", lifeSpendSel ? `${mLabel(lifeSpendSel)} ${won(spendSum(lifeSpendSel))}` : "", spendBody)}
    ${sec("sub", "구독", subs.length ? `월 ${won(subTotal())}` : "", subBody)}
    ${sec("bill", "공과금", billMonths[0] ? `${mLabel(billMonths[0])} ${won(billSum(billMonths[0]))}` : "", billBody)}
    ${sec("season", "계절", lastSeason ? `${lastSeason.label} ${md(lastSeason.on_date)}` : "", seasonBody)}`;

  card.querySelectorAll(".life-sec").forEach(d => d.addEventListener("toggle", () => { lifeSecOpen[d.dataset.sec] = d.open; }));
  card.querySelectorAll("[data-month]").forEach(el => el.addEventListener("click", () => {
    lifeSpendSel = el.dataset.month; lifeSpendCat = null; rerenderLife(); }));
  card.querySelectorAll("[data-flow]").forEach(el => el.addEventListener("click", ev => {
    if (ev.target.closest(".fd")) return;
    lifeFlowSel = lifeFlowSel === el.dataset.flow ? null : el.dataset.flow; rerenderLife(); }));
  card.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    lifeSpendSel = b.dataset.go; lifeSpendCat = null; lifeSecOpen.spend = true; rerenderLife();
    const sp = document.querySelector('.life-sec[data-sec="spend"]'); if (sp) sp.scrollIntoView({ behavior: "smooth", block: "start" }); }));
  const flMore = card.querySelector("#flMore");
  if (flMore) flMore.addEventListener("click", () => { lifeFlowAll = !lifeFlowAll; rerenderLife(); });
  card.querySelectorAll("[data-ren]").forEach(td => td.addEventListener("click", async () => {
    const sub = subs.find(x => x.id === td.dataset.ren); if (!sub) return;
    const name = (prompt("구독 이름 고치기", sub.label) || "").trim();
    if (!name || name === sub.label) return;
    const { error } = await sb.from("life_log").update({ label: name }).eq("id", sub.id);
    if (error) { toast("이름 고치기 실패: " + error.message); return; }
    await loadLifeLog(); rerenderLife(); toast("이름을 고쳤어요"); }));
  card.querySelectorAll(".sp-rank.has-items").forEach(el => el.addEventListener("click", () => {
    lifeSpendCat = lifeSpendCat === el.dataset.cat ? null : el.dataset.cat; rerenderLife(); }));
  card.querySelectorAll(".sp-chips [data-k]").forEach(b => b.addEventListener("click", () => { lifeTrend = b.dataset.k; rerenderLife(); }));
  card.querySelector("#subAdd").addEventListener("click", () =>
    addSub(card.querySelector("#subName").value.trim(), parseInt(card.querySelector("#subAmt").value, 10) || 0,
           card.querySelector("#subCycle").value, parseInt(card.querySelector("#subDay").value, 10) || null,
           card.querySelector("#subBiz").value === "1"));
  card.querySelector("#billAdd").addEventListener("click", () =>
    addBill(card.querySelector("#billMonth").value, card.querySelector("#billKind").value,
            parseInt(card.querySelector("#billAmt").value, 10) || 0));
  card.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", (e) => { e.stopPropagation(); deleteBill(b.dataset.del); }));
  return card;
}

/* ---------- 달력 ---------- */
async function loadCalendarData() {
  if (!calSel) calSel = todayStr();
  const { data, error } = await sb.from("diary").select("on_date,content,weather_note,weather,photos,exercised,exercise_note,city_notes,steps,haircut,meals");
  if (error) { toast("달력 로드 실패: " + error.message); calMap = {}; return; }
  calMap = {};
  (data || []).forEach(e => { calMap[e.on_date] = e; });
  await loadLifeLog();
}

function renderCalendarView() {
  if (gcalIsConnected()) {
    // 앞뒤 달까지 불러와야 달 경계에 걸친 여행 일정이 빈칸 없이 이어진다
    ensureGCalMonth(calY, calM);
    ensureGCalMonth(calM === 0 ? calY - 1 : calY, calM === 0 ? 11 : calM - 1);
    ensureGCalMonth(calM === 11 ? calY + 1 : calY, calM === 11 ? 0 : calM + 1);
  }
  const list = $("list");
  list.innerHTML = "";
  const card = document.createElement("div");
  card.className = "cal-card";

  const first = new Date(calY, calM, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calY, calM + 1, 0).getDate();
  const daysInPrevMonth = new Date(calY, calM, 0).getDate();
  const monthLabel = `${calY}년 ${calM + 1}월`;

  // 앞뒤 달에서 넘어온 칸에도 실제 날짜를 넣는다 — 그래야 달 경계를 넘는 일정 막대가 이어진다
  const cellInfo = [];
  for (let i = 0; i < startDow; i++) {
    const dt = new Date(calY, calM, 1 - startDow + i);
    cellInfo.push({ d: dt.getDate(), other: true, dateStr: dateStr(dt) });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cellInfo.push({ d, other: false, dateStr: `${calY}-${String(calM + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}` });
  }
  let trail = 1;
  while (cellInfo.length % 7 !== 0) {
    const dt = new Date(calY, calM + 1, trail++);
    cellInfo.push({ d: dt.getDate(), other: true, dateStr: dateStr(dt) });
  }

  const viewYm = `${calY}-${String(calM + 1).padStart(2, "0")}`;
  const exMonth = Object.keys(calMap).filter(d => d.slice(0, 7) === viewYm && calMap[d].exercised).length;
  const exWeek = viewYm === todayStr().slice(0, 7) ? `<span class="ex-sep">·</span><span>이번 주 <b>${exerciseCounts().week}</b>일</span>` : "";
  card.innerHTML = `
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <div class="cal-title hand">${monthLabel}</div>
      <button id="calNext">›</button>
    </div>
    <div class="cal-stats-row">
      <div class="ex-stats cal-ex"><span class="ex-icon">🏃</span><span>${calM + 1}월 운동 <b>${exMonth}</b>일</span>${exWeek}</div>
      ${(() => { const h = lastHaircutDate(); if (!h) return ""; const n = daysSince(h);
                 return `<div class="ex-stats cal-ex hair-stats"><span class="ex-icon">✂️</span><span>${n === 0 ? "오늘 이발" : `이발한 지 <b>${n}</b>일`}</span></div>`; })()}
    </div>
    <div class="cal-weekdays">${DAY_NAMES.map(d => `<div>${d}</div>`).join("")}</div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-detail" id="calDetail"></div>`;
  list.appendChild(card);

  const grid = card.querySelector("#calGrid");
  const today = todayStr();
  // 주 단위로 그린다: 1줄 = [요일 칸 7개] + 그 아래로 일정 막대 줄들
  for (let w = 0; w < cellInfo.length; w += 7) {
    const weekCells = cellInfo.slice(w, w + 7);
    const weekEl = document.createElement("div");
    weekEl.className = "cal-week";
    grid.appendChild(weekEl);

    weekCells.forEach((c, i) => {
      const cell = document.createElement("div");
      cell.className = "cal-day" + (c.other ? " other" : "") + (c.dateStr === today ? " today" : "") + (c.dateStr === calSel ? " selected" : "");
      cell.style.gridColumn = String(i + 1);
      const entry = calMap[c.dateStr];
      const hasText = entry && (entry.content || entry.exercised || (entry.city_notes && entry.city_notes.length));
      const thumb = entry && entry.photos && entry.photos[0];
      const marks = (entry && entry.exercised ? '<span class="day-mark ex" title="운동한 날">🏃</span>' : "")
                  + (entry && entry.haircut ? '<span class="day-mark hair" title="이발한 날">✂️</span>' : "")
                  + seasonOn(c.dateStr).map(r => { const s = SEASON_KINDS.find(x => x.k === r.label);
                      return `<span class="day-mark" title="${r.label}">${s ? s.ico : "•"}</span>`; }).join("");
      cell.innerHTML = `${thumb ? `<img class="cal-thumb" src="${thumb.url}" alt="">` : ""}<span class="daynum">${c.d}</span>${hasText && !thumb ? '<span class="dot"></span>' : ""}${marks ? `<span class="day-marks">${marks}</span>` : ""}`;
      cell.addEventListener("click", () => {
        calSel = c.dateStr;
        if (c.other) { const dt = new Date(c.dateStr + "T00:00:00"); calY = dt.getFullYear(); calM = dt.getMonth(); }
        renderCalendarView();
      });
      weekEl.appendChild(cell);
    });

    const { segs } = calWeekBars(weekCells.map(c => c.dateStr));
    segs.forEach(s => {
      const bar = document.createElement("a");
      const timed = !s.multi && !s.ev.allDay && s.ev.time;
      bar.className = "cal-bar" + (timed ? " timed" : "") + (s.contL ? " cont-l" : "") + (s.contR ? " cont-r" : "");
      bar.style.gridColumn = `${s.startIdx + 1} / span ${s.span}`;
      bar.style.gridRow = String(s.lane + 2);
      bar.textContent = s.ev.title;
      bar.title = s.ev.title;
      if (s.ev.htmlLink) {
        bar.href = s.ev.htmlLink;
        bar.target = "_blank";
        bar.rel = "noopener noreferrer";
      }
      bar.addEventListener("click", (e) => e.stopPropagation());
      weekEl.appendChild(bar);
    });
  }

  card.querySelector("#calPrev").addEventListener("click", () => {
    calM--; if (calM < 0) { calM = 11; calY--; }
    renderCalendarView();
  });
  card.querySelector("#calNext").addEventListener("click", () => {
    calM++; if (calM > 11) { calM = 0; calY++; }
    renderCalendarView();
  });

  const detail = card.querySelector("#calDetail");
  const entry = calMap[calSel];
  const [, dm, dd] = calSel.split("-").map(Number);
  const dateLabel = `${dm}월 ${dd}일 (${DAY_NAMES[new Date(calSel + "T00:00:00").getDay()]})`;
  const selEvents = gcalEventsOn(calSel);
  if (!entry || (!entry.content && !entry.weather_note && !entry.exercised && !entry.haircut && !(entry.city_notes && entry.city_notes.length) && !(entry.photos && entry.photos.length))) {
    detail.innerHTML = `<div class="cd-date hand">${dateLabel}</div><div class="cd-empty">이 날짜엔 기록이 없어요.</div>`;
  } else {
    const w = entry.weather;
    detail.innerHTML = `
      <div class="cd-date hand">${dateLabel}</div>
      ${w ? `<div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${wmoEmoji(w.code)} 최고 ${w.tmax}° · 최저 ${w.tmin}°</div>` : ""}
      <div class="cd-body"></div>
      ${entry.weather_note ? `<div class="cd-feel">☁ ${entry.weather_note}</div>` : ""}
      ${entry.meals ? `<div class="cd-feel cd-meals" style="color:var(--ink)"></div>` : ""}
      ${entry.exercised ? `<div class="cd-feel" style="color:var(--sage)">🏃 ${entry.exercise_note || "운동함"}</div>` : ""}
      ${entry.steps ? `<div class="cd-feel" style="color:var(--sage)">👟 ${Number(entry.steps).toLocaleString()}걸음</div>` : ""}
      ${entry.haircut ? `<div class="cd-feel" style="color:var(--ink)">✂️ 이발한 날</div>` : ""}
      ${cityChipsHtml(entry.city_notes)}
      ${entry.photos && entry.photos.length ? `<div class="cd-photos">${entry.photos.map(p => `<img src="${p.url}" alt="">`).join("")}</div>` : ""}`;
    detail.querySelector(".cd-body").textContent = entry.content || "";
    const cdMeals = detail.querySelector(".cd-meals"); if (cdMeals) cdMeals.textContent = "🍚 " + entry.meals;
  }
  if (selEvents.length) {
    const evWrap = document.createElement("div");
    evWrap.className = "gcal-events";
    evWrap.style.marginTop = "10px";
    selEvents.forEach(e => {
      const item = document.createElement("a");
      item.className = "gcal-event";
      item.href = e.htmlLink || "#";
      item.target = "_blank";
      item.rel = "noopener noreferrer";
      const titleEl = document.createElement("span");
      titleEl.className = "gcal-title";
      titleEl.textContent = e.title;
      item.appendChild(titleEl);
      evWrap.appendChild(item);
    });
    detail.appendChild(evWrap);
  }
  if (calSel <= today) {
    const hairBtn = document.createElement("button");
    const done = !!(entry && entry.haircut);
    hairBtn.className = "hair-toggle" + (done ? " on" : "");
    hairBtn.textContent = done ? "✂️ 이발 기록 지우기" : "✂️ 이 날 이발했어요";
    hairBtn.addEventListener("click", () => toggleHaircut(calSel));
    detail.appendChild(hairBtn);
    if (lifeLog) {
      const row = document.createElement("div");
      row.className = "season-chips";
      SEASON_KINDS.forEach(s => {
        const on = seasonOn(calSel).some(r => r.label === s.k);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "season-chip" + (on ? " on" : "");
        b.textContent = `${s.ico} ${s.k}`;
        b.addEventListener("click", () => toggleSeason(calSel, s.k));
        row.appendChild(b);
      });
      detail.appendChild(row);
    }
  }
  if (calSel === today) {
    const jump = document.createElement("button");
    jump.className = "cal-jump";
    jump.textContent = "오늘 일기 탭에서 사진/글 수정하기";
    jump.addEventListener("click", () => { document.querySelector('nav button[data-view="diary"]').click(); });
    detail.appendChild(jump);
  }
  list.appendChild(lifeCard());
}

/* ---------- 초기화 ---------- */
async function init() {
  if (SUPABASE_URL.startsWith("__")) {
    document.body.innerHTML = '<div class="auth"><h1>설정 필요</h1><p>index.html 상단의 SUPABASE_URL / SUPABASE_ANON_KEY를 채워주세요.</p></div>';
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let session = null;
  try {
    session = (await sb.auth.getSession()).data.session;
  } catch {
    // 오프라인이라 세션 확인 자체가 실패한 경우 — 저장된 세션이 있으면 로그인 유지로 간주
    session = JSON.parse(localStorage.getItem(`sb-${SUPABASE_URL.split("//")[1].split(".")[0]}-auth-token`) || "null");
  }
  if (session) { user = session.user; showApp(); } else { showAuth(); }

  sb.auth.onAuthStateChange((event, s) => {
    if (s) { user = s.user; showApp(); return; }
    // SIGNED_OUT 이벤트가 와도, 오프라인 상태에서 발생한 거면 실제 로그아웃이 아니라
    // 토큰 갱신 실패일 뿐이므로 무시한다. 다시 온라인이 되면 자동으로 갱신됨.
    if (!navigator.onLine) return;
    if (event === "SIGNED_OUT") { user = null; showAuth(); }
  });

  window.addEventListener("online", async () => {
    try {
      const { data } = await sb.auth.getSession();
      if (data.session) { user = data.session.user; showApp(); }
    } catch {}
  });
}
