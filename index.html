<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<link rel="manifest" href="manifest.json">
<title>플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --paper: #FAF6EE;
    --paper-card: #FFFDF8;
    --ink: #2B241E;
    --muted: #A99C88;
    --line: #EAE0CC;
    --coral: #FF6B4A;
    --coral-soft: #FFE4D8;
    --sage: #6FA88A;
    --sage-soft: #E3F0E8;
    --danger: #E15B4F;
    --danger-soft: #FBE4E0;
    --gcal: #4285F4;
    --gcal-soft: #E8F0FE;
    --content-max: 560px;
  }
  @media (min-width: 900px) { :root { --content-max: 920px; } }
  @media (min-width: 1300px) { :root { --content-max: 1180px; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    /* 불릿저널 도트그리드 질감 */
    background-image: radial-gradient(circle, rgba(43,36,30,0.14) 1px, transparent 1.4px);
    background-size: 22px 22px;
  }
  .hand { font-family: 'Gaegu', 'Pretendard', sans-serif; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- 레이아웃 ---------- */
  .app { max-width: var(--content-max); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    padding: 22px 20px 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 {
    margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0;
    font-family: 'Gaegu', sans-serif; color: var(--ink);
  }
  header .date {
    font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 13.5px;
    color: var(--coral); background: var(--coral-soft);
    padding: 5px 12px; border-radius: 999px; transform: rotate(-3deg);
    display: inline-block; animation: popIn 0.4s ease both;
  }
  @keyframes popIn { from { opacity: 0; transform: rotate(-3deg) scale(0.6); } to { opacity: 1; transform: rotate(-3deg) scale(1); } }
  main { flex: 1; padding: 0 16px 100px; }

  /* ---------- 빠른 추가 ---------- */
  .quick {
    display: flex; gap: 8px; margin: 10px 0 16px;
  }
  .quick input {
    flex: 1; padding: 14px 18px;
    border: 1.5px solid var(--line); border-radius: 16px;
    font-size: 15px; font-family: inherit; outline: none; background: var(--paper-card);
    box-shadow: 0 1px 0 rgba(43,36,30,0.03);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .quick input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
  .quick button {
    padding: 0 20px; border: none; border-radius: 16px;
    background: var(--coral); color: white; font-weight: 700; font-size: 15px;
    cursor: pointer; font-family: 'Gaegu', sans-serif;
    transition: transform 0.1s;
  }
  .quick button:active { transform: scale(0.92); }
  .quick-hint { color: var(--muted); font-size: 12px; margin: -10px 4px 14px; }

  /* ---------- 섹션/태스크 ---------- */
  .section-title {
    font-family: 'Gaegu', sans-serif; font-size: 15px; font-weight: 700; color: var(--muted);
    margin: 20px 4px 10px; display: flex; align-items: center; gap: 6px;
  }
  .section-title::before { content: '✦'; color: var(--coral); font-size: 11px; }
  .project-del-link {
    border: none; background: none; color: var(--muted); font-size: 12px; font-weight: 700;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  .project-del-link:hover { color: var(--coral); }

  /* ---------- 오늘 탭: 월~일 주간 보드 ---------- */
  .week-board-wrap { display: flex; flex-direction: column; gap: 10px; }
  .week-board {
    display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .week-col {
    flex: 0 0 208px; scroll-snap-align: start;
    border: 1.5px solid var(--line); border-radius: 16px; padding: 10px;
    background: var(--paper-card);
  }
  .week-col .task { padding: 11px 12px; margin-bottom: 7px; }
  .week-col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 13px; color: var(--muted);
    margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1.5px dashed var(--line);
  }
  .week-col-date { font-size: 11.5px; }
  .week-col-empty { color: var(--muted); font-size: 12.5px; padding: 6px 2px; }
  .gcal-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--gcal-soft); border: 1.5px solid var(--gcal); border-radius: 14px;
    padding: 10px 14px; margin: 4px 0 14px; font-size: 13px; color: var(--ink);
  }
  .gcal-bar button {
    border: none; background: var(--gcal); color: white; font-family: 'Gaegu', sans-serif;
    font-weight: 700; font-size: 12.5px; padding: 7px 14px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
  }
  .gcal-bar-mini {
    background: none; border: none; padding: 0 2px; margin: -2px 0 10px; font-size: 11px; color: var(--muted);
  }
  .gcal-bar-mini button {
    background: none; color: var(--muted); font-size: 11px; font-weight: 400; padding: 0;
    text-decoration: underline; font-family: inherit;
  }
  .gcal-events { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .gcal-event {
    display: flex; align-items: baseline; gap: 6px; padding: 7px 9px; border-radius: 10px;
    background: var(--gcal-soft); text-decoration: none; color: var(--ink);
  }
  .gcal-time { font-size: 10.5px; font-weight: 700; color: var(--gcal); flex-shrink: 0; }
  .gcal-title { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-col.is-today {
    background: var(--coral-soft); border-color: var(--coral); border-width: 2px;
    box-shadow: 0 4px 14px rgba(255,107,74,0.16);
  }
  .week-col.is-today .week-col-head {
    color: var(--coral); font-size: 15px; border-bottom-color: rgba(255,107,74,0.35);
  }

  .task {
    display: flex; align-items: center; gap: 12px;
    background: var(--paper-card); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 14px 15px; margin-bottom: 9px;
    cursor: pointer;
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), background 0.3s, border-color 0.3s;
    animation: rowIn 0.32s ease both;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .task.checking { transform: scale(1.02); background: var(--sage-soft); border-color: var(--sage); }
  .task.done { background: #F5F2EA; border-color: var(--line); }

  .chk {
    width: 27px; height: 27px; flex-shrink: 0; position: relative;
  }
  .chk svg { width: 100%; height: 100%; display: block; }
  .chk .ring {
    fill: none; stroke: #C9BC9F; stroke-width: 2.2;
    /* 손그림 느낌의 살짝 비뚤어진 원 */
    transition: stroke 0.25s;
  }
  .task.done .chk .ring, .task.checking .chk .ring { stroke: var(--sage); }
  .task.done .chk .fill, .task.checking .chk .fill { opacity: 1; }
  .chk .fill { fill: var(--sage); opacity: 0; transition: opacity 0.2s; }
  .chk .tick {
    fill: none; stroke: white; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 16; stroke-dashoffset: 16;
    transition: stroke-dashoffset 0.28s ease 0.05s;
  }
  .task.done .chk .tick, .task.checking .chk .tick { stroke-dashoffset: 0; }

  .task .body { flex: 1; min-width: 0; }
  .task .title { font-weight: 600; line-height: 1.45; word-break: break-all; transition: color 0.3s; }
  .task.done .title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .task .meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--coral-soft); color: var(--coral);
  }
  .badge.overdue { background: var(--danger-soft); color: var(--danger); }
  .badge.repeat { background: var(--sage-soft); color: var(--sage); }
  .badge.plain { background: #EFE9DA; color: var(--muted); }

  /* 체크할 때 튀는 색종이 */
  .confetti-dot {
    position: fixed; width: 6px; height: 6px; border-radius: 50%;
    pointer-events: none; z-index: 60;
    animation: burst 0.55s ease-out forwards;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  .empty { text-align: center; color: var(--muted); padding: 56px 12px; }
  .empty svg { width: 68px; height: 68px; margin-bottom: 12px; opacity: 0.8; }
  .empty .msg { font-family: 'Gaegu', sans-serif; font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .empty .sub { font-size: 13px; line-height: 1.7; }
  .doodle-stroke { fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- 하단 탭 ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(250,246,238,0.92); backdrop-filter: blur(14px);
    border-top: 1.5px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 10px 0 calc(8px + env(safe-area-inset-bottom));
    max-width: var(--content-max); margin: 0 auto;
  }
  nav button {
    flex: 1; background: none; border: none; font-family: 'Gaegu', sans-serif;
    font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0;
    position: relative;
  }
  nav button .ico {
    font-size: 20px; width: 34px; height: 34px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s cubic-bezier(.34,1.56,.64,1), transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  nav button.active .ico { background: var(--coral-soft); transform: scale(1.08); }
  nav button.active { color: var(--coral); }

  /* ---------- 편집 시트 ---------- */
  .sheet-back {
    position: fixed; inset: 0; background: rgba(43,36,30,0.32);
    display: none; z-index: 50; opacity: 0; transition: opacity 0.2s;
  }
  .sheet-back.show { display: block; opacity: 1; }
  .sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 51;
    max-width: var(--content-max); margin: 0 auto;
    background: var(--paper-card); border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform 0.28s cubic-bezier(.32,.9,.36,1.1);
    box-shadow: 0 -8px 30px rgba(43,36,30,0.12);
  }
  .sheet.show { transform: translateY(0); }
  .sheet h3 { margin: 0 0 16px; font-size: 19px; font-family: 'Gaegu', sans-serif; }
  .sheet label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .sheet input[type="text"], .sheet input[type="date"], .sheet select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; background: var(--paper);
  }
  .sheet input:focus, .sheet select:focus { border-color: var(--coral); }
  .day-row { display: flex; gap: 6px; }
  .day-row button {
    flex: 1; padding: 10px 0; border: 1.5px solid var(--line); border-radius: 999px;
    background: var(--paper); font-family: 'Gaegu', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; color: var(--muted); transition: transform 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
  }
  .day-row button.on { background: var(--coral); border-color: var(--coral); color: white; transform: scale(1.08); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 22px; }
  .sheet-actions button {
    padding: 14px 0; border: none; border-radius: 14px;
    font-family: 'Gaegu', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform 0.1s;
  }
  .sheet-actions button:active { transform: scale(0.96); }
  .btn-save { flex: 2; background: var(--coral); color: white; }
  .btn-del { flex: 1; background: var(--danger-soft); color: var(--danger); }

  /* ---------- 로그인 ---------- */
  .auth {
    max-width: 360px; margin: 16vh auto 0; padding: 0 24px; text-align: center;
  }
  .auth h1 { font-size: 40px; margin-bottom: 6px; font-family: 'Gaegu', sans-serif; }
  .auth p { color: var(--muted); font-size: 14px; margin: 0 0 26px; }
  .auth input {
    width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border: 1.5px solid var(--line); border-radius: 14px;
    font-size: 15px; font-family: inherit; outline: none; background: var(--paper-card);
  }
  .auth input:focus { border-color: var(--coral); }
  .auth button {
    width: 100%; padding: 14px 0; border: none; border-radius: 14px;
    background: var(--coral); color: white; font-weight: 700; font-size: 16px;
    cursor: pointer; font-family: 'Gaegu', sans-serif; margin-top: 4px;
  }
  .auth .sub { background: none; color: var(--muted); font-weight: 600; font-size: 13px; margin-top: 12px; font-family: 'Pretendard'; }
  .auth .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .remember-row {
    display: flex; align-items: center; gap: 7px; justify-content: flex-start;
    font-size: 13.5px; color: var(--muted); margin: 2px 2px 12px; cursor: pointer; user-select: none;
  }
  .remember-row input[type="checkbox"] {
    width: 17px; height: 17px; margin: 0; accent-color: var(--coral); cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(6px);
    background: var(--ink); color: white; padding: 11px 20px; border-radius: 999px;
    font-size: 13.5px; font-family: 'Gaegu', sans-serif; opacity: 0;
    transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 일기 ---------- */
  .dcard {
    background: var(--paper-card); border: 1.5px solid var(--line);
    border-radius: 18px; padding: 16px 17px; margin-bottom: 12px;
    animation: rowIn 0.32s ease both;
  }
  .dcard .dlabel {
    font-family: 'Gaegu', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .dcard .dlabel::before { content: '✦'; color: var(--coral); font-size: 10px; }
  .wx-now { display: flex; align-items: center; gap: 14px; }
  .wx-now .wx-emoji { font-size: 40px; line-height: 1; }
  .wx-now .wx-temp { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .wx-now .wx-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .wx-hilo { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .wx-hilo b { color: var(--ink); }
  .lastyear-diary {
    margin-top: 10px; padding: 11px 13px; background: var(--paper);
    border-radius: 12px; font-size: 13.5px; line-height: 1.65; color: var(--ink);
    border-left: 3px solid var(--coral);
  }
  .lastyear-diary .ly-feel { color: var(--coral); font-family: 'Gaegu', sans-serif; font-weight: 700; }
  .diary-input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--paper); padding: 13px 15px; font-size: 15px; font-family: inherit;
    outline: none; resize: vertical; min-height: 110px; line-height: 1.7;
  }
  .diary-input:focus { border-color: var(--coral); }
  .feel-input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--paper); padding: 11px 14px; font-size: 14px; font-family: inherit;
    outline: none; margin-top: 8px;
  }
  .feel-input:focus { border-color: var(--coral); }
  .diary-save {
    width: 100%; margin-top: 10px; padding: 13px 0; border: none; border-radius: 14px;
    background: var(--coral); color: white; font-family: 'Gaegu', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
  }
  .diary-save:active { transform: scale(0.97); }
  .city-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .city-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 8px 12px; font-size: 13.5px; font-weight: 600;
    cursor: grab; user-select: none; transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .city-chip:active { cursor: grabbing; }
  .city-chip.dragging { opacity: 0.4; transform: scale(0.96); }
  .city-chip.drag-over { box-shadow: 0 0 0 2.5px var(--coral); }
  .city-chip.primary { border-color: var(--coral); background: var(--coral-soft); }
  .city-chip.recorded { border-color: var(--sage); background: var(--sage-soft); box-shadow: 0 1px 4px rgba(111,168,138,0.25); }
  .city-chip .cw { color: var(--muted); font-weight: 500; }
  .city-chip .cw-hilo { font-size: 12px; color: var(--muted); font-weight: 600; }
  .city-chip .cw-hilo b { color: var(--danger); font-weight: 700; }
  .city-chip .cw-hilo i { color: #5B8BC9; font-style: normal; font-weight: 700; }
  .city-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .city-chip .rec-btn {
    border: none; background: var(--coral-soft); color: var(--coral);
    font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 12.5px;
    border-radius: 999px; padding: 3px 9px; cursor: pointer;
  }
  .city-chip .rec-btn.on { background: var(--sage); color: white; }
  .city-chip .del-btn {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 0 2px; line-height: 1;
  }
  .city-add {
    border: 1.5px dashed var(--muted); background: none; border-radius: 999px;
    padding: 8px 14px; font-size: 13.5px; color: var(--muted); cursor: pointer;
    font-family: 'Gaegu', sans-serif; font-weight: 700;
  }
  .past-entry { padding: 12px 4px; }
  .past-entry .pe-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .past-entry .pe-head .pe-date { font-family: 'Gaegu', sans-serif; font-weight: 700; color: var(--ink); font-size: 14px; }
  .past-entry .pe-body { font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-all; }
  .past-entry .pe-feel { font-size: 12.5px; color: var(--coral); margin-top: 3px; }
  .wx-loading { color: var(--muted); font-size: 13.5px; padding: 4px 0; }

  /* ---------- 지난 일기: 날짜 그리드 ---------- */
  .pe-daygrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .pe-daychip {
    width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-family: 'Gaegu', sans-serif; font-weight: 700;
    font-size: 13px; cursor: pointer;
  }
  .pe-daychip.on { background: var(--coral); border-color: var(--coral); color: white; }
  .pe-detailwrap:not(:empty) { margin-top: 10px; border-top: 1.5px dashed var(--line); }

  /* ---------- 편수 체크리스트 ---------- */
  .sub-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  /* 발행 요일 패턴이 있는 배치는 요일별 세로 열로 — 1주일(7일)이 한 줄에 다 보이게 */
  .sub-grid.byday { display: grid; grid-template-columns: repeat(var(--sub-days, 7), minmax(0, 1fr)); }
  .sub-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .sub-grid.byday .sub-chip { width: 100%; min-width: 0; padding: 3px 2px; }
  .sub-chip {
    min-width: 30px; height: 38px; padding: 3px 4px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-family: 'Gaegu', sans-serif; font-weight: 700;
    cursor: pointer; transition: transform 0.15s, background 0.15s, border-color 0.15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1;
  }

    dot.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
    dot.style.setProperty("--dy", `${Math.sin(angle) * dist - 8}px`);
    dot.style.left = `${cx - 3}px`;
    dot.style.top = `${cy - 3}px`;
    dot.style.background = colors[i % colors.length];
    document.body.appendChild(dot);
    setTimeout(() => dot.remove(), 600);
  }
}

async function fetchTodayWx(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=1`;
  const r = await fetch(url); const j = await r.json();
  return {
    temp: Math.round(j.current.temperature_2m),
    code: j.current.weather_code,
    tmax: Math.round(j.daily.temperature_2m_max[0]),
    tmin: Math.round(j.daily.temperature_2m_min[0]),
  };
}
async function fetchPastWx(lat, lon, dateStr) {
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${dateStr}&end_date=${dateStr}&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto`;
  const r = await fetch(url); const j = await r.json();
  if (!j.daily || j.daily.temperature_2m_max[0] == null) return null;
  return {
    code: j.daily.weather_code[0],
    tmax: Math.round(j.daily.temperature_2m_max[0]),
    tmin: Math.round(j.daily.temperature_2m_min[0]),
  };
}

async function geocodeCity(name) {
  /* 1) 내장 한국 도시 우선 ("서울시"→"서울"처럼 시/군 접미사도 처리) */
  const stripSuffix = (s) => s.replace(/(특별시|광역시|특별자치시|특별자치도|시|군|도)$/,"").trim();
  const candidates = [stripSuffix(name), ...name.split(/\s+/).map(stripSuffix).reverse()];
  for (const c of candidates) {
    if (KR_CITIES[c]) {
      const [lat, lon] = KR_CITIES[c];
      return { name: c, lat, lon };
    }
  }
  /* 2) API 검색 (한국어 → 영어 순서로 시도, 한글 입력이면 한국 결과 우선) */
  for (const lang of ["ko", "en"]) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=${lang}`;
    const r = await fetch(url); const j = await r.json();
    if (j.results && j.results.length) {
      const isHangul = /[가-힣]/.test(name);
      const g = (isHangul && j.results.find(x => x.country_code === "KR")) || j.results[0];
      return { name: g.name, lat: g.latitude, lon: g.longitude };
    }
  }
  return null;
}
const lastYearStr = () => {
  const d = new Date(); d.setFullYear(d.getFullYear() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

let cities = [], todayEntry = null, lastYearEntry = null;
let editDate = null;
const wxCache = {};

const yesterdayStr = () => {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

async function loadDiary() {
  if (!editDate) editDate = todayStr();
  const [c, t, ly] = await Promise.all([
    sb.from("cities").select("*").order("sort", { ascending: true }),
    sb.from("diary").select("*").eq("on_date", editDate).maybeSingle(),
    sb.from("diary").select("*").eq("on_date", lastYearStr()).maybeSingle(),
  ]);
  cities = c.data || [];
  todayEntry = t.data || null;
  lastYearEntry = ly.data || null;
}

async function saveDiary() {
  const content = $("diaryContent") ? $("diaryContent").value.trim() : "";
  const exerciseNote = $("exerciseNote") ? $("exerciseNote").value.trim() : "";
  const exercised = !!exerciseNote;
  const primary = cities[0];
  let wx = todayEntry && todayEntry.weather ? todayEntry.weather : null;
  if (editDate === todayStr() && primary && wxCache[primary.id]) {
    const w = wxCache[primary.id];
    wx = { city: primary.name, code: w.code, tmax: w.tmax, tmin: w.tmin };
  }
  const row = {
    on_date: editDate,
    content, weather: wx,
    weather_note: todayEntry ? (todayEntry.weather_note || "") : "",
    city_notes: todayEntry ? todayEntry.city_notes : null,
    exercised, exercise_note: exercised ? (exerciseNote || null) : null,
  };
  const { error } = await sb.from("diary").upsert(row, { onConflict: "user_id,on_date" });
  if (error) { toast("저장 실패: " + error.message); return; }
  toast(editDate === todayStr() ? "오늘 일기를 저장했어요" : "어제 일기를 저장했어요");
  await loadDiary(); render();
}

async function toggleCityNote(city) {
  if (editDate !== todayStr()) { toast("도시 날씨 기록은 오늘 일기에서만 할 수 있어요"); return; }
  const w = wxCache[city.id];
  if (!w) { toast("날씨를 불러오는 중이에요"); return; }
  let notes = (todayEntry && todayEntry.city_notes) || [];
  const exists = notes.find(n => n.city === city.name);
  notes = exists ? notes.filter(n => n.city !== city.name)
                 : [...notes, { city: city.name, code: w.code, tmax: w.tmax, tmin: w.tmin, temp: w.temp }];
  const row = {
    on_date: editDate,
    content: todayEntry ? todayEntry.content : "",
    weather_note: todayEntry ? todayEntry.weather_note : "",
    weather: todayEntry ? todayEntry.weather : null,
    city_notes: notes.length ? notes : null,
  };
  const { error } = await sb.from("diary").upsert(row, { onConflict: "user_id,on_date" });
  if (error) { toast("기록 실패: " + error.message); return; }
  toast(exists ? `${city.name} 기록을 뺐어요` : `${city.name} 날씨를 오늘 일기에 기록했어요`);
  await loadDiary(); renderDiary();
}

async function addCity() {
  const name = prompt("추가할 도시 이름 (예: 오사카, 파리, 제주)");
  if (!name || !name.trim()) return;
  const g = await geocodeCity(name.trim());
  if (!g) { toast("도시를 찾지 못했어요"); return; }
  const { error } = await sb.from("cities").insert({ name: g.name, lat: g.lat, lon: g.lon, sort: cities.length });
  if (error) { toast("추가 실패: " + error.message); return; }
  toast(`${g.name} 추가! 맨 처음 도시가 '내 도시'가 돼요`);
  await loadDiary(); renderDiary();
}

async function deleteCity(city) {
  if (!confirm(`${city.name}을(를) 목록에서 뺄까요?`)) return;
  await sb.from("cities").delete().eq("id", city.id);
  await loadDiary(); renderDiary();
}

      const [yy, mm] = g.month.split("-");
      g.entries.sort((a, b) => a.on_date.localeCompare(b.on_date));
      const details = document.createElement("details");
      details.className = "month-group";

      const dayGrid = document.createElement("div");

          <div class="wx-hilo">최고 <b>${w.tmax}°</b><br>최저 <b>${w.tmin}°</b></div>

    fetchPastWx(primary.lat, primary.lon, lastYearStr()).then(w => {
      const el = $("wxLast");

function renderPhotoGrid() {

    add.id = "photoAddBtn";

async function uploadPhotos(fileList) {
  if (!fileList || !fileList.length) return;
  let current = [...((todayEntry && todayEntry.photos) || [])];
  const slots = MAX_PHOTOS - current.length;
  if (slots <= 0) { toast(`사진은 최대 ${MAX_PHOTOS}장까지 첨부할 수 있어요`); return; }
  const files = Array.from(fileList).slice(0, slots);
  const addBtn = $("photoAddBtn");
  if (addBtn) { addBtn.disabled = true; addBtn.innerHTML = '<span class="spin"></span><span>업로드중</span>'; }
  for (const file of files) {
    try {
      const ext = ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
      const path = `${user.id}/${editDate}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: upErr } = await sb.storage.from("diary-photos").upload(path, file);
      if (upErr) throw upErr;
      const { data: pub } = sb.storage.from("diary-photos").getPublicUrl(path);
      current = [...current, { path, url: pub.publicUrl }];
    } catch (err) {
      toast("업로드 실패: " + err.message);
    }
  }
  const { error } = await sb.from("diary").upsert({ on_date: editDate, photos: current }, { onConflict: "user_id,on_date" });
  if (error) toast("저장 실패: " + error.message);
  await loadDiary();
  renderPhotoGrid();
}

async function removePhoto(photo) {
  const next = ((todayEntry && todayEntry.photos) || []).filter(p => p.path !== photo.path);
  await sb.storage.from("diary-photos").remove([photo.path]);
  const { error } = await sb.from("diary").upsert({ on_date: editDate, photos: next }, { onConflict: "user_id,on_date" });
  if (error) { toast("삭제 실패: " + error.message); return; }
  await loadDiary();
  renderPhotoGrid();
}

function renderCalendarView() {
  if (gcalIsConnected()) ensureGCalMonth(calY, calM);
  const list = $("list");
  list.innerHTML = "";
  const card = document.createElement("div");
  card.className = "cal-card";

  const first = new Date(calY, calM, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calY, calM + 1, 0).getDate();
  const daysInPrevMonth = new Date(calY, calM, 0).getDate();
  const monthLabel = `${calY}년 ${calM + 1}월`;

  const cellInfo = [];
  for (let i = 0; i < startDow; i++) {
    cellInfo.push({ d: daysInPrevMonth - startDow + 1 + i, other: true, dateStr: null });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cellInfo.push({ d, other: false, dateStr: `${calY}-${String(calM + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}` });
  }
  let trail = 1;
  while (cellInfo.length % 7 !== 0) { cellInfo.push({ d: trail++, other: true, dateStr: null }); }

  card.innerHTML = `
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <div class="cal-title hand">${monthLabel}</div>
      <button id="calNext">›</button>
    </div>
    <div class="cal-weekdays">${DAY_NAMES.map(d => `<div>${d}</div>`).join("")}</div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-detail" id="calDetail"></div>`;
  list.appendChild(card);

  const grid = card.querySelector("#calGrid");
  const today = todayStr();
  cellInfo.forEach(c => {
    const cell = document.createElement("div");
    cell.className = "cal-day" + (c.other ? " other" : "") + (c.dateStr === today ? " today" : "") + (c.dateStr === calSel ? " selected" : "");
    const entry = c.dateStr && calMap[c.dateStr];
    const hasText = entry && (entry.content || entry.exercised || (entry.city_notes && entry.city_notes.length));
    const thumb = entry && entry.photos && entry.photos[0];
    const hasGCal = c.dateStr && gcalEvents.some(e => e.date === c.dateStr);
    cell.innerHTML = `${thumb ? `<img class="cal-thumb" src="${thumb.url}" alt="">` : ""}<span class="daynum">${c.d}</span>${hasText && !thumb ? '<span class="dot"></span>' : ""}${hasGCal ? '<span class="gcal-dot"></span>' : ""}`;
    if (c.dateStr) cell.addEventListener("click", () => { calSel = c.dateStr; renderCalendarView(); });
    grid.appendChild(cell);
  });

  card.querySelector("#calPrev").addEventListener("click", () => {
    calM--; if (calM < 0) { calM = 11; calY--; }
    renderCalendarView();
  });
  card.querySelector("#calNext").addEventListener("click", () => {
    calM++; if (calM > 11) { calM = 0; calY++; }
    renderCalendarView();
  });

  const detail = card.querySelector("#calDetail");
  const entry = calMap[calSel];
  const [, dm, dd] = calSel.split("-").map(Number);
  const dateLabel = `${dm}월 ${dd}일 (${DAY_NAMES[new Date(calSel + "T00:00:00").getDay()]})`;
  const selEvents = gcalEvents.filter(e => e.date === calSel).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  if (!entry || (!entry.content && !entry.weather_note && !entry.exercised && !(entry.city_notes && entry.city_notes.length) && !(entry.photos && entry.photos.length))) {
    detail.innerHTML = `<div class="cd-date hand">${dateLabel}</div><div class="cd-empty">이 날짜엔 기록이 없어요.</div>`;
  } else {
    const w = entry.weather;
    detail.innerHTML = `
      <div class="cd-date hand">${dateLabel}</div>
      ${w ? `<div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${wmoEmoji(w.code)} 최고 ${w.tmax}° · 최저 ${w.tmin}°</div>` : ""}
      <div class="cd-body"></div>
      ${entry.weather_note ? `<div class="cd-feel">☁ ${entry.weather_note}</div>` : ""}
      ${entry.exercised ? `<div class="cd-feel" style="color:var(--sage)">🏃 ${entry.exercise_note || "운동함"}</div>` : ""}
      ${cityChipsHtml(entry.city_notes)}
      ${entry.photos && entry.photos.length ? `<div class="cd-photos">${entry.photos.map(p => `<img src="${p.url}" alt="">`).join("")}</div>` : ""}`;
    detail.querySelector(".cd-body").textContent = entry.content || "";
  }
  if (selEvents.length) {
    const evWrap = document.createElement("div");
    evWrap.className = "gcal-events";
    evWrap.style.marginTop = "10px";
    selEvents.forEach(e => {
      const item = document.createElement("a");
      item.className = "gcal-event";
      item.href = e.htmlLink || "#";
      item.target = "_blank";
      item.rel = "noopener noreferrer";
      const timeEl = document.createElement("span");
      timeEl.className = "gcal-time";
      timeEl.textContent = e.time || "종일";
      const titleEl = document.createElement("span");
      titleEl.className = "gcal-title";
      titleEl.textContent = e.title;
      item.appendChild(timeEl);
      item.appendChild(titleEl);
      evWrap.appendChild(item);
    });
    detail.appendChild(evWrap);
  }
  if (calSel === today) {
    const jump = document.createElement("button");
    jump.className = "cal-jump";
    jump.textContent = "오늘 일기 탭에서 사진/글 수정하기";
    jump.addEventListener("click", () => { document.querySelector('nav button[data-view="diary"]').click(); });
    detail.appendChild(jump);
  }
}

async function init() {
  if (SUPABASE_URL.startsWith("__")) {
    document.body.innerHTML = '<div class="auth"><h1>설정 필요</h1><p>index.html 상단의 SUPABASE_URL / SUPABASE_ANON_KEY를 채워주세요.</p></div>';
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let session = null;
  try {
    session = (await sb.auth.getSession()).data.session;
  } catch {
    // 오프라인이라 세션 확인 자체가 실패한 경우 — 저장된 세션이 있으면 로그인 유지로 간주
    session = JSON.parse(localStorage.getItem(`sb-${SUPABASE_URL.split("//")[1].split(".")[0]}-auth-token`) || "null");
  }
  if (session) { user = session.user; showApp(); } else { showAuth(); }

  sb.auth.onAuthStateChange((event, s) => {
    if (s) { user = s.user; showApp(); return; }
    // SIGNED_OUT 이벤트가 와도, 오프라인 상태에서 발생한 거면 실제 로그아웃이 아니라
    // 토큰 갱신 실패일 뿐이므로 무시한다. 다시 온라인이 되면 자동으로 갱신됨.
    if (!navigator.onLine) return;
    if (event === "SIGNED_OUT") { user = null; showAuth(); }
  });

  window.addEventListener("online", async () => {
    try {
      const { data } = await sb.auth.getSession();
      if (data.session) { user = data.session.user; showApp(); }
    } catch {}
  });
}

/* ---------- 구글 캘린더 연동 (읽기 전용, 리프레시 토큰 방식) ----------
   앱이 서버 없는 정적 페이지라, 액세스 토큰만 쓰는 방식은 브라우저가

   저장해두고, 필요할 때마다 그 토큰으로 새 액세스 토큰을 발급받는다 —
   브라우저 쿠키 상태와 무관하게 항상 동작한다. */
const GOOGLE_CLIENT_ID = "603542528567-cmma9t897a1uchcgov1uv0ab7qu75pje.apps.googleusercontent.com";
const GOOGLE_CLIENT_SECRET = "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";
const GCAL_REDIRECT_URI = "https://my-planner-fawn-nine.vercel.app/";
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
const GCAL_REFRESH_KEY = "gcal_refresh_token";
const GCAL_ACCESS_KEY = "gcal_access_token";
const GCAL_ACCESS_EXP_KEY = "gcal_access_expiry";

let gcalToken = null; // 현재 메모리상의 액세스 토큰
let gcalEvents = []; // [{id, date: "YYYY-MM-DD", time: "14:00" | null, title, htmlLink}]
let gcalLoadedMonths = new Set(); // "YYYY-MM" 단위로 이미 불러온 달 캐시

function gcalIsConnected() {

function connectGoogleCalendar() {
  const params = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: GCAL_REDIRECT_URI,
    response_type: "code",
    scope: GCAL_SCOPE,
    access_type: "offline",
    prompt: "consent",
  });
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

function disconnectGoogleCalendar() {
  const token = gcalToken || localStorage.getItem(GCAL_ACCESS_KEY);
  if (token) fetch(`https://oauth2.googleapis.com/revoke?token=${token}`, { method: "POST" }).catch(() => {});
  gcalToken = null;
  gcalEvents = [];
  gcalLoadedMonths = new Set();
  localStorage.removeItem(GCAL_REFRESH_KEY);
  localStorage.removeItem(GCAL_ACCESS_KEY);
  localStorage.removeItem(GCAL_ACCESS_EXP_KEY);
  render();
  toast("구글 캘린더 연동을 해제했어요");
}

async function gcalExchangeCode(code) {
  const body = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    client_secret: GOOGLE_CLIENT_SECRET,
    code,
    grant_type: "authorization_code",
    redirect_uri: GCAL_REDIRECT_URI,
  });
  try {
    const res = await fetch("https://oauth2.googleapis.com/token", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
    });
    const data = await res.json();
    if (!res.ok) { toast("구글 캘린더 연동 실패: " + (data.error_description || data.error)); return; }
    gcalToken = data.access_token;
    localStorage.setItem(GCAL_ACCESS_KEY, data.access_token);
    localStorage.setItem(GCAL_ACCESS_EXP_KEY, String(Date.now() + data.expires_in * 1000));
    if (data.refresh_token) localStorage.setItem(GCAL_REFRESH_KEY, data.refresh_token);
    toast("구글 캘린더 연동됐어요");
  } catch (e) {
    toast("구글 캘린더 연동 실패: " + e.message);
  }
}

async function gcalRefreshAccessToken() {
  const refresh = localStorage.getItem(GCAL_REFRESH_KEY);
  if (!refresh) return false;
  const body = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    client_secret: GOOGLE_CLIENT_SECRET,
    refresh_token: refresh,
    grant_type: "refresh_token",
  });
  try {
    const res = await fetch("https://oauth2.googleapis.com/token", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
    });
    const data = await res.json();
    if (!res.ok) {
      // 리프레시 토큰 자체가 무효화(수동 revoke 등)된 경우 — 완전히 재연동 필요
      localStorage.removeItem(GCAL_REFRESH_KEY);
      localStorage.removeItem(GCAL_ACCESS_KEY);
      localStorage.removeItem(GCAL_ACCESS_EXP_KEY);
      gcalToken = null;
      return false;
    }
    gcalToken = data.access_token;
    localStorage.setItem(GCAL_ACCESS_KEY, data.access_token);
    localStorage.setItem(GCAL_ACCESS_EXP_KEY, String(Date.now() + data.expires_in * 1000));
    return true;
  } catch (e) {
    return false;
  }
}

/* 액세스 토큰이 유효(1분 이상 여유)하면 그대로 쓰고, 아니면 리프레시 토큰으로 새로 발급 */
async function gcalEnsureToken() {
  const exp = Number(localStorage.getItem(GCAL_ACCESS_EXP_KEY) || 0);
  if (gcalToken && Date.now() < exp - 60000) return true;
  return await gcalRefreshAccessToken();
}

/* y=연도, m=0-based 월. 이미 불러온 달이면 캐시된 gcalEvents를 그대로 쓰고 아무것도 안 함 */
async function ensureGCalMonth(y, m) {
  const key = `${y}-${String(m + 1).padStart(2, "0")}`;
  if (gcalLoadedMonths.has(key)) return;
  const ok = await gcalEnsureToken();
  if (!ok) return;
  gcalLoadedMonths.add(key);
  const timeMin = new Date(y, m, 1).toISOString();
  const timeMax = new Date(y, m + 1, 1).toISOString();
  const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?` +
    `timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
  try {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${gcalToken}` } });
    const data = await res.json();
    if (!res.ok) { gcalLoadedMonths.delete(key); toast("구글 캘린더 불러오기 실패: " + (data.error?.message || res.status)); return; }
    const parsed = (data.items || []).map(ev => {
      const startStr = ev.start?.dateTime || ev.start?.date;
      if (!startStr) return null;
      const isAllDay = !ev.start.dateTime;
      const date = startStr.slice(0, 10);
      const time = isAllDay ? null : startStr.slice(11, 16);
      return { id: ev.id, date, time, title: ev.summary || "(제목 없음)", htmlLink: ev.htmlLink };
    }).filter(Boolean);
    const seen = new Set(gcalEvents.map(e => e.id));
    gcalEvents.push(...parsed.filter(e => !seen.has(e.id)));
    if (view === "calendar") renderCalendarView(); else render();
  } catch (e) {
    gcalLoadedMonths.delete(key);
    toast("구글 캘린더 불러오기 실패: " + e.message);
  }
}

/* 앱 시작 시 호출: 리디렉션으로 돌아온 code를 교환하거나, 저장된 리프레시 토큰으로 조용히 재연결 */
async function gcalInitOnLoad() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    history.replaceState({}, "", window.location.pathname);
    await gcalExchangeCode(code);
  } else if (!localStorage.getItem(GCAL_REFRESH_KEY)) {
    return;
  }
  const week = weekDates();
  await ensureGCalMonth(Number(week[0].slice(0, 4)), Number(week[0].slice(5, 7)) - 1);
  await ensureGCalMonth(Number(week[6].slice(0, 4)), Number(week[6].slice(5, 7)) - 1);
  render();
}

/* ---------- 실행취소 / 다시실행 ---------- */
let undoStack = [];
let redoStack = [];
function pushHistory(undoFn, redoFn) {
  undoStack.push({ undo: undoFn, redo: redoFn });
  redoStack = [];
}
async function undoLast() {
  const action = undoStack.pop();
  if (!action) { toast("되돌릴 게 없어요"); return; }
  await action.undo();
  redoStack.push(action);
  toast("실행취소했어요");
}
async function redoLast() {
  const action = redoStack.pop();
  if (!action) { toast("다시 실행할 게 없어요"); return; }
  await action.redo();
  undoStack.push(action);
  toast("다시 실행했어요");
}
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return; // 입력창에서는 브라우저 기본 실행취소 사용
  const key = e.key.toLowerCase();
  if (key === "z") { e.preventDefault(); e.shiftKey ? redoLast() : undoLast(); }
  else if (key === "y") { e.preventDefault(); redoLast(); }
});

/* state === null이면 삭제, 아니면 해당 상태로 upsert. 로컬 반영 후 DB에 동기화한다. */
async function applyTaskState(id, state, { silent } = {}) {
  if (state === null) {
    tasks = tasks.filter(t => t.id !== id);
    if (!silent) render();
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  } else {
    const idx = tasks.findIndex(t => t.id === id);
    if (idx === -1) tasks.push(state); else tasks[idx] = state;
    if (!silent) render();
    const { error } = await sb.from("tasks").upsert(state);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  }
}
async function applyRepeatLogState(taskId, exists, { on = todayStr(), silent } = {}) {
  if (exists) {
    if (!repeatLog.find(r => r.task_id === taskId && r.done_on === on)) repeatLog.push({ task_id: taskId, done_on: on });
    if (!silent) render();
    const { error } = await sb.from("repeat_log").insert({ task_id: taskId, done_on: on });
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  } else {
    repeatLog = repeatLog.filter(r => !(r.task_id === taskId && r.done_on === on));
    if (!silent) render();
    const { error } = await sb.from("repeat_log").delete().eq("task_id", taskId).eq("done_on", on);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  }
}

async function addTask(title) {
  const row = { title };
  if (taskTab === "today") row.due = todayStr();
  const tempId = "temp-" + Date.now();
  tasks.push({ ...row, id: tempId, created_at: new Date().toISOString() });
  render();
  const { data, error } = await sb.from("tasks").insert(row).select().single();
  if (error) {
    tasks = tasks.filter(t => t.id !== tempId);
    toast("추가 실패: " + error.message); render(); return;
  }
  const idx = tasks.findIndex(t => t.id === tempId);
  if (idx !== -1) tasks[idx] = data;
  render();
  pushHistory(
    () => applyTaskState(data.id, null),
    () => applyTaskState(data.id, data)
  );
}

/* 편수 체크리스트의 각 칸이 실제로 예약 발행되는 요일(0=일...6=토)과 메모, 칸 순서대로.

const RETIRED_SCHEDULE_TITLES = [

];
/* 중복 씨딩 및 은퇴된 일정 정리 — 앱 실행 시 한 번 조용히 실행 */
async function cleanupSchedule() {
  const removeIds = [];

  // 1) 은퇴된(더 이상 안 쓰는) 4트랙 사업 일정 제목은 통째로 정리한다
  tasks.forEach(t => { if (RETIRED_SCHEDULE_TITLES.includes(t.title)) removeIds.push(t.id); });

  // 2) 제목·프로젝트·반복 요일이 완전히 똑같은 반복 일정이 여러 개면 중복 씨딩/중복 입력으로 보고
  //    가장 오래된 것만 남긴다 (사용자가 서로 다른 반복 일정을 우연히 같은 제목으로 만드는 일은 거의 없음)
  const byKey = {};
  tasks.forEach(t => {
    if (removeIds.includes(t.id)) return;
    if (!(t.repeat_days && t.repeat_days.length)) return;
    const key = `${t.title}|${t.project || ""}|${t.repeat_days.slice().sort().join(",")}`;
    (byKey[key] = byKey[key] || []).push(t);
  });
  Object.values(byKey).forEach(list => {
    if (list.length > 1) {
      list.sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));
      removeIds.push(...list.slice(1).map(t => t.id));
    }
  });

  if (removeIds.length) {
    tasks = tasks.filter(t => !removeIds.includes(t.id));
    repeatLog = repeatLog.filter(r => !removeIds.includes(r.task_id));
    await sb.from("repeat_log").delete().in("task_id", removeIds);
    await sb.from("tasks").delete().in("id", removeIds);
  }

  // 이미 "4트랙 사업 일정"을 불러온 적 있는 사용자에 한해서만 새로 추가된 항목(건강친구 산이 배치일 등)을 채워준다
  const missing = scheduleSeeded() ? SCHEDULE_TASKS.filter(s => !tasks.some(t => t.title === s.title)) : [];
  if (missing.length) {
    const { data } = await sb.from("tasks").insert(missing).select();
    if (data) tasks.push(...data);
  }

  // 편수(sub_total)/시작 호수(sub_start)는 값이 아예 없을 때(=아직 한 번도 안 정해졌을 때)만 최초 한 번 채워준다.
  // 이후 SCHEDULE_TASKS 템플릿 값이 바뀌어도(다음 배치부터 반영할 새 편수 등) 진행 중인 실제 값을
  // 조용히 덮어쓰지 않는다 — 배치 전환은 사용자가 편집 시트에서 직접 한다.
  let subSynced = false;
  for (const s of SCHEDULE_TASKS) {
    const t = tasks.find(x => x.title === s.title);
    if (t && s.sub_total && t.sub_total == null) {
      t.sub_total = s.sub_total;
      await sb.from("tasks").update({ sub_total: s.sub_total }).eq("id", t.id);
      subSynced = true;
    }
    if (t && s.sub_start && t.sub_start == null) {
      t.sub_start = s.sub_start;
      await sb.from("tasks").update({ sub_start: s.sub_start }).eq("id", t.id);
      subSynced = true;
    }
    if (t && s.sub_anchor && t.sub_anchor == null) {
      t.sub_anchor = s.sub_anchor;
      await sb.from("tasks").update({ sub_anchor: s.sub_anchor }).eq("id", t.id);
      subSynced = true;
    }
  }

  // [1회성 마이그레이션 · 2026-08-29] 우주사전2 배치 전환: 20~31호(12편, 구방식) → 32~45호(14편, 신방식).
  // 32~38호 제작이 끝나 다음 업로드가 32호부터 시작되므로, 옛 배치 값(sub_start=20)으로 남아있는
  // 실제 일정 행을 로그인된 본인 권한으로 딱 한 번 갱신한다. 이미 전환됐으면(=20이 아니면) 아무것도 안 함.
  {
    const t = tasks.find(x => x.title === "우주사전 월요일 배치 제작 (쇼츠+롱폼, 예약 발행)");
    if (t && t.sub_start === 20) {
      t.sub_start = 32; t.sub_total = 14;
      await sb.from("tasks").update({ sub_start: 32, sub_total: 14 }).eq("id", t.id);
      subSynced = true;
    }
  }

  if (removeIds.length || missing.length || subSynced) render();
}
function scheduleSeeded() {

async function seedSchedule() {
  const existingTitles = new Set(tasks.map(t => t.title));
  const rows = SCHEDULE_TASKS.filter(s => !existingTitles.has(s.title));
  if (!rows.length) { toast("이미 다 불러왔어요"); return; }
  const { data, error } = await sb.from("tasks").insert(rows).select();
  if (error) { toast("불러오기 실패: " + error.message); return; }
  const inserted = data || rows;
  tasks.push(...inserted);
  render();
  toast(`사업 일정 ${rows.length}개를 불러왔어요`);
  pushHistory(
    async () => { for (const r of inserted) await applyTaskState(r.id, null, { silent: true }); render(); },
    async () => { for (const r of inserted) await applyTaskState(r.id, r, { silent: true }); render(); }
  );
}

async function toggleTask(task, rowEl, chkEl, onDate = todayStr()) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  const wasDone = isRepeat ? !!repeatLog.find(r => r.task_id === task.id && r.done_on === onDate) : !!task.done_at;
  const turningOn = !wasDone;

  // 낙관적 UI: 서버 응답 기다리지 않고 바로 애니메이션 재생
  if (rowEl && chkEl) {
    rowEl.classList.add(turningOn ? "checking" : "done");
    if (!turningOn) rowEl.classList.remove("done", "checking");
    if (turningOn) spawnConfetti(chkEl);
  }
  await sleep(turningOn ? 320 : 0);

  if (isRepeat) {
    await applyRepeatLogState(task.id, turningOn, { on: onDate });
    pushHistory(
      () => applyRepeatLogState(task.id, wasDone, { on: onDate }),
      () => applyRepeatLogState(task.id, turningOn, { on: onDate })
    );
  } else {
    const before = { ...task };
    const after = { ...task, done_at: turningOn ? new Date().toISOString() : null };
    await applyTaskState(task.id, after);
    pushHistory(
      () => applyTaskState(task.id, before),
      () => applyTaskState(task.id, after)
    );
  }
}

/* ---------- 편수 체크리스트 (한 번에 여러 개 올리는 배치 콘텐츠용) ---------- */
/* 이 주(onDate = 그 주의 발생일)의 배치 시작 호수를 계산한다.
   sub_anchor = "sub_start가 그대로 적용되는 기준 발생일". 기준에서 몇 주 지났는지(k)에 따라
   시작 호수가 sub_total씩 자동으로 늘어나서, 매주 수동으로 갱신할 필요가 없다.
   기준보다 과거 주(k<0)는 편수 체계가 달랐을 수 있으므로 계산하지 않고,
   그 주에 실제로 체크된 번호(repeat_log.sub_done)를 그대로 기록으로 보여준다. */
function subRangeFor(task, onDate) {
  const start = task.sub_start || 1;
  if (!task.sub_anchor) return { mode: "formula", start };
  const k = Math.round((new Date(onDate + "T00:00:00") - new Date(task.sub_anchor + "T00:00:00")) / 604800000);
  if (k >= 0) return { mode: "formula", start: start + k * task.sub_total };
  const stored = getSubDone(task, onDate);
  if (stored.length) return { mode: "stored", nums: [...stored].sort((a, b) => a - b) };
  return { mode: "none" };
}

function getSubDone(task, onDate) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  if (isRepeat) {
    const row = repeatLog.find(r => r.task_id === task.id && r.done_on === onDate);
    return (row && row.sub_done) || [];
  }
  return task.sub_done || [];
}

async function toggleSubItem(task, n, onDate) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  const current = getSubDone(task, onDate);
  const has = current.includes(n);
  const next = has ? current.filter(x => x !== n) : [...current, n].sort((a, b) => a - b);
  const turningComplete = next.length >= task.sub_total && current.length < task.sub_total;
  if (turningComplete) toast(`${task.title} 다 올렸어요 🎉`);

  if (isRepeat) {
    repeatLog = repeatLog.filter(r => !(r.task_id === task.id && r.done_on === onDate));
    if (next.length) repeatLog.push({ task_id: task.id, done_on: onDate, sub_done: next });
    render();
    const { error: delErr } = await sb.from("repeat_log").delete().eq("task_id", task.id).eq("done_on", onDate);
    if (!delErr && next.length) {
      const { error } = await sb.from("repeat_log").insert({ task_id: task.id, done_on: onDate, sub_done: next });
      if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
    } else if (delErr) { toast("동기화 실패: " + delErr.message); await loadAll(); render(); }
  } else {
    const idx = tasks.findIndex(t => t.id === task.id);
    if (idx !== -1) tasks[idx] = { ...tasks[idx], sub_done: next };
    render();
    const { error } = await sb.from("tasks").update({ sub_done: next }).eq("id", task.id);
    if (error) { toast("동기화 실패: " + error.message); await loadAll(); render(); }
  }
}

function subChecklist(task, onDate) {
  const done = getSubDone(task, onDate);
  const range = subRangeFor(task, onDate);
  const dayPattern = SUB_DAY_PATTERNS[task.title];
  const grid = document.createElement("div");
  grid.className = "sub-grid";

  const makeChip = (n, slot) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "sub-chip" + (done.includes(n) ? " on" : "");
    chip.innerHTML = slot
      ? `<span class="sub-day">${DAY_NAMES[slot.dow]}</span><span class="sub-num">${n}</span>`
      : `<span class="sub-num">${n}</span>`;
    chip.title = slot ? `${n}호 · ${DAY_NAMES[slot.dow]}요일 예약${slot.note ? " (" + slot.note + ")" : ""}` : `${n}호`;
    chip.addEventListener("click", (e) => { e.stopPropagation(); toggleSubItem(task, n, onDate); });
    return chip;
  };

  // 지난 주(기준 이전) — 그때 실제 체크했던 번호들을 읽기 전용 기록으로 표시
  if (range.mode === "stored") {
    range.nums.forEach(n => {
      const chip = document.createElement("span");
      chip.className = "sub-chip on readonly";
      chip.innerHTML = `<span class="sub-num">${n}</span>`;
      chip.title = `${n}호 · 업로드 완료 기록`;
      grid.appendChild(chip);
    });
    return grid;
  }
  if (range.mode === "none") {
    const note = document.createElement("div");
    note.className = "sub-empty-note";
    note.textContent = "이 주엔 기록이 없어요";
    return note;
  }
  const start = range.start;

  // 발행 요일 패턴이 있으면 요일별 세로 열로 배치 — 한 줄에 1주일이 다 보임
  // (열 순서는 패턴에 처음 등장한 요일 순서. 다음주로 넘어가는 편은 같은 요일 열 아래에 쌓임)
  if (dayPattern && dayPattern.length === task.sub_total) {
    grid.classList.add("byday");
    const colOrder = [], cols = {};
    dayPattern.forEach((slot, i) => {
      if (!(slot.dow in cols)) { cols[slot.dow] = []; colOrder.push(slot.dow); }
      cols[slot.dow].push(makeChip(start + i, slot));
    });
    grid.style.setProperty("--sub-days", colOrder.length);
    colOrder.forEach(dow => {
      const col = document.createElement("div");
      col.className = "sub-col";
      cols[dow].forEach(c => col.appendChild(c));
      grid.appendChild(col);
    });
    return grid;
  }

  for (let i = 0; i < task.sub_total; i++) {
    grid.appendChild(makeChip(start + i, dayPattern ? dayPattern[i] : undefined));
  }
  return grid;
}

/* ---------- 렌더 ---------- */
function taskRow(task, doneOverride, onDate = todayStr()) {
  const isRepeat = task.repeat_days && task.repeat_days.length;
  const hasSub = task.sub_total > 0;
  const subDone = hasSub ? getSubDone(task, onDate) : [];
  const subRange = hasSub ? subRangeFor(task, onDate) : null;
  const done = hasSub
    ? (subRange.mode === "stored" ? true : subDone.length >= task.sub_total)
    : (doneOverride !== undefined ? doneOverride : !!task.done_at);
  const div = document.createElement("div");
  div.className = "task" + (done ? " done" : "");
  const badges = [];
  if (task.project) badges.push(`<span class="badge">${task.project}</span>`);
  if (isRepeat) badges.push(`<span class="badge repeat">매주 ${task.repeat_days.map(d=>DAY_NAMES[d]).join("·")}</span>`);
  if (task.due && !isRepeat) {
    const overdue = task.due < todayStr() && !done;
    badges.push(`<span class="badge ${overdue ? "overdue" : "plain"}">${overdue ? "지남 " : ""}${task.due.slice(5).replace("-","/")}</span>`);
  }
  if (hasSub) {
    if (subRange.mode === "stored") {
      const nums = subRange.nums;
      badges.push(`<span class="badge plain">${nums.length}편 완료 · ${nums[0]}~${nums[nums.length - 1]}호</span>`);
    } else if (subRange.mode === "none") {
      badges.push(`<span class="badge plain">기록 없음</span>`);
    } else {
      const s = subRange.start;
      badges.push(`<span class="badge plain">${subDone.length}/${task.sub_total}편 · ${s}~${s + task.sub_total - 1}호</span>`);
    }
  }
  div.innerHTML = `
    <div class="chk">
      <svg viewBox="0 0 27 27">
        <circle class="fill" cx="13.5" cy="13.5" r="12" />
        <circle class="ring" cx="13.5" cy="13.7" r="11.4" />
        <path class="tick" d="M7.5 13.5l4 4 8-8.5" />
      </svg>
    </div>
    <div class="body">
      <div class="title"></div>
      ${badges.length ? `<div class="meta">${badges.join("")}</div>` : ""}
    </div>`;
  div.querySelector(".title").textContent = task.title;
  if (hasSub) {
    div.querySelector(".body").appendChild(subChecklist(task, onDate));
    div.querySelector(".chk").style.visibility = "hidden"; // 완료 여부는 편수 체크로만 결정
  } else {
    const chkEl = div.querySelector(".chk");
    chkEl.addEventListener("click", (e) => { e.stopPropagation(); toggleTask(task, div, chkEl, onDate); });
  }
  div.addEventListener("click", () => openSheet(task));
  div.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    openTaskCtxMenu(e.clientX, e.clientY, task);
  });
  return div;
}

function section(title) {
  const el = document.createElement("div");
  el.className = "section-title";
  el.textContent = title;
  return el;
}

async function deleteProject(name) {
  if (!confirm(`"${name}" 프로젝트를 삭제할까요? 안에 있는 일들은 미분류로 이동해요.`)) return;
  tasks.forEach(t => { if (t.project === name) t.project = null; });
  render();
  const { error } = await sb.from("tasks").update({ project: null }).eq("project", name);
  if (error) { toast("삭제 실패: " + error.message); await loadAll(); render(); }
  else toast(`"${name}" 프로젝트를 지웠어요`);
}

function render() {
  const list = $("list");
  list.innerHTML = "";
  const today = todayStr();

  if (view === "diary") {
    $("viewTitle").textContent = "일기";
    document.querySelector(".quick").style.display = "none";
    $("quickHint").style.display = "none";
    loadDiary().then(renderDiary);
    return;
  }
  if (view === "calendar") {
    $("viewTitle").textContent = "달력";
    document.querySelector(".quick").style.display = "none";
    $("quickHint").style.display = "none";
    loadCalendarData().then(renderCalendarView);
    return;
  }

  /* view === "today" — 할 일 탭 (서브탭: 오늘/메모함) */
  const taskTitles = { today: "오늘", inbox: "메모함" };
  $("viewTitle").textContent = taskTitles[taskTab];
  $("quickInput").placeholder = taskTab === "today" ? "오늘 할 일 추가" : "생각나는 건 뭐든 적어두기";
  $("quickHint").textContent = taskTab === "inbox" ? "여기 쌓아두고, 나중에 눌러서 프로젝트·마감일을 정하면 돼요" : "";
  document.querySelector(".quick").style.display = "flex";
  $("quickHint").style.display = taskTab === "inbox" ? "block" : "none";

  const subNav = document.createElement("div");
  subNav.className = "task-subnav";
  subNav.innerHTML = `
    <button type="button" data-t="today" class="${taskTab === "today" ? "on" : ""}">오늘</button>
    <button type="button" data-t="inbox" class="${taskTab === "inbox" ? "on" : ""}">메모함</button>`;
  subNav.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { taskTab = b.dataset.t; render(); });
  });
  list.appendChild(subNav);

  if (taskTab === "today") {
    const connected = gcalIsConnected();
    const gcalBar = document.createElement("div");
    gcalBar.className = "gcal-bar" + (connected ? " gcal-bar-mini" : "");
    gcalBar.innerHTML = connected
      ? `<span>📅 구글 캘린더 연동됨</span><button type="button" id="gcalToggle">해제</button>`
      : `<span>구글 캘린더에 있는 일정도 같이 볼까요?</span><button type="button" id="gcalToggle">연동하기</button>`;
    gcalBar.querySelector("#gcalToggle").addEventListener("click", () => {
      connected ? disconnectGoogleCalendar() : connectGoogleCalendar();
    });
    list.appendChild(gcalBar);
  }

  const taskList = document.createElement("div");
  list.appendChild(taskList);

  if (taskTab === "today") {
    if (!scheduleSeeded()) {
      const banner = document.createElement("div");
      banner.className = "task";
      banner.style.borderStyle = "dashed";
      banner.innerHTML = `
        <div class="body">
          <div class="title" style="color:var(--coral)">＋ 4트랙 사업 일정 불러오기</div>
          <div class="meta"><span class="badge plain">탭해서 반복 일정 한번에 추가</span></div>
        </div>`;
      banner.addEventListener("click", async () => {
        banner.querySelector(".title").textContent = "불러오는 중...";
        await seedSchedule();
      });
      taskList.appendChild(banner);
    }

    const week2 = twoWeekDates(); // 이번 주 월~일(0~6) 다음 다음 주 월~일(7~13), 순서 그대로 날짜순
    const wrap = document.createElement("div");
    wrap.className = "week-board-wrap";
    const rows = [document.createElement("div"), document.createElement("div")];
    rows.forEach(r => { r.className = "week-board"; wrap.appendChild(r); });
    let any = false;
    week2.forEach((d, idx) => {
      const board = rows[idx < 7 ? 0 : 1];
      const dow = new Date(d + "T00:00:00").getDay(); // 요일(0=일...6=토) — repeat_days 매칭용
      const i = dow;
      const dTasks = tasks.filter(t => {
        const isRepeat = t.repeat_days && t.repeat_days.length;
        if (isRepeat) return t.repeat_days.includes(i);
        if (!t.due) return false;
        // 마감 지난(오늘 포함) 미완료 할 일은 원래 요일이 아니라 '오늘' 칸에 모아 보여준다
        if (!t.done_at && t.due <= today) return d === today;
        return t.due === d;
      });
      const isToday = d === today;
      const col = document.createElement("div");
      col.className = "week-col" + (isToday ? " is-today" : "");
      if (isToday) col.id = "weekColToday";
      const head = document.createElement("div");
      head.className = "week-col-head";
      head.innerHTML = `<span>${DAY_NAMES[i]}요일</span><span class="week-col-date">${Number(d.slice(5,7))}/${Number(d.slice(8,10))}</span>`;
      col.appendChild(head);
      const dEvents = gcalEvents.filter(e => e.date === d).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
      if (dEvents.length) {
        any = true;
        const evWrap = document.createElement("div");
        evWrap.className = "gcal-events";
        dEvents.forEach(e => {
          const item = document.createElement("a");
          item.className = "gcal-event";
          item.href = e.htmlLink || "#";
          item.target = "_blank";
          item.rel = "noopener noreferrer";
          const timeEl = document.createElement("span");
          timeEl.className = "gcal-time";
          timeEl.textContent = e.time || "종일";
          const titleEl = document.createElement("span");
          titleEl.className = "gcal-title";
          titleEl.textContent = e.title;
          item.appendChild(timeEl);
          item.appendChild(titleEl);
          evWrap.appendChild(item);
        });
        col.appendChild(evWrap);
      }
      if (dTasks.length) {
        any = true;
        dTasks.forEach(t => {
          const isRepeat = t.repeat_days && t.repeat_days.length;
          col.appendChild(taskRow(t, isRepeat ? !!repeatLog.find(r => r.task_id === t.id && r.done_on === d) : undefined, d));
        });
      } else if (!dEvents.length) {
        col.insertAdjacentHTML("beforeend", `<div class="week-col-empty">${isToday ? "오늘은 여유롭네요" : "-"}</div>`);
      }
      board.appendChild(col);
    });
    taskList.appendChild(wrap);
    if (!any)
      taskList.insertAdjacentHTML("beforeend", emptyDoodle("2주간 예정된 일이 없어요", "위에서 바로 추가하거나, 메모함을 정리해보세요"));
    setTimeout(() => {
      const col = $("weekColToday");
      if (col) col.scrollIntoView({ inline: "center", block: "nearest" });
    }, 0);

    const done = tasks.filter(t => t.done_at).sort((a,b) => b.done_at.localeCompare(a.done_at)).slice(0, 50);
    if (done.length) {
      const details = document.createElement("details");
      details.className = "month-group";
      details.style.marginTop = "18px";
      const summary = document.createElement("summary");
      summary.className = "month-head";
      summary.textContent = `완료 (${done.length})`;
      details.appendChild(summary);
      let lastDate = "";
      done.forEach(t => {
        const d = t.done_at.slice(0,10);
        if (d !== lastDate) { details.appendChild(section(d.slice(5).replace("-","/"))); lastDate = d; }
        details.appendChild(taskRow(t));
      });
      taskList.appendChild(details);
    }
  }

  if (taskTab === "inbox") {
    const inbox = tasks.filter(t => !t.done_at && !t.due && !(t.repeat_days && t.repeat_days.length));
    if (!inbox.length) taskList.innerHTML = emptyDoodle("메모함이 비어있어요", "머릿속에 떠도는 건 뭐든 던져놓으세요");
    inbox.forEach(t => taskList.appendChild(taskRow(t)));
  }
}

let editDays = [];
function openSheet(task) {
  editing = task;

  $("editProject").value = task.project || "";
  $("editDue").value = task.due || "";
  $("editSubTotal").value = task.sub_total || "";
  $("editSubStart").value = task.sub_start || "";
  const projectNames = [...new Set(tasks.map(t => t.project).filter(Boolean))].sort();
  $("projectList").innerHTML = projectNames.map(p => `<option value="${p}">`).join("");

$("btnSave").addEventListener("click", async () => {
  if (!editing) return;
  const id = editing.id;
  const before = tasks.find(t => t.id === id);
  if (!before) return;
  const beforeSnap = { ...before };
  const subTotalVal = $("editSubTotal").value.trim();
  const subStartVal = $("editSubStart").value.trim();
  const upd = {
    title: $("editTitle").value.trim() || editing.title,
    project: $("editProject").value.trim() || null,
    due: $("editDue").value || null,
    repeat_days: editDays.length ? editDays : null,
    sub_total: subTotalVal ? Math.max(1, parseInt(subTotalVal, 10)) : null,
    sub_start: subStartVal ? Math.max(1, parseInt(subStartVal, 10)) : null,
  };
  // 시작 호수를 직접 바꾸면 "이번 주 배치가 이 번호부터"라는 뜻이므로,
  // 기준일(sub_anchor)을 이번 주의 해당 반복 요일로 다시 잡는다 (이후 주는 자동 증가)
  if (upd.sub_start && upd.sub_start !== beforeSnap.sub_start && upd.repeat_days) {
    const thisWeek = twoWeekDates().slice(0, 7);
    upd.sub_anchor = thisWeek.find(d => upd.repeat_days.includes(new Date(d + "T00:00:00").getDay())) || thisWeek[0];
  }
  const afterSnap = { ...beforeSnap, ...upd };
  closeSheet();
  await applyTaskState(id, afterSnap);
  toast("저장했어요");
  pushHistory(
    () => applyTaskState(id, beforeSnap),
    () => applyTaskState(id, afterSnap)
  );
});

  if (!editing) return;
  const task = editing;
  closeSheet();
  await deleteTask(task);
});
$("btnDeleteProject").addEventListener("click", async () => {
  if (!editing || !editing.project) return;
  const name = editing.project;
  closeSheet();
  await deleteProject(name);
});

async function deleteTask(task) {
  const id = task.id;
  const snapshot = { ...task };
  const hadLogToday = !!repeatLog.find(r => r.task_id === id && r.done_on === todayStr());
  await applyRepeatLogState(id, false, { silent: true });
  await applyTaskState(id, null);
  toast("삭제했어요");
  pushHistory(
    async () => { await applyTaskState(id, snapshot); if (hadLogToday) await applyRepeatLogState(id, true); },
    async () => { await applyRepeatLogState(id, false, { silent: true }); await applyTaskState(id, null); }
  );
}

/* ---------- 사진 확대 보기 ---------- */
const photoLightbox = document.createElement("div");
photoLightbox.className = "photo-lightbox";
photoLightbox.innerHTML = `
  <button class="plb-close" title="닫기">×</button>
  <button class="plb-nav plb-prev" title="이전">‹</button>
  <img alt="">
  <button class="plb-nav plb-next" title="다음">›</button>
  <div class="plb-count"></div>`;
document.body.appendChild(photoLightbox);
let plbUrls = [], plbIndex = 0;
function renderPhotoViewer() {
  photoLightbox.querySelector("img").src = plbUrls[plbIndex];
  const count = photoLightbox.querySelector(".plb-count");
  const nav = plbUrls.length > 1;
  photoLightbox.querySelector(".plb-prev").style.display = nav ? "flex" : "none";
  photoLightbox.querySelector(".plb-next").style.display = nav ? "flex" : "none";
  count.style.display = nav ? "block" : "none";
  count.textContent = `${plbIndex + 1} / ${plbUrls.length}`;
}
function openPhotoViewer(urls, index) {
  plbUrls = urls;
  plbIndex = index;
  renderPhotoViewer();
  photoLightbox.classList.add("open");
}
function closePhotoViewer() {
  photoLightbox.classList.remove("open");
  photoLightbox.querySelector("img").src = "";
}
function plbPrev() { if (!plbUrls.length) return; plbIndex = (plbIndex - 1 + plbUrls.length) % plbUrls.length; renderPhotoViewer(); }
function plbNext() { if (!plbUrls.length) return; plbIndex = (plbIndex + 1) % plbUrls.length; renderPhotoViewer(); }
photoLightbox.addEventListener("click", (e) => {
  if (e.target === photoLightbox || e.target.closest(".plb-close")) closePhotoViewer();
  else if (e.target.closest(".plb-prev")) plbPrev();
  else if (e.target.closest(".plb-next")) plbNext();
});
document.addEventListener("keydown", (e) => {
  if (!photoLightbox.classList.contains("open")) return;
  if (e.key === "Escape") closePhotoViewer();
  else if (e.key === "ArrowLeft") plbPrev();
  else if (e.key === "ArrowRight") plbNext();
});
document.addEventListener("click", (e) => {
  const img = e.target.closest(".photo-thumb img, .past-photos img, .cd-photos img");
  if (!img) return;
  const gallery = img.closest(".photo-grid, .past-photos, .cd-photos");
  const urls = [...gallery.querySelectorAll("img")].map(i => i.src);
  openPhotoViewer(urls, urls.indexOf(img.src));
});
let plbTouchStartX = null;
photoLightbox.addEventListener("touchstart", (e) => {
  plbTouchStartX = e.touches[0].clientX;
}, { passive: true });
photoLightbox.addEventListener("touchend", (e) => {
  if (plbTouchStartX === null) return;
  const dx = e.changedTouches[0].clientX - plbTouchStartX;
  if (Math.abs(dx) > 40) { dx > 0 ? plbPrev() : plbNext(); }
  plbTouchStartX = null;
});

init();
</script>
</body>
</html>
