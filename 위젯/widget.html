<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>할 일 위젯</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --paper: #FFFDF8; --ink: #2B241E; --muted: #A99C88; --line: #EAE0CC;
    --coral: #FF6B4A; --coral-soft: #FFE4D8; --sage: #6FA88A; --gcal: #4285F4; --gcal-soft: #E8F0FE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 13px/1.4 'Pretendard', 'Malgun Gothic', sans-serif; user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid var(--line); }

  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 6px;
    padding: 7px 8px 6px 10px; border-bottom: 1px solid var(--line); cursor: move; }
  header .tabs { display: flex; gap: 2px; }
  header button, .tabs button { -webkit-app-region: no-drag; border: 0; background: none; cursor: pointer;
    font: inherit; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .tabs button.on { color: var(--ink); background: var(--coral-soft); font-weight: 700; }
  header .sp { flex: 1; }
  header .icon { font-size: 13px; padding: 2px 5px; }
  header .icon:hover, .tabs button:hover { background: #F3ECDD; }
  #pinBtn { filter: grayscale(1); opacity: .45; }
  #pinBtn.on { filter: none; opacity: 1; background: var(--coral-soft); }

  #opRow { display: none; align-items: center; gap: 6px; padding: 5px 10px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 11px; }
  #opRow.show { display: flex; }
  #opRow input { flex: 1; accent-color: var(--coral); }

  main { flex: 1; overflow-y: auto; padding: 4px 0 6px; }
  main::-webkit-scrollbar { width: 6px; } main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .day { padding: 6px 10px 2px; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .day b { color: var(--ink); font-weight: 700; }
  .day.today b { color: var(--coral); }
  .day.target { background: var(--coral-soft); }
  .day.past { opacity: .55; }

  .item { display: flex; align-items: flex-start; gap: 7px; padding: 4px 10px; }
  .item:hover { background: #F7F1E4; }
  .chk { flex: none; width: 15px; height: 15px; margin-top: 1px; border: 1.5px solid #CFC3AD; border-radius: 4px;
    cursor: pointer; display: grid; place-items: center; font-size: 10px; color: #fff; }
  .item.done .chk { background: var(--sage); border-color: var(--sage); }
  .item.done .t { color: var(--muted); text-decoration: line-through; }
  .t { flex: 1; word-break: keep-all; overflow-wrap: anywhere; }
  .t small { color: var(--muted); margin-left: 4px; }
  .over { color: var(--coral); font-size: 10.5px; margin-left: 4px; }
  .del { visibility: hidden; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 13px; }
  .item:hover .del { visibility: visible; }
  .ev .chk { border-color: #9DB8EC; }
  .ev.done .chk { background: var(--gcal); border-color: var(--gcal); }
  .ev .t { color: #2F5DB5; cursor: pointer; }
  .empty { color: var(--muted); padding: 10px; text-align: center; font-size: 12px; }

  footer { border-top: 1px solid var(--line); padding: 6px 8px; display: flex; gap: 6px; }
  footer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px;
    font: inherit; background: #fff; outline: none; }
  footer input:focus { border-color: var(--coral); }
  footer button { border: 0; border-radius: 7px; background: var(--coral); color: #fff; padding: 0 10px; cursor: pointer; font: inherit; font-weight: 700; }

  #login { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  #login input { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit; }
  #login button { border: 0; border-radius: 7px; background: var(--coral); color: #fff; padding: 7px; font: inherit; font-weight: 700; cursor: pointer; }
  #login p { margin: 0; color: var(--muted); font-size: 12px; }
  #msg { position: fixed; left: 8px; right: 8px; bottom: 46px; background: var(--ink); color: #fff; font-size: 11.5px;
    padding: 6px 9px; border-radius: 7px; display: none; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button data-tab="today">오늘</button>
    <button data-tab="week">이번 주</button>
  </div>
  <div class="sp"></div>
  <button class="icon" id="pinBtn" title="항상 위에 고정">📌</button>
  <button class="icon" id="opBtn" title="흐리기 조절">◐</button>
  <button class="icon" id="reload" title="새로고침">↻</button>
  <button class="icon" id="openApp" title="마이플래너 앱 열기">↗</button>
  <button class="icon" id="hideBtn" title="내리기 (작업 표시줄에서 다시 열어요)">—</button>
</header>
<div id="opRow">흐리게 <input type="range" id="op" min="25" max="100" step="5"> 밝게</div>
<main id="list"></main>
<footer id="addBar">
  <input id="addInput" placeholder="오늘 할 일 추가">
  <button id="addBtn">추가</button>
</footer>
<div id="msg"></div>

<script>
const SUPABASE_URL = "https://iiezctjbwsaushpxafcz.supabase.co";
const SUPABASE_KEY = "sb_publishable_XhakCx4w4s7KRczs1kOcJQ_J8Qq11hK";
const GCAL_TOKEN_API = "https://my-planner-fawn-nine.vercel.app/api/gcal-token";
const PLANNER_URL = "https://my-planner-fawn-nine.vercel.app/";
const DAY = ["일","월","화","수","목","금","토"];
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));

let tasks = [], log = [], events = [];
let tab = localStorage.getItem("tab") || "today";
let target = null;          // 이번 주 탭에서 할 일을 넣을 날 (요일 머리를 눌러 고름)
let gcalAccess = null, gcalExp = 0;

/* ---------- 날짜 ---------- */
const ds = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => ds(new Date());
function weekDates() {               // 이번 주 월~일 (마이플래너 주간보드와 같은 월요일 시작)
  const d = new Date(); const dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  return Array.from({ length: 7 }, () => { const s = ds(d); d.setDate(d.getDate() + 1); return s; });
}
const label = (s) => { const d = new Date(s + "T00:00:00"); return `${DAY[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`; };

/* ---------- 흐리기: 평소엔 고른 값, 마우스를 올리면 선명하게 ---------- */
$("op").value = localStorage.getItem("idleOpacity") || 75;
$("op").addEventListener("input", (e) => { localStorage.setItem("idleOpacity", e.target.value); widget.previewOpacity(e.target.value / 100); });
$("opBtn").onclick = () => $("opRow").classList.toggle("show");
$("hideBtn").onclick = () => widget.hide();
$("openApp").onclick = () => widget.openPlanner();
const paintPin = (on) => { $("pinBtn").classList.toggle("on", on); $("pinBtn").title = on ? "항상 위에 고정됨 — 누르면 풀기" : "누르면 항상 위에 고정"; };
widget.pin().then(paintPin);
$("pinBtn").onclick = async () => paintPin(await widget.pin(!$("pinBtn").classList.contains("on")));
$("reload").onclick = () => refresh(true);
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; localStorage.setItem("tab", tab); target = null; render(); });

function msg(t) { const m = $("msg"); m.textContent = t; m.style.display = "block"; clearTimeout(msg.h); msg.h = setTimeout(() => m.style.display = "none", 3500); }

/* ---------- 로그인 (처음 한 번 — 마이플래너와 같은 계정) ---------- */
function showLogin() {
  $("addBar").style.display = "none";
  $("list").innerHTML = `<form id="login">
    <p>마이플래너 계정으로 한 번만 로그인하면 계속 유지돼요.</p>
    <input id="em" type="email" placeholder="이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button>로그인</button></form>`;
  $("login").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
    if (error) return msg("로그인 실패: " + error.message);
    $("addBar").style.display = "";
    refresh(true);
  };
}

/* ---------- 데이터 ---------- */
async function loadTasks() {
  const w = weekDates();
  const [t, r] = await Promise.all([
    sb.from("tasks").select("*").order("created_at", { ascending: true }),
    sb.from("repeat_log").select("*").gte("done_on", w[0]).lte("done_on", w[6]),
  ]);
  if (t.error || r.error) { msg("불러오기 실패: " + (t.error || r.error).message); return false; }
  tasks = t.data || []; log = r.data || [];
  return true;
}

// 구글 캘린더 — 마이플래너가 DB(user_settings)에 보관한 리프레시 토큰을 그대로 쓴다(읽기 전용)
async function gcalToken() {
  if (gcalAccess && Date.now() < gcalExp - 60000) return gcalAccess;
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data } = await sb.from("user_settings").select("gcal_refresh_token").eq("user_id", user.id).maybeSingle();
  if (!data || !data.gcal_refresh_token) return null;
  const res = await fetch(GCAL_TOKEN_API, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: data.gcal_refresh_token }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.access_token) return null;
  gcalAccess = j.access_token; gcalExp = Date.now() + j.expires_in * 1000;
  return gcalAccess;
}
async function loadEvents() {
  try {
    const tok = await gcalToken(); if (!tok) return;
    const w = weekDates();
    const min = new Date(w[0] + "T00:00:00").toISOString();
    const max = new Date(new Date(w[6] + "T00:00:00").getTime() + 86400000).toISOString();
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(min)}&timeMax=${encodeURIComponent(max)}&singleEvents=true&orderBy=startTime`,
      { headers: { Authorization: `Bearer ${tok}` } });
    if (res.status === 401) { gcalAccess = null; return; }
    const j = await res.json();
    events = (j.items || []).map(ev => {
      const s = ev.start?.dateTime || ev.start?.date; if (!s) return null;
      const allDay = !ev.start.dateTime;
      let end = s.slice(0, 10);
      const e = ev.end?.dateTime || ev.end?.date;
      if (e) {
        const d = new Date(allDay ? e + "T00:00:00" : e);
        if (allDay || (d.getHours() === 0 && d.getMinutes() === 0)) d.setDate(d.getDate() - 1);  // 끝 날짜는 '다음 날 0시'라 하루 뺀다
        end = ds(d) < s.slice(0, 10) ? s.slice(0, 10) : ds(d);
      }
      return { id: ev.id, date: s.slice(0, 10), end, title: ev.summary || "(제목 없음)", link: ev.htmlLink };
    }).filter(Boolean);
  } catch {}
}

/* 마이플래너 주간보드와 같은 규칙: 반복은 요일, 아니면 마감일. 마감 지난 미완료는 '오늘'로 모은다 */
function tasksOn(d) {
  const t0 = today(), dow = new Date(d + "T00:00:00").getDay();
  return tasks.filter(t => {
    if (t.repeat_days && t.repeat_days.length) return t.repeat_days.includes(dow);
    if (!t.due) return false;
    if (!t.done_at && t.due <= t0) return d === t0;
    return t.due === d;
  });
}
const isRepeat = (t) => !!(t.repeat_days && t.repeat_days.length);
function subDone(t, d) {
  if (isRepeat(t)) { const r = log.find(x => x.task_id === t.id && x.done_on === d); return (r && r.sub_done) || []; }
  return t.sub_done || [];
}
function isDone(t, d) {
  if (t.sub_total > 0) return subDone(t, d).length >= t.sub_total;
  return isRepeat(t) ? log.some(x => x.task_id === t.id && x.done_on === d) : !!t.done_at;
}

/* ---------- 그리기 ---------- */
function itemEl(t, d) {
  const done = isDone(t, d), sub = t.sub_total > 0;
  const el = document.createElement("div");
  el.className = "item" + (done ? " done" : "");
  const over = !isRepeat(t) && !done && t.due && t.due < today() ? `<span class="over">${Number(t.due.slice(5,7))}/${Number(t.due.slice(8))} 지남</span>` : "";
  const cnt = sub ? `<small>${subDone(t, d).length}/${t.sub_total}</small>` : "";
  el.innerHTML = `<div class="chk">${done ? "✓" : ""}</div><div class="t">${esc(t.title)}${cnt}${over}</div>` +
    (isRepeat(t) ? "" : `<button class="del" title="지우기">×</button>`);
  // 편수 체크리스트(여러 편 올리는 배치)는 번호별로 체크해야 해서 마이플래너에서 연다
  el.querySelector(".chk").onclick = () => sub ? widget.openPlanner() : toggle(t, d);
  el.querySelector(".t").ondblclick = () => widget.openPlanner();
  const del = el.querySelector(".del");
  if (del) del.onclick = () => remove(t);
  return el;
}
/* 캘린더 일정은 읽기 전용이라 완료 표시는 이 컴퓨터에만 저장한다 (일정id|날짜) */
let evDone = {};
try { evDone = JSON.parse(localStorage.getItem("evDone") || "{}"); } catch {}
(() => { const cut = ds(new Date(Date.now() - 30 * 86400000));   // 30일 지난 기록은 정리
  for (const k in evDone) if (k.split("|")[1] < cut) delete evDone[k]; })();
function eventEl(ev, d) {
  const key = ev.id + "|" + d, done = !!evDone[key];
  const el = document.createElement("div");
  el.className = "item ev" + (done ? " done" : "");
  el.innerHTML = `<div class="chk">${done ? "✓" : ""}</div><div class="t" title="누르면 구글 캘린더가 열려요">${esc(ev.title)}</div>`;
  el.querySelector(".chk").onclick = () => {
    if (done) delete evDone[key]; else evDone[key] = 1;
    try { localStorage.setItem("evDone", JSON.stringify(evDone)); } catch {}
    render();
  };
  el.querySelector(".t").onclick = () => ev.link && widget.open(ev.link);
  return el;
}
function dayBlock(d, box, showHead) {
  const list = tasksOn(d).sort((a, b) => isDone(a, d) - isDone(b, d));
  const evs = events.filter(e => e.date <= d && d <= e.end).sort((a, b) => !!evDone[a.id + "|" + d] - !!evDone[b.id + "|" + d]);
  if (showHead) {
    const h = document.createElement("div");
    const t0 = today();
    h.className = "day" + (d === t0 ? " today" : "") + (d < t0 ? " past" : "") + (target === d ? " target" : "");
    const n = list.filter(t => isDone(t, d)).length + evs.filter(e => evDone[e.id + "|" + d]).length, all = list.length + evs.length;
    h.innerHTML = `<b>${label(d)}${d === t0 ? " · 오늘" : ""}</b><span>${all ? n + "/" + all : ""}</span>`;
    h.title = "누르면 이 날에 할 일을 추가해요";
    h.onclick = () => { target = target === d ? null : d; render(); $("addInput").focus(); };
    box.appendChild(h);
  }
  evs.forEach(e => box.appendChild(eventEl(e, d)));
  list.forEach(t => box.appendChild(itemEl(t, d)));
  if (!showHead && !list.length && !evs.length) box.innerHTML = `<div class="empty">오늘 할 일이 없어요 🙂</div>`;
}
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const box = document.createElement("div");
  if (tab === "today") dayBlock(today(), box, false);
  else weekDates().forEach(d => dayBlock(d, box, true));
  const keep = $("list").scrollTop;
  $("list").replaceChildren(box);
  $("list").scrollTop = keep;
  const to = tab === "week" && target ? target : today();
  $("addInput").placeholder = to === today() ? "오늘 할 일 추가" : `${label(to)}에 추가`;
  if (tab === "week" && !keep) { const el = $("list").querySelector(".day.today"); if (el) el.scrollIntoView({ block: "start" }); }
}

/* ---------- 쓰기 ---------- */
async function toggle(t, d) {
  const on = !isDone(t, d);
  if (isRepeat(t)) {
    if (on) log.push({ task_id: t.id, done_on: d }); else log = log.filter(x => !(x.task_id === t.id && x.done_on === d));
    render();
    const { error } = on ? await sb.from("repeat_log").insert({ task_id: t.id, done_on: d })
                         : await sb.from("repeat_log").delete().eq("task_id", t.id).eq("done_on", d);
    if (error) { msg("저장 실패: " + error.message); refresh(); }
  } else {
    t.done_at = on ? new Date().toISOString() : null;
    render();
    const { error } = await sb.from("tasks").update({ done_at: t.done_at }).eq("id", t.id);
    if (error) { msg("저장 실패: " + error.message); refresh(); }
  }
}
async function add() {
  const title = $("addInput").value.trim(); if (!title) return;
  const due = tab === "week" && target ? target : today();
  $("addInput").value = "";
  const { data, error } = await sb.from("tasks").insert({ title, due }).select().single();
  if (error) return msg("추가 실패: " + error.message);
  tasks.push(data); render();
}
async function remove(t) {
  if (!confirm(`'${t.title}' 지울까요?`)) return;
  tasks = tasks.filter(x => x.id !== t.id); render();
  const { error } = await sb.from("tasks").delete().eq("id", t.id);
  if (error) { msg("지우기 실패: " + error.message); refresh(); }
}
$("addBtn").onclick = add;
$("addInput").addEventListener("focus", () => widget.typing(true));
$("addInput").addEventListener("blur", () => widget.typing(false));
$("addInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) add(); });

/* ---------- 새로고침: 3분마다 + 창을 눌렀을 때 (휴대폰·마이플래너에서 바꾼 것도 따라온다) ---------- */
let busy = false, last = 0;
async function refresh(force) {
  if (busy || (!force && Date.now() - last < 20000)) return;
  busy = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showLogin(); return; }
    if (await loadTasks()) { await loadEvents(); last = Date.now(); render(); }
  } finally { busy = false; }
}
window.addEventListener("focus", () => refresh());
setInterval(() => refresh(true), 180000);
refresh(true);
</script>
</body>
</html>
